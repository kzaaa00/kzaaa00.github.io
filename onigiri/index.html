<meta property="og:type" content="website">

<style>
/* A rice ball in its film, the middle tape already pulled. Pull tab 2 out to the left and tab 3 out to the right.
   Pull off the straight line and the nori's corner tears and goes with the film. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1f2228}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#e7d5b8;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#f6efe2,#eadfcb)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(25px,7.8vw,39px);line-height:1.45;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9ccd2}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="テーブルの上の、フィルムに包まれたおにぎりの画面"></canvas>

  <div id="title" class="panel">
    <h1>コンビニおにぎりの海苔を、<br>破らずに開けろ。</h1>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">商品はすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>おにぎりの結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、開けたあとのおにぎりの画面">
      <p class="fine">商品はすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='コンビニおにぎりの海苔を、破らずに開けろ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://kzaaa00.github.io/onigiri/';})();

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const D=120;       /* each half of the film has to travel this far sideways to come off the nori */
const TOL=6;       /* up-down offset (px) the film forgives, for a slow pull; the faster the pull, the less */
const K=.15;       /* nori torn per px pulled = K x m x (offset beyond the allowance)^2, m = 1 + speed/V0 */
const V0=250;      /* px/s */
const VT=.1;       /* speed smoothing, s */
const AREA=14300;  /* the nori seen from the front, px^2 */
const MAG=2;       /* the film's up-down offset is drawn this many times larger */
const MMPX=.5;     /* mm per px: the rice ball is about 115 mm wide */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('onigiri-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  rustle(){noise(.05,.07,3200,0,'bandpass',1.5);},
  rip(){noise(.07,.16,1800,0,'bandpass',3);noise(.05,.1,700,.03,'bandpass',2);},
  off(){noise(.16,.12,5000,0,'highpass');},
  done(){tone(660,.05,'triangle',.03);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('onigiri-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1;
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
/* the rice ball: apex at the top, base below. The nori covers the part below NT. */
function L(){const Yc=Math.round(Math.max(250,Math.min(H-200,H*.48)));return {Yc,top:Yc-110,base:Yc+70,NT:Yc-10,X:180,HW:115};}
function edgeX(y,side){const {top,base,X,HW}=L();return X+side*HW*clamp((y-top)/(base-top),0,1);}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}

/* ---------- one side of the film ---------- */
function newSide(){return {fx:0,fy:0,v:0,up:0,down:0,maxUp:0,maxDown:0,started:false,t0:0,time:0,done:false,flyAt:0};}
/* the finger is out (sideways, px) and fy (down +) from where it went down; dt s since the last point */
function advance(S,out,fy,dt){
  if(S.done)return;
  dt=Math.max(0,dt||0);
  const prev=S.fx,pfy=S.fy;S.fy=fy;
  if(out<=prev)return;
  if(!S.started){S.started=true;dt=Math.min(dt,1/60);}
  S.time+=dt;
  const ds=out-prev,vi=ds/Math.max(dt,1e-3);S.v=S.v?S.v+(vi-S.v)*(1-Math.exp(-dt/VT)):vi;
  const m=1+S.v/V0,tol=TOL/m;
  for(let s=0;s<ds;s+=1){const st=Math.min(1,ds-s),y=pfy+(fy-pfy)*((s+st)/ds);const e=Math.max(0,Math.abs(y)-tol);
    const a=K*m*e*e*st;if(y<0)S.up+=a;else S.down+=a;
    if(y<0)S.maxUp=Math.max(S.maxUp,-y);else S.maxDown=Math.max(S.maxDown,y);}
  const cap=AREA*.5,tot=S.up+S.down;if(tot>cap){S.up*=cap/tot;S.down*=cap/tot;} /* a side can lose at most its own half */
  S.fx=Math.min(D,out);
  if(out>=D)S.done=true;
}
function tornPct(S){return (S.up+S.down)/AREA*100;}

/* ---------- state ---------- */
let G=null,PREV=null,ROUND=0;
function newGame(){ROUND++;G={phase:'L',sides:{L:newSide(),R:newSide()},drag:null,res:null,shown:false,snap:null,snapped:false,clock0:0,round:ROUND,lastRip:0,lastRustle:0,plan:null};}
function cur(){return G.sides[G.phase];}
function dirOf(){return G.phase==='L'?-1:1;}

/* ---------- input: put a finger down anywhere and pull sideways ---------- */
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
cv.addEventListener('pointerdown',e=>{if(!G||G.plan||(G.phase!=='L'&&G.phase!=='R')||G.drag)return;ac();try{cv.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();
  const P=pt(e);const S=cur();G.drag={id:e.pointerId,x0:P.x-dirOf()*S.fx,y0:P.y,ts:e.timeStamp};});
cv.addEventListener('pointermove',e=>{if(!G||!G.drag||e.pointerId!==G.drag.id)return;
  let evs=[e];try{const c=e.getCoalescedEvents&&e.getCoalescedEvents();if(c&&c.length)evs=c;}catch(err){}
  for(const ev of evs){if(!G.drag)break;const P=pt(ev);const ts=ev.timeStamp||e.timeStamp;const dt=Math.max(0,(ts-G.drag.ts)/1000);G.drag.ts=Math.max(G.drag.ts,ts);
    pull(dirOf()*(P.x-G.drag.x0),P.y-G.drag.y0,dt,ts);}});
const up=e=>{if(!G||!G.drag||e.pointerId!==G.drag.id)return;G.drag=null;if(G.phase==='L'||G.phase==='R')cur().fy=0;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function pull(out,fy,dt,ts){
  const S=cur();const before=tornPct(S);
  if(!G.clock0&&out>S.fx)G.clock0=ts||performance.now();
  advance(S,out,fy,dt);
  const now=performance.now();
  if(tornPct(S)-before>.02&&now-G.lastRip>70){G.lastRip=now;SFX.rip();}
  else if(now-G.lastRustle>90&&out>0){G.lastRustle=now;SFX.rustle();}
  if(S.done){S.flyAt=now;S.endTs=ts||now;SFX.off();G.drag=null;
    if(G.phase==='L')G.phase='R';else finish(S.endTs);}
}
function finish(endTs){
  const L_=G.sides.L,R_=G.sides.R,t=tornPct(L_)+tornPct(R_);
  const clean=t<.05;
  G.res={clean,torn:t,tornL:tornPct(L_),tornR:tornPct(R_),time:Math.max(0,(endTs-G.clock0)/1000),L:L_,R:R_};
  G.phase='end';G.endAt=performance.now();
  if(!clean&&t>=5)setTimeout(()=>anim($('app'),'shake'),120);
  G.endIn=1500;
}
/* a planned pull for checks and recording: each side {ang (deg, + = down), sway (px), T (s)}, gap s between */
function planY(p,x){return Math.tan((p.ang||0)*Math.PI/180)*x+(p.sway||0)*Math.sin(x/(p.wl||70)*Math.PI*2)+(p.bend||0)*Math.pow(x/D,2);}
function play(plan){begin();G.plan={...plan,at:performance.now()+(plan.wait??250),k:'L',x:0};}
function step(now){
  const P=G.plan;
  if(P&&(G.phase==='L'||G.phase==='R')&&now>=P.at){
    const p=P[G.phase]||{},T=p.T||.5,spd=D/T;const k=G.phase;
    const target=Math.min(D+2,(now-P.at)/1000*spd);
    while(P.x+2<=target&&G.phase===k){P.x+=2;pull(P.x,planY(p,P.x),2/spd,P.at+P.x/spd*1000);}
    if(G.phase!==k){P.at=now+(P.gap??220)*1;P.x=0;}
  }
  if(G.phase==='end'){const a=(now-G.endAt)/1000;
    if(!G.snapped&&a>=.75){G.snapped=true;takeSnap();}
    if(a*1000>=G.endIn&&!G.shown){G.shown=true;showResult();}}
}

/* ---------- drawing ---------- */
function drawTable(x){
  x.fillStyle='#e7d5b8';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(130,90,50,.10)';x.lineWidth=1.4;
  for(let i=0;i<20;i++){const y=(i+.4)*H/20;x.beginPath();x.moveTo(0,y);for(let k=1;k<=8;k++)x.lineTo(k*W/8,y+Math.sin(i*2.1+k*1.3)*4);x.stroke();}
  /* a cup of tea, to say "lunch" */
  const {top}=L();const cy=Math.max(46,top-70);
  x.fillStyle='rgba(0,0,0,.08)';x.beginPath();x.ellipse(310,cy+8,34,12,0,0,Math.PI*2);x.fill();
  x.fillStyle='#8aa37a';rr(x,282,cy-34,56,44,10);x.fill();x.fillStyle='#b9cc9f';x.beginPath();x.ellipse(310,cy-34,28,8,0,0,Math.PI*2);x.fill();
  x.fillStyle='#c9b060';x.beginPath();x.ellipse(310,cy-33,22,5.5,0,0,Math.PI*2);x.fill();
}
function triPath(x,dx=0,dy=0){const {top,base,X,HW}=L();x.beginPath();x.moveTo(X+dx,top+dy);x.quadraticCurveTo(X+dx+6,top+dy-6,X+dx+12,top+dy+8);
  x.lineTo(X+HW-8+dx,base-10+dy);x.quadraticCurveTo(X+HW+6+dx,base+dy,X+HW-14+dx,base+dy);x.lineTo(X-HW+14+dx,base+dy);x.quadraticCurveTo(X-HW-6+dx,base+dy,X-HW+8+dx,base-10+dy);
  x.lineTo(X-12+dx,top+dy+8);x.quadraticCurveTo(X+dx-6,top+dy-6,X+dx,top+dy);x.closePath();}
/* torn wedges: a triangle at the nori's lower outer corner (pulled down) or where its top edge meets the side (pulled up) */
function wedge(side,kind,area){
  const {base,NT}=L();const s=Math.sqrt(2*area);if(s<.5)return null;
  if(kind==='down'){const cxp=edgeX(base,side)-side*12,cy=base;return [[cxp,cy],[cxp-side*s*1.1,cy],[cxp,cy-s*.9]];}
  const ex=edgeX(NT,side),ey=NT;return [[ex,ey],[ex-side*s*1.1,ey],[edgeX(ey+s*.9,side),ey+s*.9]];
}
function poly(x,p,dx=0,dy=0){x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a+dx,b+dy):x.moveTo(a+dx,b+dy));x.closePath();}
function noriTexture(x){const {NT,base}=L();
  x.fillStyle='#1d2a20';x.fillRect(0,NT,W,base-NT+4);
  x.strokeStyle='rgba(120,150,110,.14)';x.lineWidth=1;for(let i=0;i<26;i++){const y=NT+3+i*3.2;x.beginPath();x.moveTo(40,y);x.lineTo(320,y+Math.sin(i)*1.5);x.stroke();}
  for(let i=0;i<40;i++){x.fillStyle=`rgba(140,170,120,${.06+rnd(i)*.08})`;x.fillRect(50+rnd(i+3)*260,NT+rnd(i+9)*(base-NT),3+rnd(i+5)*6,1.2);}
}
function drawRiceBall(x,now){
  const {top,base,NT,X}=L();
  x.fillStyle='rgba(90,60,30,.2)';x.beginPath();x.ellipse(X+4,base+6,128,12,0,0,Math.PI*2);x.fill();
  /* rice */
  x.save();triPath(x);x.clip();
  const g=x.createLinearGradient(0,top,0,base);g.addColorStop(0,'#fffdf7');g.addColorStop(1,'#efe9dc');x.fillStyle=g;x.fillRect(0,top-10,W,base-top+20);
  for(let i=0;i<70;i++){x.fillStyle='rgba(200,190,165,.35)';x.beginPath();x.ellipse(70+rnd(i)*220,top+rnd(i+7)*(base-top),2.4,1.3,rnd(i+2)*3,0,Math.PI*2);x.fill();}
  /* nori, minus what the film took */
  x.save();noriTexture(x);x.restore();
  for(const k of ['L','R']){const S=G?G.sides[k]:null;if(!S)continue;const side=k==='L'?-1:1;
    if(S.up+S.down>=AREA*.49){const {X,NT,base}=L();x.fillStyle='#f6f1e6';x.fillRect(side<0?0:X,NT-1,X,base-NT+12);continue;}
    for(const kind of ['up','down']){const w=wedge(side,kind,S[kind]);if(w){x.fillStyle='#f6f1e6';poly(x,w);x.fill();x.strokeStyle='rgba(29,42,32,.6)';x.lineWidth=1;x.stroke();}}}
  x.restore();
  /* the seam where tape 1 came off */
  x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1;x.beginPath();x.moveTo(X,top);x.lineTo(X,base);x.stroke();
}
/* a film half: covers its side of the triangle, with the tab at the bottom corner; dx,dy is how far it has been pulled */
function drawFilm(x,side,S,now){
  const {top,base,X,HW}=L();
  let dx=side*S.fx,dy=S.fy*MAG,alpha=1;
  if(S.done){const a=(now-S.flyAt)/1000;dx=side*(D+a*600);dy=S.fy*MAG+a*a*500;alpha=Math.max(0,1-a*2.2);if(alpha<=0)return;}
  x.save();x.globalAlpha=alpha;
  x.save();x.beginPath();x.rect(side<0?X+dx-400:X+dx,0,400,H);x.clip();
  triPath(x,dx,dy);x.fillStyle='rgba(255,255,255,.22)';x.fill();x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=1.6;x.stroke();
  x.restore();
  /* the edge of the film along the seam */
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.6;x.beginPath();x.moveTo(X+dx,top+dy);x.lineTo(X+dx,base+dy);x.stroke();
  /* printed stripes and the sticker on this half */
  x.strokeStyle='rgba(200,60,40,.55)';x.lineWidth=2;x.beginPath();x.moveTo(X+dx+side*8,top+26+dy);x.lineTo(edgeX(top+26,side)+dx-side*4,top+26+dy);x.stroke();
  /* torn nori riding on the film */
  if(S.up+S.down>=AREA*.49){const {NT,base}=L();x.fillStyle='#1d2a20';x.beginPath();x.moveTo(X+dx,NT+dy);x.lineTo(edgeX(NT,side)+dx,NT+dy);x.lineTo(edgeX(base,side)-side*10+dx,base+dy);x.lineTo(X+dx,base+dy);x.closePath();x.fill();}
  else for(const kind of ['up','down']){const w=wedge(side,kind,S[kind]);if(w){x.fillStyle='#1d2a20';poly(x,w,dx,dy);x.fill();x.strokeStyle='rgba(140,170,120,.5)';x.lineWidth=1;x.stroke();}}
  /* the tab */
  const tx=X+side*(HW+2)+dx,ty=base-6+dy;
  x.fillStyle='rgba(255,255,255,.92)';x.beginPath();x.moveTo(tx-side*16,ty-12);x.lineTo(tx+side*24,ty-8);x.lineTo(tx+side*24,ty+8);x.lineTo(tx-side*16,ty+12);x.closePath();x.fill();
  x.strokeStyle='rgba(120,120,120,.5)';x.lineWidth=1;x.stroke();
  x.fillStyle='#d23c28';x.beginPath();x.arc(tx+side*4,ty,8,0,Math.PI*2);x.fill();
  x.fillStyle='#fff';x.font='900 11px '+getComputedStyle(document.documentElement).getPropertyValue('--body');x.textAlign='center';x.textBaseline='middle';x.fillText(side<0?'2':'3',tx+side*4,ty+.5);
  x.strokeStyle='#d23c28';x.lineWidth=2;x.beginPath();x.moveTo(tx+side*14,ty);x.lineTo(tx+side*22,ty);x.moveTo(tx+side*22,ty);x.lineTo(tx+side*18,ty-3);x.moveTo(tx+side*22,ty);x.lineTo(tx+side*18,ty+3);x.stroke();
  x.restore();
}
function drawSticker(x){const {top,X}=L();x.fillStyle='#f4e6c8';rr(x,X-30,top+48,60,24,5);x.fill();x.strokeStyle='rgba(150,110,60,.5)';x.lineWidth=1;x.stroke();
  x.fillStyle='#7a4a24';x.font='900 13px '+getComputedStyle(document.documentElement).getPropertyValue('--body');x.textAlign='center';x.textBaseline='middle';x.fillText('しゃけ',X,top+60.5);}
function pill(label,lx,ly){cx.save();cx.font='900 15px '+getComputedStyle(document.documentElement).getPropertyValue('--body');cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(label).width+22;cx.fillStyle='rgba(36,38,43,.86)';rr(cx,lx-w/2,ly-15,w,30,15);cx.fill();cx.fillStyle='#fff';cx.fillText(label,lx,ly+1);cx.restore();}

function render(now){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  drawTable(cx);
  drawRiceBall(cx,now);
  const show=!G||G.phase==='L'||G.phase==='R'||G.phase==='end';
  if(show){
    if(!G||!G.sides.L.done||now-G.sides.L.flyAt<600)drawFilm(cx,-1,G?G.sides.L:newSide(),now);
    if(!G||!G.sides.R.done||now-G.sides.R.flyAt<600)drawFilm(cx,1,G?G.sides.R:newSide(),now);
    if(!G||!G.sides.L.done)drawSticker(cx);
  }
  if(G&&G.round===1&&!G.plan&&!G.clock0){const {base}=L();pill('②を左へ、③を右へ引く',180,Math.min(H-28,base+52));}
}
function loop(now){requestAnimationFrame(loop);if(G)step(now);render(now);}
requestAnimationFrame(loop);
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- result ---------- */
function cropBox(){const {top,base}=L();return {y0:Math.max(0,top-34),y1:Math.min(H,base+40)};}
function takeSnap(){
  /* a resize (the phone's address bar moving) clears the canvas between frames; draw it again so the picture is never blank */
  try{render(performance.now());}catch(e){}
  try{const {y0,y1}=cropBox(),r=SC*DPR;const c=document.createElement('canvas');c.width=cv.width;c.height=Math.round((y1-y0)*r);
    c.getContext('2d').drawImage(cv,0,Math.round(y0*r),cv.width,c.height,0,0,c.width,c.height);G.snap=c;}catch(e){}
}
function devOf(t){return t<.05?0:Math.max(.1,Math.ceil(t*10-1e-9)/10);}
function score(){return Math.max(0,Math.round((100-devOf(G.res.torn))*10)/10);}
function pctText(){return score().toFixed(1);}
function tornText(){return devOf(G.res.torn).toFixed(1);}
function secText(t){return (Math.round(t*100)/100).toFixed(2);}
function timeText(){return secText(G.res.time);}
function titleOf(){
  const r=G.res,s=score();
  if(r.clean){const t=+timeText();
    if(t<.6)return '海苔を一瞬で巻く人';if(t<1)return 'おにぎりを開ける達人';if(t<1.6)return 'コンビニの常連';
    if(t<3)return 'ていねいに開ける人';if(t<6)return 'じっくり開ける人';return 'おにぎりと見つめ合った人';}
  if(s>=99)return '角をちょっとだけ残した人';
  if(s>=95)return '角がフィルムに残った人';
  if(s>=85)return '海苔が欠けた人';
  if(s>=60)return '海苔をフィルムに持っていかれた人';
  return 'ごはんむき出しの人';
}
function devMM(S){const up=S.maxUp,dn=S.maxDown;const v=Math.max(up,dn)*MMPX;return (v<.05?'':(dn>=up?'下':'上'))+v.toFixed(1)+'mm';}
function devLine(){const r=G.res;return `ずれ：②${devMM(r.L)}・③${devMM(r.R)}`;}
function tearLine(){const r=G.res;return `破れ：②${devOf(r.tornL).toFixed(1)}%・③${devOf(r.tornR).toFixed(1)}%`;}
function speedLine(){const r=G.res;return `速さ：②${secText(r.L.time)}秒・③${secText(r.R.time)}秒（速いほどずれに厳しい）`;}
function cardLine(){const r=G.res;return r.clean?`ずれ：②${devMM(r.L)}・③${devMM(r.R)}（海苔は破れなかった）`:`ずれ：②${devMM(r.L)}・③${devMM(r.R)}（破れ ②${devOf(r.tornL).toFixed(1)}%・③${devOf(r.tornR).toFixed(1)}%）`;}
function statusLine(){return G.res.clean?`${timeText()}秒で全部きれいに開けた`:`海苔が${tornText()}%破れた`;}
function bigLabel(){return G.res.clean?'全部きれいに開けたタイム':'のこった海苔';}
function bigNum(){return G.res.clean?[timeText(),'秒']:[pctText(),'%'];}
function prevText(){return G.res.clean?`${timeText()}秒で全部きれい`:`海苔${pctText()}%（②${devMM(G.res.L)}・③${devMM(G.res.R)}）`;}
function shareText(){
  if(G.res.clean)return `コンビニおにぎりの海苔を破らずに開けろ　${timeText()}秒で全部きれいに開けた【${titleOf()}】\n${SHARE_URL}`;
  return `コンビニおにぎりの海苔を破らずに開けろ　のこった海苔${pctText()}%（${tornText()}%破れた）【${titleOf()}】\n${SHARE_URL}`;
}

async function showResult(){
  const r=G.res;
  const [n,u]=bigNum();
  $('rScore').innerHTML=`${bigLabel()}<b>${n}<small>${u}</small></b>`;
  $('rCount').textContent=statusLine();
  $('rTitle').textContent='【'+titleOf()+'】';
  const lines=r.clean?[devLine(),speedLine()]:[devLine(),tearLine(),speedLine()];
  if(PREV)lines.push('前の回：'+PREV);
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=prevText();
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'onigiri-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='onigiri-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});

/* The share image: the result on top, the opened rice ball in the middle, one line on the nori, and a band with the game name and the creator. */
async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',D_='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  x.fillStyle='#f7f6f2';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText(bigLabel(),w/2,32);
  const [n,u]=bigNum();let fs=96;x.font=`400 ${fs}px ${D_}`;let tw=x.measureText(n).width;
  while(tw*1.3>w-30&&fs>40){fs-=4;x.font=`400 ${fs}px ${D_}`;tw=x.measureText(n).width;}
  x.font=`400 ${Math.round(fs*.45)}px ${D_}`;const pw=x.measureText(u).width;
  const sx=(w-(tw+pw+4))/2;x.textAlign='left';x.fillStyle='#c8402c';x.font=`400 ${fs}px ${D_}`;x.fillText(n,sx,124);
  x.font=`400 ${Math.round(fs*.45)}px ${D_}`;x.fillText(u,sx+tw+4,124);
  x.textAlign='center';x.fillStyle='#24262b';x.font=`900 17px ${F}`;x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#e7d5b8';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(cardLine()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(cardLine(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${D_}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${D_}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
function begin(){newGame();resize();$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
$('startBtn').addEventListener('click',()=>{ac();begin();});
window.__onigiri={get G(){return G;},begin,play,pull,shareText,showResult,score,L,D,tornPct,advance,newSide};
</script>
