<style>
/* A breakfast table, a pack of natto (made up), and its little pouch of sauce, already torn open.
   Squeeze it out in one stroke: too soft leaves sauce in the pouch, too hard splashes it onto your fingers. */
:root{
  --ink:#2a221c; --muted:#7a6e62; --paper:#fbf6ee; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2622}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#c99d6c;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#f7efe2,#eadfcd)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,8.2vw,40px);line-height:1.4;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfc6ba}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:#f6f1e8;justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:64px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rCount b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);margin:0 2px;font-variant-numeric:tabular-nums}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #ddd3c4;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}

<body>
<div id="app">
  <canvas id="cv" aria-label="食卓で納豆のタレの袋を開けて、納豆にかける画面"></canvas>

  <div id="title" class="panel">
    <h1>納豆のタレを、手につけずに開けろ。</h1>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">商品はすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>タレの結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="タレがけ完成度と、終わった瞬間の画面">
      <p class="fine">商品はすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='納豆のタレを、手につけずに開けろ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://tapitta.com/natto/';})();
/* The pouch, in its own coordinates: 150 wide, 200 tall, centred on 0,0. The top seal is the first 20,
   the sauce comes up to 50 from the top. Tear above that and it opens clean. */
const PW=150,PH=200,SEAL=20,SAUCE_U=50,WET=4;
const TEAR_MIN=SEAL+1,TEAR_MAX=120;  /* the "tear anywhere along this side" edge */
const FAST=5;                        /* tearing faster than this (pouch widths per second) squeezes a squirt out */
const DISP=fontVar('--display'),BODY=fontVar('--body');
function fontVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n);}

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('natto-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
/* the stream of sauce: a looping filtered noise whose volume follows the flow */
const pour={src:null,g:null,f:null};
function pourOn(){if(!ac()||pour.src)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();s.loop=true;f.type='bandpass';f.frequency.value=600;f.Q.value=1.2;g.gain.value=0;s.connect(f).connect(g).connect(AC.destination);s.start();Object.assign(pour,{src:s,g,f});}
function pourSet(v){if(!pour.g||!AC)return;const t=AC.currentTime;pour.g.gain.setTargetAtTime(muted?0:Math.min(.2,v*.25),t,.04);pour.f.frequency.setTargetAtTime(450+v*500,t,.08);}
function pourOff(){if(pour.src){try{pour.src.stop();}catch(e){}pour.src=null;pour.g=null;}}
const SFX={
  rip(){noise(.05,.1,3400,0,'highpass');},
  squirt(){tone(1500,.09,'sine',.05,0,520);noise(.08,.22,2400,0,'bandpass',3);},
  drip(d=0){tone(560,.07,'sine',.045,d,240);},
  squish(){noise(.18,.16,520,0,'lowpass');tone(140,.1,'sine',.05,0,90);},
  burst(){noise(.4,.42,900,0,'bandpass',.7);noise(.25,.3,2600,.02,'highpass');tone(120,.2,'square',.05,0,60);},
  plop(){noise(.14,.22,300,0,'lowpass');tone(170,.11,'sine',.08,0,80);},
  lift(){tone(240,.1,'triangle',.03);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));if(muted)pourSet(0);}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('natto-mute',muted?'1':'0');}catch(err){}syncMute();});

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1;
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
/* layout, in a 360-wide space. Rt is the top of the natto cup's rim. */
function L(){
  const Rt=Math.min(H-80,H*.42+128);
  const tearY=Math.min(Math.max(150,H*.33),Rt-200);
  return {Rt,tearY,cupX:180};
}
/* where the pouch sits, and which way up */
function pouchPose(){
  const {Rt,tearY}=L();
  const up={x:180,y:tearY,r:0};
  const cutY=G&&G.cut?G.cut.y:-PH/2+SEAL;
  const dn={x:180,y:Rt-58+cutY,r:Math.PI};
  if(!G||G.phase==='tear'||G.phase==='torn')return up;
  if(G.phase==='flip'){const e=ease(Math.min(1,G.t/.6));return {x:up.x+(dn.x-up.x)*e,y:up.y+(dn.y-up.y)*e,r:dn.r*e};}
  return dn;
}
function ease(e){return e*e*(3-2*e);}
/* a point in the pouch's own coordinates, on screen */
function pouchPt(lx,ly,P=pouchPose()){const c=Math.cos(P.r),s=Math.sin(P.r);return [P.x+lx*c-ly*s,P.y+lx*s+ly*c];}

/* ---------- state ---------- */
let G=null;
function newGame(){
  G={phase:'squeeze',t:0,cut:{y:-PH/2+30,l:1,u:30},sauce:1,spill:0,hand:0,handT:0,handS:0,squirt:false,burst:false,rare:false,
     fly:[],spots:[],inNatto:0,flick:null,drag:null,done:false,shown:false,strip:null,fingers:{L:[],R:[]},rpos:null,splash:0,squeeze:0,nudge:0};
}

/* ---------- drawing helpers ---------- */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}

/* the table: plain wood with a little grain */
function drawTable(x,w,h,spots,scale=1){
  x.fillStyle='#c99d6c';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(120,74,36,.13)';x.lineWidth=1.4*scale;
  for(let i=0;i<14;i++){const y=(i+.3)*h/14;x.beginPath();x.moveTo(0,y);for(let k=1;k<=8;k++)x.lineTo(k*w/8,y+Math.sin(i*3.1+k*1.3)*5*scale);x.stroke();}
  x.fillStyle='rgba(255,255,255,.05)';x.fillRect(0,0,w,h*.18);
  for(const s of spots||[]){x.fillStyle='rgba(74,34,10,.85)';x.beginPath();x.ellipse(s.x*scale,s.y*scale,s.r*scale*1.2,s.r*scale*.8,s.a,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(s.x*scale-s.r*scale*.35,s.y*scale-s.r*scale*.25,s.r*scale*.3,0,Math.PI*2);x.fill();}
}

/* the natto pack, seen from the front and a little above. Lid open behind it. */
function drawNatto(x,X,Rt,s,sauceIn,pouchIn){
  const w=176*s,d=64*s,fh=40*s,lx=X-w/2;
  /* the lid, open and standing behind */
  x.fillStyle='#ece5d6';x.beginPath();x.moveTo(lx+4*s,Rt+4*s);x.lineTo(lx+14*s,Rt-62*s);x.lineTo(lx+w-14*s,Rt-62*s);x.lineTo(lx+w-4*s,Rt+4*s);x.closePath();x.fill();
  x.strokeStyle='rgba(0,0,0,.08)';x.lineWidth=1.5*s;x.stroke();
  x.fillStyle='#f4efe3';x.beginPath();x.moveTo(lx+12*s,Rt-2*s);x.lineTo(lx+20*s,Rt-56*s);x.lineTo(lx+w-20*s,Rt-56*s);x.lineTo(lx+w-12*s,Rt-2*s);x.closePath();x.fill();
  /* a mustard packet left on the lid */
  x.save();x.translate(X+44*s,Rt-30*s);x.rotate(-.12);x.fillStyle='#f3d34a';rr(x,-17*s,-10*s,34*s,20*s,3*s);x.fill();x.fillStyle='#d9a91c';x.font=`700 ${8.5*s}px ${BODY}`;x.textAlign='center';x.textBaseline='middle';x.fillText('からし',0,1*s);x.restore();
  /* the front wall */
  x.fillStyle='#f6f2e8';x.beginPath();x.moveTo(lx,Rt+d/2);x.lineTo(lx+w,Rt+d/2);x.lineTo(lx+w-8*s,Rt+d/2+fh);x.lineTo(lx+8*s,Rt+d/2+fh);x.closePath();x.fill();
  x.fillStyle='rgba(0,0,0,.05)';x.fillRect(lx+6*s,Rt+d/2+fh-8*s,w-12*s,8*s);
  /* brand on the front */
  x.fillStyle='#2f7a3a';rr(x,X-62*s,Rt+d/2+8*s,124*s,24*s,12*s);x.fill();
  x.fillStyle='#fff';x.font=`400 ${14*s}px ${DISP}`;x.textAlign='center';x.textBaseline='middle';x.fillText('ねぼすけ納豆',X,Rt+d/2+20.5*s);
  /* the rim and the opening */
  x.fillStyle='#fbf8f1';rr(x,lx,Rt-d/2,w,d,14*s);x.fill();x.strokeStyle='rgba(0,0,0,.08)';x.lineWidth=1.2*s;x.stroke();
  x.save();rr(x,lx+9*s,Rt-d/2+7*s,w-18*s,d-14*s,10*s);x.clip();
  x.fillStyle='#8a5a28';x.fillRect(lx,Rt-d/2,w,d);
  for(let i=0;i<120;i++){const bx=lx+9*s+rnd(i)*(w-18*s),by=Rt-d/2+7*s+rnd(i+500)*(d-14*s);
    const c=['#b98042','#a8702f','#c48d4e','#9b6326'][i%4];x.fillStyle=c;x.beginPath();x.ellipse(bx,by,6.2*s,4.6*s,rnd(i+900)*3,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(255,240,210,.35)';x.beginPath();x.ellipse(bx-1.6*s,by-1.4*s,2*s,1.3*s,0,0,Math.PI*2);x.fill();}
  /* sticky threads */
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=.8*s;
  for(let i=0;i<9;i++){const a=lx+20*s+rnd(i+40)*(w-40*s),b=Rt-d/2+12*s+rnd(i+80)*(d-24*s);x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+14*s,b-8*s,a+26*s*rnd(i+3),b+6*s);x.stroke();}
  /* sauce poured in: a dark gloss that spreads from the middle */
  if(sauceIn>0){const k=Math.min(1,sauceIn);
    x.fillStyle=`rgba(70,30,8,${.25+.4*k})`;x.beginPath();x.ellipse(X-6*s,Rt+2*s,(18+60*k)*s,(6+16*k)*s,0,0,Math.PI*2);x.fill();
    x.fillStyle=`rgba(255,255,255,${.12+.2*k})`;for(let i=0;i<Math.round(4+k*10);i++){x.beginPath();x.ellipse(X-6*s+(rnd(i+7)-.5)*110*s*k,Rt+(rnd(i+17)-.5)*28*s*k,3*s,1.4*s,0,0,Math.PI*2);x.fill();}}
  x.restore();
  if(pouchIn){x.save();x.translate(X+8*s,Rt-2*s);x.rotate(.35);x.scale(.42*s,.42*s);drawPouchBody(x,{cut:pouchIn.cut,sauce:.08,flat:1});x.restore();}
}

/* The pouch, drawn in its own coordinates. o.cut = {y, l} once torn (the part above y, from the right edge for l of the width, is gone).
   o.sauceSide: 'down' = sauce at the bottom (held upright), 'cut' = sauce against the cut (held upside down). o.flat: how much has been squeezed flat. */
function drawPouchBody(x,o){
  const hw=PW/2,top=-PH/2,bot=PH/2;
  const cut=o.cut;
  x.save();
  /* clip away the torn-off part */
  x.beginPath();
  if(cut){const cx0=hw-cut.l*PW;x.moveTo(-hw,top);x.lineTo(cx0,top);x.lineTo(cx0,cut.y);x.lineTo(hw,cut.y);x.lineTo(hw,bot);x.lineTo(-hw,bot);x.closePath();}
  else x.rect(-hw,top,PW,PH);
  x.clip();
  /* film */
  x.fillStyle='rgba(244,238,226,.96)';rr(x,-hw,top,PW,PH,6);x.fill();
  /* sauce */
  const inTop=top+SEAL,inBot=bot-14,inH=inBot-(top+SAUCE_U);
  const amt=Math.max(0,o.sauce);
  if(amt>0){
    let y0,y1;
    if(o.sauceSide==='cut'){y0=cut?Math.max(inTop,Math.min(cut.y,inTop+30)):inTop;y1=y0+inH*amt;}
    else{y1=inBot;y0=inBot-inH*amt;}
    x.fillStyle='#5b2a0c';rr(x,-hw+10,y0,PW-20,Math.max(2,y1-y0),8);x.fill();
    x.fillStyle='rgba(150,80,30,.55)';rr(x,-hw+16,y0+3,14,Math.max(1,y1-y0-6),6);x.fill();
    x.fillStyle='rgba(255,255,255,.35)';if(o.sauceSide!=='cut')x.fillRect(-hw+12,y0,PW-24,2);
  }
  /* squeezed-flat part: creases */
  if(o.flat>0){const fy=o.sauceSide==='cut'?bot-14-(bot-14-(cut?cut.y:inTop))*o.flat:bot;
    x.strokeStyle='rgba(120,110,95,.35)';x.lineWidth=1.2;for(let i=0;i<8;i++){const yy=bot-16-i*((bot-16-fy)/8);if(yy<fy)break;x.beginPath();x.moveTo(-hw+12,yy);x.lineTo(hw-12,yy+((i%2)?3:-3));x.stroke();}}
  /* print */
  x.save();x.translate(0,24);if(o.sauceSide==='cut')x.rotate(Math.PI);
  x.fillStyle='#c8402c';x.beginPath();x.arc(0,0,26,0,Math.PI*2);x.fill();
  x.fillStyle='#fff';x.font=`400 19px ${DISP}`;x.textAlign='center';x.textBaseline='middle';x.fillText('たれ',0,1);x.restore();
  /* seals: crimped bands */
  x.fillStyle='rgba(225,216,198,.95)';x.fillRect(-hw,top,PW,SEAL);x.fillRect(-hw,bot-14,PW,14);x.fillRect(-hw,top,9,PH);x.fillRect(hw-9,top,9,PH);
  x.strokeStyle='rgba(150,138,118,.4)';x.lineWidth=1;
  for(let i=-hw+3;i<hw;i+=4){x.beginPath();x.moveTo(i,top+2);x.lineTo(i,top+SEAL-3);x.stroke();x.beginPath();x.moveTo(i,bot-12);x.lineTo(i,bot-2);x.stroke();}
  for(let j=top+SEAL;j<bot-14;j+=4){x.beginPath();x.moveTo(-hw+2,j);x.lineTo(-hw+7,j);x.stroke();x.beginPath();x.moveTo(hw-7,j);x.lineTo(hw-2,j);x.stroke();}
  /* the little words along the tear edge, written down the right side */
  x.fillStyle='rgba(120,90,60,.8)';x.font=`700 6.6px ${BODY}`;x.textAlign='center';x.textBaseline='middle';
  const msg='こちら側のどこからでも切れます';for(let i=0;i<msg.length;i++)x.fillText(msg[i],hw-17,top+SEAL+5+i*7.1);
  /* serrations on the edge */
  x.strokeStyle='rgba(150,138,118,.8)';x.lineWidth=1;x.beginPath();for(let j=top+2;j<top+TEAR_MAX+4;j+=3){x.moveTo(hw,j);x.lineTo(hw-2,j+1.5);x.lineTo(hw,j+3);}x.stroke();
  x.restore();
  /* the torn edge: a ragged white line */
  if(cut){const a=hw-cut.l*PW;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(a,cut.y);const n=Math.max(3,Math.round(cut.l*PW/7));
    for(let i=1;i<=n;i++)x.lineTo(a+(hw-a)*i/n,cut.y+((i%2)?1.6:-1.2));x.stroke();
    if(cut.l<.995){x.strokeStyle='rgba(150,138,118,.6)';x.beginPath();x.moveTo(a,cut.y);x.lineTo(a,top);x.stroke();}}
  /* burst side seam */
  if(o.burst){x.strokeStyle='#4a220a';x.lineWidth=3;x.beginPath();x.moveTo(-hw+1,-10);for(let i=1;i<7;i++)x.lineTo(-hw+((i%2)?6:1),-10+i*9);x.stroke();}
  /* film outline */
  x.strokeStyle='rgba(0,0,0,.14)';x.lineWidth=1.2;
  x.beginPath();if(cut&&cut.l>=.995){x.moveTo(-hw,cut.y);x.lineTo(-hw,bot);x.lineTo(hw,bot);x.lineTo(hw,cut.y);}else if(cut){const a=hw-cut.l*PW;x.moveTo(a,cut.y);x.lineTo(a,top);x.lineTo(-hw,top);x.lineTo(-hw,bot);x.lineTo(hw,bot);x.lineTo(hw,cut.y);}else{rr(x,-hw,top,PW,PH,6);}x.stroke();
}
function drawPouch(){
  const P=pouchPose();
  cx.save();cx.translate(P.x,P.y);cx.rotate(P.r);
  const flipped=G.phase==='flip'?G.t>.3:G.phase!=='tear'&&G.phase!=='torn';
  drawPouchBody(cx,{cut:G.cut,sauce:G.sauce,sauceSide:flipped?'cut':'down',flat:G.squeeze,burst:G.burst});
  cx.restore();
}

/* A finger: a capsule from its base to the tip, with a nail. Drops of sauce stick to it. */
const SKIN='#f1c9a6',SKIN_D='#d9a37c';
function drawFinger(x,X,Y,ang,len,w,drops,s=1){
  x.save();x.translate(X,Y);x.rotate(ang);x.scale(s,s);
  x.fillStyle='rgba(0,0,0,.12)';rr(x,-len+3,-w/2+4,len,w,w/2);x.fill();
  x.fillStyle=SKIN;rr(x,-len,-w/2,len,w,w/2);x.fill();
  x.strokeStyle=SKIN_D;x.lineWidth=1.3;x.stroke();
  x.fillStyle='#f8e2d2';rr(x,-w*.95,-w*.36,w*.72,w*.5,w*.22);x.fill();x.strokeStyle='rgba(200,150,120,.6)';x.lineWidth=1;x.stroke();
  x.strokeStyle='rgba(190,130,95,.45)';x.lineWidth=1.2;for(const k of [1.9,2.9]){x.beginPath();x.moveTo(-w*k,-w*.3);x.quadraticCurveTo(-w*k-3,0,-w*k,w*.3);x.stroke();}
  for(const d of drops){const px=-4-d.t*len*.55,py=d.o*w*.38;
    x.fillStyle='#4a220a';x.beginPath();x.ellipse(px,py,d.r*1.15,d.r*.9,d.a||0,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(px-d.r*.35,py-d.r*.3,d.r*.28,0,Math.PI*2);x.fill();}
  x.restore();
}
/* where each finger is now: L holds the pouch, R tears it and then squeezes it */
function fingerPose(f){
  const P=pouchPose();
  if(f==='L'){
    if(!G||G.phase==='tear'||G.phase==='torn'){const [a,b]=pouchPt(-PW/2+24,40,P);return {x:a,y:b,a:0};}
    const [a,b]=pouchPt(PW/2-22,PH/2-30,P);
    if(G.phase==='flip'){const [u,v]=pouchPt(-PW/2+24,40,{x:180,y:L().tearY,r:0});const e=ease(Math.min(1,G.t/.6));return {x:u+(a-u)*e,y:v+(b-v)*e,a:0};}
    return {x:a,y:b,a:0};
  }
  /* R */
  if(G.phase==='tear'||G.phase==='torn'){if(G.rpos)return {x:G.rpos.x,y:G.rpos.y,a:Math.PI};return null;}
  const top=pouchPt(0,PH/2-26,P),bot=pouchPt(0,(G.cut?G.cut.y:-PH/2+SEAL)+14,P);
  const q=G.squeeze;let y=top[1]+(bot[1]-top[1])*q+G.nudge;
  const tgt={x:top[0]+24,y,a:Math.PI};
  if(G.phase==='flip'&&G.rpos){const e=ease(Math.min(1,G.t/.6));return {x:G.rpos.x+(tgt.x-G.rpos.x)*e,y:G.rpos.y+(tgt.y-G.rpos.y)*e,a:Math.PI};}
  return tgt;
}
const FL={L:{len:150,w:30},R:{len:150,w:30}};
function fingerPt(f,t,o){const p=fingerPose(f);if(!p)return null;const lx=-4-t*FL[f].len*.55,ly=o*FL[f].w*.38;return [p.x+lx*Math.cos(p.a)-ly*Math.sin(p.a),p.y+lx*Math.sin(p.a)+ly*Math.cos(p.a)];}
function drawFingers(){for(const f of ['L','R']){const p=fingerPose(f);if(p)drawFinger(cx,p.x,p.y,p.a,FL[f].len,FL[f].w,G.fingers[f]);}}

/* ---------- flying sauce ---------- */
/* to a finger (counts as a drop on your hand) or to the table */
function flyToHand(x0,y0,f,delay=0){
  const d={x0,y0,t:-delay,dur:.28+Math.random()*.2,f,dt:Math.random()*.9,o:(Math.random()*2-1)*.85,r:2.2+Math.random()*2.4,h:20+Math.random()*40,a:Math.random()*3};
  G.fly.push(d);G.hand++;
}
function flyToTable(x0,y0,delay=0){
  const tx=Math.max(8,Math.min(352,x0+(Math.random()-.5)*220)),ty=Math.max(20,Math.min(H-10,y0+(Math.random()-.2)*160));
  G.fly.push({x0,y0,t:-delay,dur:.3+Math.random()*.25,tx,ty,r:2+Math.random()*3.2,h:30+Math.random()*40,a:Math.random()*3});
}
function updateFly(dt){
  for(const d of G.fly){d.t+=dt;if(d.t<0)continue;const e=Math.min(1,d.t/d.dur);
    let tx=d.tx,ty=d.ty;if(d.f){const p=fingerPt(d.f,d.dt,d.o);if(p){tx=p[0];ty=p[1];}}
    d.x=d.x0+(tx-d.x0)*e;d.y=d.y0+(ty-d.y0)*e-d.h*4*e*(1-e);
    if(e>=1){d.dead=true;if(d.f){G.fingers[d.f].push({t:d.dt,o:d.o,r:d.r,a:d.a});SFX.drip();}else G.spots.push({x:tx,y:ty,r:d.r,a:d.a});}}
  G.fly=G.fly.filter(d=>!d.dead);
}

/* ---------- squeeze input ---------- */
/* One stroke down the pouch. Its speed sets how hard you squeeze: too soft leaves sauce in, too hard splashes it back on your fingers. */
const V_PER=8;   /* logical px per second of stroke for each unit of squeeze */
function zone(){
  /* a small opening needs a harder squeeze */
  const hole=Math.max(.15,G.cut?G.cut.l:1);
  const best=40+86/Math.sqrt(hole);
  const ok=best*.00045;                   /* the clean window is very narrow on purpose: 100% is rare */
  return {best,lo:best-ok,hi:best+ok,burst:best*1.24};
}
function sqDown(e){if(G.phase!=='squeeze'||G.done||G.flick)return;const P=pt(e);G.drag={pts:[[performance.now(),P.y]],y0:P.y};}
function sqMove(e){if(!G.drag)return;const P=pt(e),now=performance.now();G.drag.pts.push([now,P.y]);while(G.drag.pts.length>2&&now-G.drag.pts[0][0]>90)G.drag.pts.shift();G.nudge=Math.max(0,Math.min(12,(P.y-G.drag.y0)*.12));}
function sqUp(){
  if(!G.drag)return;const d=G.drag;G.drag=null;G.nudge=0;
  const now=performance.now();d.pts.push([now,d.pts[d.pts.length-1][1]]);
  const a=d.pts[0],b=d.pts[d.pts.length-2];const dt=Math.max(16,b[0]-a[0]);
  const v=(b[1]-a[1])/dt*1000;
  if(b[1]-d.y0<18||v<60)return; /* a tap or a stroke upwards: nothing happens */
  squeeze(v);
}
function squeeze(v){
  const S=Math.min(320,v/V_PER);G.flick={v,S,t:0,z:zone(),s0:G.sauce,out:0};SFX.squish();
}
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
cv.addEventListener('pointerdown',e=>{if(!G)return;ac();try{cv.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();if(G.phase==='squeeze')sqDown(e);});
cv.addEventListener('pointermove',e=>{if(!G)return;sqMove(e);});
const up=()=>{if(!G)return;sqUp();};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;updateFly(dt);
  if(G.strip){const s=G.strip;s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.a+=s.va*dt;if(s.y>H+60)G.strip=null;}
  if(G.phase==='torn'){if(G.t>.75){G.phase='flip';G.t=0;SFX.lift();}return;}
  if(G.phase==='flip'){if(G.t>=.6){G.phase='squeeze';G.t=0;pourOn();}return;}
  if(G.phase==='fall'){G.fallT+=dt;if(G.fallT>.5&&!G.fellIn){G.fellIn=true;SFX.plop();}}
  if(G.phase!=='squeeze'&&G.phase!=='fall')return;
  if(G.done){pourSet(0);if(performance.now()>G.endAt&&!G.shown){G.shown=true;showResult();}return;}
  const F=G.flick;if(!F)return;
  F.t+=dt;
  const SLIDE=.28,FLOW=.7;
  G.squeeze=Math.min(1,ease(Math.min(1,F.t/SLIDE)));
  if(F.t>=.12&&F.S>F.z.burst&&!G.burst){burst();return;}
  const left=F.S>=F.z.lo?0:F.s0*Math.min(1,(F.z.lo-F.S)/90);
  const k=Math.min(1,F.t/FLOW);const target=F.s0-(F.s0-left)*(1-(1-k)*(1-k));
  const flow=Math.max(0,G.sauce-target);G.sauce=target;G.inNatto+=flow;
  pourSet(flow/dt*2);G.flowNow=flow/dt;
  /* too hard: it hits the natto and splashes back up, more the harder it was */
  if(F.S>F.z.hi){const r=(F.S-F.z.hi)/Math.max(1,F.z.burst-F.z.hi);const want=Math.round(1+Math.pow(r,1.4)*22);
    const due=Math.round(want*k);const [ox,oy]=pouchPt(PW/2-(G.cut?G.cut.l:1)*PW/2,G.cut?G.cut.y:-PH/2+SEAL);const {Rt}=L();
    while(F.out<due){F.out++;G.splash++;flyToHand(ox+(Math.random()-.5)*30,Rt-4,Math.random()<.6?'R':'L');if(Math.random()<.5)flyToTable(ox,Rt);}}
  if(F.t>FLOW+.25)finish('down');
}
function burst(){
  G.burst=true;pourSet(0);SFX.burst();anim($('app'),'shake');try{navigator.vibrate&&navigator.vibrate([40,30,90]);}catch(e){}
  const [bx,by]=pouchPt(-PW/2,10);
  const n=24+Math.floor(Math.random()*10);for(let i=0;i<n;i++)flyToHand(bx+(Math.random()-.5)*20,by+(Math.random()-.5)*60,i%3?'R':'L',i*.012);
  for(let i=0;i<40;i++)flyToTable(bx,by,i*.01);
  const lost=G.sauce*.6;G.spill+=lost;G.inNatto+=G.sauce-lost;G.sauce=0;
  /* now and then the burst pouch slips out of your fingers and lands in the natto */
  G.rare=Math.random()<.15&&G.flick.S>=G.flick.z.burst*1.12;
  if(G.rare){G.phase='fall';G.fallT=0;}
  finish('burst');
}
function finish(why){
  if(G.done)return;G.done=true;G.why=why;G.endAt=performance.now()+(why==='burst'?2300:1300);
}

/* a ghost finger that shows where to touch and which way to move */
function guide(x0,y0,x1,y1){
  const t=(G.t%1.8)/1.8,e=t<.15?0:t>.75?1:(t-.15)/.6,ee=e*e*(3-2*e);
  const fx=x0+(x1-x0)*ee,fy=y0+(y1-y0)*ee,al=t>.85?(1-t)/.15:t<.08?t/.08:1;
  cx.save();cx.globalAlpha=al;
  cx.setLineDash([5,5]);cx.strokeStyle='rgba(42,34,28,.6)';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();cx.setLineDash([]);
  const ang=Math.atan2(y1-y0,x1-x0);cx.fillStyle='rgba(42,34,28,.6)';cx.beginPath();cx.moveTo(x1+Math.cos(ang)*8,y1+Math.sin(ang)*8);cx.lineTo(x1+Math.cos(ang+2.4)*10,y1+Math.sin(ang+2.4)*10);cx.lineTo(x1+Math.cos(ang-2.4)*10,y1+Math.sin(ang-2.4)*10);cx.closePath();cx.fill();
  cx.fillStyle='rgba(255,255,255,.8)';cx.strokeStyle='#2a221c';cx.lineWidth=2.5;cx.beginPath();cx.arc(fx,fy,15,0,Math.PI*2);cx.fill();cx.stroke();
  cx.restore();
}
function pill(label,lx,ly){cx.save();cx.font='900 15px '+BODY;cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(label).width+22;cx.fillStyle='rgba(42,34,28,.88)';rr(cx,lx-w/2,ly-15,w,30,15);cx.fill();cx.fillStyle='#fff';cx.fillText(label,lx,ly+1);cx.restore();}
/* the squeeze lesson: one quick stroke down */
function sqGuide(){
  const P=pouchPose();const T=1.6,t=(G.t%T)/T;
  const x0=P.x+PW/2+34,y0=P.y-PH/2+40,y1=P.y+PH/2-50;
  let fy=y0,show=true;
  if(t<.35)fy=y0;else if(t<.5){const e=(t-.35)/.15;fy=y0+(y1-y0)*e*e;}else{fy=y1;show=false;}
  cx.save();
  cx.setLineDash([5,5]);cx.strokeStyle='rgba(42,34,28,.6)';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x0,y1);cx.stroke();cx.setLineDash([]);
  cx.fillStyle='rgba(42,34,28,.6)';cx.beginPath();cx.moveTo(x0,y1+12);cx.lineTo(x0-9,y1-4);cx.lineTo(x0+9,y1-4);cx.closePath();cx.fill();
  if(show){cx.fillStyle='rgba(255,255,255,.85)';cx.strokeStyle='#2a221c';cx.lineWidth=2.5;cx.beginPath();cx.arc(x0,fy,15,0,Math.PI*2);cx.fill();cx.stroke();
    if(t>.35)for(let i=1;i<4;i++){cx.fillStyle=`rgba(42,34,28,${.25-i*.06})`;cx.beginPath();cx.arc(x0,fy-i*14,13-i*2,0,Math.PI*2);cx.fill();}}
  else{const r=(t-.5)/.5;cx.strokeStyle=`rgba(42,34,28,${.7*(1-r)})`;cx.lineWidth=2.5;cx.beginPath();cx.arc(x0,y1,15+r*16,0,Math.PI*2);cx.stroke();}
  cx.restore();
  const yy=Math.max(30,P.y-PH/2-62);
  pill('上から下へシュッとしごいて、1回で出す',180,yy);
  pill('弱いと袋に残る、強いと手に飛ぶ',180,yy+36);
}

/* ---------- render ---------- */
function render(){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  drawTable(cx,W,H,G?G.spots:[]);
  const {Rt}=L();
  drawNatto(cx,180,Rt,1,G?G.inNatto:0,G&&G.fellIn?{cut:G.cut}:null);
  if(!G)return;
  /* the sauce stream into the natto */
  const pouring=G.phase==='squeeze'&&G.flick&&!G.done&&G.flowNow>.02;
  if(pouring){const [ox,oy]=pouchPt(PW/2-(G.cut?G.cut.l:1)*PW/2,G.cut?G.cut.y:-PH/2+SEAL);const w=Math.min(9,1.5+G.flowNow*5);
    cx.strokeStyle='#4a220a';cx.lineWidth=w;cx.lineCap='round';cx.beginPath();cx.moveTo(ox,oy);cx.quadraticCurveTo(ox+2,(oy+Rt)/2,ox-4,Rt);cx.stroke();
    cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(ox-w*.2,oy+4);cx.lineTo(ox-w*.2-2,Rt-6);cx.stroke();}
  if(G.phase==='fall'){const e=Math.min(1,G.fallT/.5);if(e<1){const P=pouchPose();cx.save();cx.translate(P.x+(188-P.x)*e,P.y+(Rt-P.y)*e*e);cx.rotate(P.r+e*2.2);cx.scale(1-.55*e,1-.55*e);drawPouchBody(cx,{cut:G.cut,sauce:0,flat:1,burst:true});cx.restore();}}
  else drawPouch();
  if(G.strip){const s=G.strip;cx.save();cx.translate(s.x,s.y);cx.rotate(s.a);cx.fillStyle='rgba(225,216,198,.95)';cx.fillRect(-s.w/2,-s.h/2,s.w,s.h);
    if(s.h>SAUCE_U){cx.fillStyle='#5b2a0c';cx.fillRect(-s.w/2+4,-s.h/2+SAUCE_U,s.w-8,s.h-SAUCE_U);}cx.strokeStyle='rgba(0,0,0,.15)';cx.strokeRect(-s.w/2,-s.h/2,s.w,s.h);cx.restore();}
  drawFingers();
  for(const d of G.fly){if(d.t<0||d.x===undefined)continue;cx.fillStyle='#4a220a';cx.beginPath();cx.arc(d.x,d.y,d.r,0,Math.PI*2);cx.fill();}
  if(G.phase==='squeeze'&&!G.flick&&!G.drag)sqGuide();
}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(G)step(dt);render();}
requestAnimationFrame(loop);

function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- result ---------- */
/* One number for the whole job: sauce on your fingers, sauce left in the pouch and sauce on the table all count, a burst pouch costs a lot.
   100% only for a clean job; anything else tops out at 99.9%. */
function score(){
  const left=Math.max(0,G.sauce);
  if(!G.burst&&G.hand===0&&left<1e-4&&G.spill<1e-6)return 100;
  let s=100-75*Math.pow(left,1.1)-50*Math.pow(Math.min(1,G.hand/40),.8)-40*G.spill-(G.burst?30:0);
  return Math.max(0,Math.min(99.9,Math.floor(s*10)/10));
}
function pctText(){const s=score();return s===100?'100':s.toFixed(1);}
function titleOf(){
  if(G.rare)return '袋ごとトッピング';
  if(G.burst)return 'タレ爆発';
  const s=score(),clean=G.hand===0&&G.spill<1e-6;
  if(s===100)return '無傷のタレ職人';
  if(s>=95)return clean?'あと一滴しぼれた人':'ほぼ無傷のタレ職人';
  if(s>=80)return clean?'タレちょい残し':'指をなめたくなる人';
  if(s>=50)return clean?'薄味納豆':'指でタレを味見した人';
  return clean?'ほぼタレなし納豆':'手がタレ漬け';
}
/* under 1% shows one decimal (never 0 while some is left), so every line agrees */
function leftPct(){const w=Math.max(0,G.sauce)*100;if(G.sauce<1e-4)return '0';if(w<1)return Math.max(.1,Math.round(w*10)/10).toFixed(1);return String(Math.round(w));}
/* One line of feedback on the squeeze, so the next try knows which way to go. */
function feedback(){
  const F=G.flick||{S:0,z:{best:1,lo:0,hi:0,burst:0}};
  const r=(F.S-F.z.best)/F.z.best;
  const how=Math.abs(r)<.01?'ほんの少し':Math.abs(r)<.05?'少し':'';
  let sq;
  if(G.burst)sq='強すぎて、袋が破れた';
  else if(F.S<F.z.lo)sq=`${how}弱い（袋に${leftPct()}%残った）`;
  else if(F.S>F.z.hi)sq=`${how}強い（指に${G.splash}滴はねた）`;
  else sq='ぴったり';
  return ['しぼり：'+sq];
}
function shareText(){
  return `納豆のタレを手につけずに開けろ　完成度${pctText()}%（指に${G.hand}滴）【${titleOf()}】\n${SHARE_URL}\n#納豆のタレゲーム`;
}
async function showResult(){
  pourOff();
  $('rScore').innerHTML=`タレがけ完成度<b>${pctText()}<small>%</small></b>`;
  $('rCount').innerHTML=`指についたタレ <b>${G.hand}</b>滴　袋に <b>${leftPct()}</b>%残り`;
  $('rTitle').textContent='【'+titleOf()+'】';
  $('rSub').innerHTML=feedback().map(l=>`<span>${l}</span>`).join('<br>');
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(r=>G.cardCanvas.toBlob(r,'image/png'));if(b)G.cardFile=new File([b],'natto-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
/* Phones: everything goes through the share sheet, so picking X opens the post inside the X app
   (also from X's own in-app browser) with the result image attached. Only where there is no share sheet
   at all (PCs, some in-app browsers) do we open the X post page and offer to save the image. */
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='natto-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});

function wrap(x,text,maxW){const out=[];let cur='';for(const ch of text){if(x.measureText(cur+ch).width>maxW&&cur){if('、。？！…」）'.includes(ch)){cur+=ch;continue;}out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
/* The share image is the play screen itself at the moment it ended (the pouch, your fingers with the sauce on them, the natto),
   cut from the game canvas, with the result above it and a thin band for the game name and the creator. Portrait, 360 wide at 3x. */
async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',D='"Dela Gothic One",sans-serif';
  /* the part of the screen to keep: from just above the pouch to just below the natto */
  const {Rt}=L(),P=pouchPose();
  const y0=Math.max(0,P.y-PH/2-46),y1=Math.min(H,Rt+92),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  /* the result first, big */
  x.fillStyle='#fbf6ee';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#7a6e62';x.font=`900 16px ${F}`;x.fillText('タレがけ完成度',w/2,32);
  const t=pctText();let fs=96;x.font=`400 ${fs}px ${D}`;let tw=x.measureText(t).width;
  x.font=`400 ${Math.round(fs*.45)}px ${D}`;const pw=x.measureText('%').width;
  const sx=(w-(tw+pw+4))/2;x.textAlign='left';x.fillStyle='#c8402c';x.font=`400 ${fs}px ${D}`;x.fillText(t,sx,124);
  x.font=`400 ${Math.round(fs*.45)}px ${D}`;x.fillText('%',sx+tw+4,124);
  x.textAlign='center';x.fillStyle='#2a221c';x.font=`900 17px ${F}`;x.fillText(`指についたタレ ${G.hand}滴　袋に ${leftPct()}%残り`,w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  /* the play screen, as it was */
  x.fillStyle='#2a221c';x.fillRect(0,top0-3,w,3);
  const r=SC*DPR;
  try{x.drawImage(cv,0,y0*r,cv.width,sh*r,0,top0,w,sh);}catch(e){x.fillStyle='#c99d6c';x.fillRect(0,top0,w,sh);}
  /* how the squeeze went */
  x.fillStyle='#2a221c';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#fbf6ee';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#7a6e62';x.font=`700 14px ${F}`;x.textBaseline='middle';x.fillText(feedback()[0],w/2,fbTop+fbH/2);
  /* game name and the creator */
  x.fillStyle='#2a221c';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${D}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>9){gs-=.5;x.font=`400 ${gs}px ${D}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
function begin(){newGame();resize();$('title').hidden=true;pourOn();}
$('startBtn').addEventListener('click',()=>{ac();begin();});
window.__natto={get G(){return G;},begin,L,pouchPose,squeeze,zone,score,shareText,showResult,PW,PH,SAUCE_U};
</script>

<script>
(function(){

  [title,result].forEach(function(el){if(el)new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:['hidden']});});
  sync();
  var btns=result&&result.querySelector('.btns');
  if(btns){var b=document.createElement('a');b.id='moreGamesBtn';b.className='btn ghost';b.href='/';b.textContent='ほかのゲームで遊ぶ';btns.appendChild(b);}
