<style>
/* A made-up social app. You bought the badge; ninety days to be seen 500,000 times by other badge holders.
   Pick one of three drafts, watch it go nowhere (or somewhere), repeat ten times, then face the review. */
:root{
  --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --paper:#ffffff; --bg:#f3f4f6;
  --red:#d8332f; --red-d:#9e1f1c; --gold:#ffd23f; --green:#11804a; --badge:#2f80ed;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#d9dce1}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
#app.shake{animation:shake .5s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

/* top numbers */
#hud{flex:none;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 14px;align-items:end}
#hud .day{grid-row:span 2;font-family:var(--display);font-size:26px;line-height:1;white-space:nowrap}
#hud .day small{font-family:var(--body);font-weight:900;font-size:12px;color:var(--muted);margin-left:2px}
#hud .k{font-size:10.5px;font-weight:900;color:var(--muted);line-height:1.2}
#hud .v{font-family:var(--display);font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud .v small{font-family:var(--body);font-weight:900;font-size:11px;color:var(--muted)}
#hud .v.up{color:var(--green)}
#hud .v.down{color:var(--red)}

/* timeline */
#tl{flex:1;min-height:0;overflow:hidden;position:relative;padding:10px 10px 0}
#tl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.post{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;margin-bottom:8px;animation:drop .35s ease-out}
.post.old{opacity:.55}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;color:#fff;background:#f08a24}
.who .h{color:var(--muted);font-weight:700;font-size:11.5px}
.bd{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--badge);color:#fff;font-size:10px;line-height:1;vertical-align:-2px;margin-left:2px}
.txt{font-size:16px;font-weight:700;line-height:1.55;margin:7px 0 8px;word-break:break-all}
.stats{display:flex;gap:16px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:14px}
.stats .vv b{color:var(--badge)}
.note{margin-top:8px;border:1px solid #cdd3db;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;color:#3b4350;background:#f7f9fb}
.note b{display:block;font-size:11px;color:var(--muted)}
.reps{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.rep{font-size:12.5px;font-weight:700;color:#3b4350;display:flex;gap:6px;align-items:baseline;animation:drop .25s ease-out}
.rep i{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.fb{margin-top:7px;font-size:13px;font-weight:900}
.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.sys{text-align:center;font-size:12.5px;font-weight:900;color:var(--muted);margin:2px 0 10px;animation:drop .3s ease-out}
.sys.warn{color:var(--red)}

/* drafts */
#drawer{flex:none;background:var(--paper);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));transition:transform .25s,opacity .25s}
#drawer.off{opacity:.0;transform:translateY(20px);pointer-events:none}
#drawer h3{margin:0 0 8px;font-size:12px;font-weight:900;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.draft{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 7px;font:700 14.5px/1.45 var(--body);color:var(--ink);cursor:pointer}
.draft:last-child{margin-bottom:0}
.draft:active{background:#f3f6fb;border-color:var(--badge)}
.draft:focus-visible{outline:3px solid var(--badge);outline-offset:2px}

/* overlays */
.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:var(--bg)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,9vw,42px);line-height:1.3;margin:0 0 30px}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfd3da}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.7}
#title .btn small{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px}

#curtain{background:rgba(17,20,26,.88);color:#fff;z-index:35}
#curtain .big{font-family:var(--display);font-size:clamp(26px,8vw,38px);line-height:1.35;margin:0}
#curtain .sub{font-size:14px;font-weight:700;margin:14px 0 0;line-height:1.7;color:#d6dae1;font-variant-numeric:tabular-nums}
#curtain.frozen{background:#7e1513}

#result{background:var(--bg);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:11px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rNet{margin:0;font-size:16px;font-weight:900;line-height:1.1}
#rNet b{display:block;font-family:var(--display);font-weight:400;font-size:60px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
#rNet b.plus{color:var(--green)}
#rRows{margin:0;font-size:14px;font-weight:900;line-height:1.75;color:var(--muted);font-variant-numeric:tabular-nums}
#rRows b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:16px;margin:0 2px}
#rTitle{font-size:17px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:13px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #d5d9df;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#mute{position:absolute;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
#app.playing #mute{display:none}
.m2{margin-left:10px;background:none;border:1px solid var(--line);border-radius:999px;font:700 11px var(--body);color:var(--muted);padding:2px 9px;cursor:pointer}
@media (max-height:600px){.txt{font-size:15px;margin:5px 0 6px}.draft{padding:8px 11px;font-size:13.5px}#hud .day{font-size:22px}}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}.post,.rep,.sys{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" aria-live="polite">
    <div class="day" id="hDay">1<small>日目</small></div>
    <div class="k">認証済み表示</div>
    <div class="k">認証済みフォロワー</div>
    <div class="v" id="hImp">0 <small>/ 50万</small></div>

  </div>
  <div id="tl"></div>
  <div id="drawer" class="off">
    <h3><span>どれを投稿する？</span><span><span id="left"></span><button id="mute2" class="m2" type="button" aria-pressed="false">音 ON</button></span></h3>

  <div id="title" class="panel">

    <p class="fine">登場するSNS・人はすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>

        <button class="btn x" id="shareX" type="button">Xで共有</button>

      <img id="card" alt="90日の収支と、いちばん見られた投稿の画像">
      <p class="fine">登場するSNS・人はすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>

</div>

<script>
/* ---------- game logic (pure: shared by the page and sim.js) ---------- */
const GOAL_IMP=500000, GOAL_FOL=500, FEE=1280, TURNS=10, DAYS=90;
/* post kinds. base = typical reach with ~0 followers, sd = lognormal spread, pb = chance of a buzz, bm = buzz multiplier,
   r = share of the reach that is verified users, fr = followers gained per view, vf = share of new followers that are verified,
   risk = hidden suspicion added (mutual-follow farming, reposts, rage bait) */
const KINDS={
  q:    {base:900, sd:.55,pb:.05,bm:22, r:.11,fr:.0035,vf:.45,risk:0},
  aru:  {base:600, sd:.5, pb:.05,bm:28, r:.10,fr:.003, vf:.40,risk:0},
  game: {base:500, sd:.8, pb:.09,bm:90, r:.045,fr:.005,vf:.30,risk:0},
  bulba:{base:350, sd:.3, pb:0,  bm:1,  r:.55,fr:.002, vf:.9, risk:.75},
  aori: {base:1800,sd:.9, pb:.10,bm:12, r:.08,fr:.0015,vf:.30,risk:.45},
  quote:{base:1400,sd:.7, pb:.07,bm:16, r:.07,fr:.003, vf:.35,risk:0},
  tensai:{base:4000,sd:.7,pb:.12,bm:10, r:.08,fr:.001, vf:.30,risk:1.0},
  yowa: {base:350, sd:.5, pb:.03,bm:30, r:.16,fr:.004, vf:.55,risk:0},
  ai:   {base:800, sd:.65,pb:.06,bm:24, r:.07,fr:.0035,vf:.40,risk:0},
  money:{base:450, sd:.4, pb:.02,bm:15, r:.32,fr:.003, vf:.75,risk:.1},
};
function makeRng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function gauss(R){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function newState(seed){
  return {R:makeRng(seed),turn:0,day:1,imp:0,vimp:0,fol:48,vfol:6,risk:0,shadow:0,frozen:0,noted:0,log:[],best:null,boost:0};
}
/* simulate one post. returns a record for the timeline */
function doPost(S,kind,text){
  const K=KINDS[kind],R=S.R;
  const ev=[];
  let reach=K.base*2.6*(1+Math.pow(S.fol/250,.7))*Math.exp(gauss(R)*K.sd);
  let ratio=K.r*(.75+R()*.5);
  let buzz=false,noted=false,fire=false,zombie=false,shadowed=false;
  if(S.boost){reach*=S.boost;ev.push('boost');S.boost=0;}
  if(R()<K.pb){buzz=true;const m=K.bm*(.35+R()*1.3)*(R()<.04?5:1);reach*=m;ratio*=.6;}
  if(kind==='aori'&&R()<.3){fire=true;reach*=2.5;ratio*=.8;}
  if(kind==='aori'&&R()<.22){noted=true;S.risk+=.4;}
  if(kind==='tensai'&&R()<.3){noted=true;}
  if(S.shadow>0){reach*=.12;shadowed=true;S.shadow--;}
  reach=Math.round(reach);
  let v=Math.round(reach*ratio);
  if(noted)v=0;                       /* a note takes the post out of the count */
  let nf=reach*K.fr*1.5*(.5+R())*(fire?.3:1);
  let nv=nf*K.vf;
  if(kind==='bulba'){const m=18+Math.floor(R()*40);nv+=m;nf+=m+R()*10;}
  if(fire){nf-=reach*.0006;}
  nf=Math.round(nf);nv=Math.max(0,Math.round(nv));
  if(reach>30000&&!noted)zombie=true;
  S.risk+=K.risk;
  S.imp+=reach;S.vimp+=v;S.fol=Math.max(0,S.fol+nf);S.vfol=Math.max(0,S.vfol+nv);
  if(fire)S.vfol=Math.max(0,S.vfol-Math.round(reach*.00012));
  const rec={kind,text,day:S.day,reach,v,nf,nv,buzz,noted,fire,zombie,shadowed,ev};
  if(!S.best||reach>S.best.reach)S.best=rec;
  S.log.push(rec);
  return rec;
}
/* the other days of the turn: small daily posts that verified followers see */
function passDays(S){
  const R=S.R;
  const d=Math.round(S.vfol*(14+R()*10)+S.fol*(1+R()));
  const v=S.shadow>0?Math.round(d*.2):d;
  S.vimp+=v;S.imp+=Math.round(v*5);
  S.risk=Math.max(0,S.risk-.12);
  S.turn++;S.day=Math.min(DAYS,1+S.turn*9);
  return v;
}
/* random things that happen between posts; returns an event key or null */
function between(S){
  const R=S.R;
  /* the account freezes when the hidden suspicion is high */
  if(S.risk>1.4&&R()<(S.risk-1.4)*.32){S.frozen=S.day;return 'freeze';}
  if(S.risk>.9&&R()<.18){S.shadow=2;return 'shadow';}
  const x=R();
  if(x<.06){S.boost=6+R()*10;return 'famous';}
  if(x<.11){S.vfol=Math.max(0,S.vfol-Math.round(S.vfol*.08+3));S.fol=Math.max(0,S.fol-Math.round(S.fol*.06+5));return 'purge';}
  if(x<.16){return 'algo';}
  return null;
}
/* after day 90 */
function judge(S){
  const R=S.R;
  const months=S.frozen?Math.ceil(S.frozen/30):3;
  const paid=months*FEE;
  const okImp=S.vimp>=GOAL_IMP,okFol=S.vfol>=GOAL_FOL;
  let stage,pay=0;
  if(S.frozen)stage='frozen';
  else if(!okImp||!okFol)stage='short';
  else{
    const pr=Math.min(.85,.08+S.risk*.25+S.noted*.03);
    if(R()<pr)stage='rejected';
    else{stage='paid';pay=Math.round(S.vimp*(.02+R()*.06));}
  }
  return {stage,paid,pay,net:pay-paid,okImp,okFol};
}
function titleOf(S,J){
  if(J.stage==='frozen')return `${S.frozen}日目で凍結された人`;
  if(J.stage==='rejected')return '審査に落ちた人（理由は教えてもらえない）';
  if(J.stage==='paid'){
    if(J.pay>=100000)return '収益化で食べていけそうな人';
    if(J.pay>=30000)return '元を取りすぎた人';
    return '収益化した人';
  }
  const p=S.vimp/GOAL_IMP;
  if(J.okImp&&!J.okFol)return '認証済みフォロワーが足りなかった人';
  if(p<.01)return '身内にしか見られてない人';
  if(p<.05)return '誰にも見つかってない人';
  if(p<.15)return 'インプが欲しすぎる人';
  if(p<.4)return '収益化はまだ遠い人';
  if(p<.8)return 'けっこう惜しい人';
  return 'あと少しだった人';
}
const POSTS={
  q:['収益化目指してるけど進まない。みんな何インプ？','朝ごはん何食べた？名前だけでいい','人生で一番おいしかったコンビニのやつ何？名前だけでいい','AIにほぼ書いてもらう派、自分で書く派、どっち？','最近いちばん笑ったこと何？','1万円拾ったら何に使う？','子どもの頃の夢なんだった？','今いちばん欲しいもの何？名前だけでいい','寝る前に絶対やることある？','好きなおにぎりの具、1個だけ'],
  aru:['夜中に思いついた神機能、朝見るといらない #個人開発あるある','リリース前日に一番でかいバグ見つかる #個人開発あるある','インプ見に来ただけなのに3時間たってる','通知きたと思ったら自分の予約投稿','下書きが200件ある','いいね1の通知で一回喜ぶ','フォロワー1人減ると理由を考え始める','バズった人の投稿、だいたい雑'],
  game:['カップ焼きそばの湯切りで麺を落とさないゲーム作った🍜','ハトに道を譲り続けるゲーム作った🐦','満員電車で吊り革を離さないゲーム作った🚃','ペットボトルのラベルをきれいにはがすゲーム作った','目覚ましを止めずに起きるゲーム作った⏰','自動ドアに無視されないゲーム作った','上司に相槌をうつだけのゲーム作った','エレベーターで開と閉を間違えないゲーム作った'],
  bulba:['#ブルバ100 ブルバの人全員フォロー返します','認証バッジの人とつながりたい #ブルバ100','収益化目指してる人、相互しましょう #ブルバ100','ブルバつけました！よろしくお願いします #ブルバ #ブルバ100','#ブルバ100 いいねした人全員フォローします'],
  aori:['目玉焼きにソースかける人、信じられない','ラーメンにライスつける人、理解できない','まだ手で皿洗ってる人いるの？','電話で済む用事をメールにする人、正直苦手','冷やし中華にマヨネーズは邪道','唐揚げにレモンかける人、一回話し合おう'],

function drawDrafts(S,used){
  const R=S.R,out=[],kinds=[];
