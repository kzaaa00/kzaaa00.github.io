<style>

/* You are the orca in the show pool. Hold to swim faster, let go to slide up the ramp. Stop with your nose right on the red line. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2a27}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#2b9ac4;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#dff1fb,#b9e0f0)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,7.6vw,38px);line-height:1.45;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9ccd2}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}

</style>

<body>
<div id="app">
  <canvas id="cv" aria-label="水族館のショープールを横から見た画面。シャチが水中で勢いをため、プールのふちのスロープに乗り上げる"></canvas>

  <div id="title" class="panel">
    <h1>プールのシャチになって、<br>線ギリギリまで<br>乗り上げろ。</h1>
    <p style="margin:0 0 14px;font-weight:900;font-size:14px;line-height:1.6">あなたはシャチ。ショーのない時間、<br>スロープに自分で乗り上げて遊んでいる。</p>
    <p style="margin:0 0 14px;font-size:13px;line-height:1.6">長押しで勢いをためて、離すと乗り上げる。<br><b>鼻先が赤い線ぴったりで止まれば100%</b>。<br>線を越えたらアウト。</p>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">登場するものはすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>シャチの乗り上げの結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、乗り上げたシャチの写真">
      <p class="fine">登場するものはすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='プールのシャチになって、線ギリギリまで乗り上げろ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://kzaaa00.github.io/orca/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const T=1.4;       /* holding 1.4 s gives exactly the speed that stops the nose on the red line */
const WIN=.05;     /* stopping up to 0.05 % short of the line still counts as exactly on it (100.0 %) */
const MAXT=3.2;    /* nobody holds forever: at 3.2 s it lets go by itself */
/* slide on the ramp = SL * (hold/T)^2 : speed grows with the hold, the slide with the speed squared */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('orca-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}

let SW=null;
const SFX={
  swimOn(){if(muted||!AC)return;try{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();s.loop=true;f.type='lowpass';f.frequency.value=300;g.gain.value=.0001;s.connect(f).connect(g).connect(AC.destination);s.start();SW={s,f,g};}catch(e){}},
  swimSet(u){if(!SW||!AC)return;const t=AC.currentTime;SW.f.frequency.setTargetAtTime(300+u*900,t,.05);SW.g.gain.setTargetAtTime(.02+u*.07,t,.05);},
  swimOff(){if(!SW||!AC)return;const t=AC.currentTime;SW.g.gain.setTargetAtTime(.0001,t,.06);const s=SW.s;setTimeout(()=>{try{s.stop();}catch(e){}},400);SW=null;},
  splash(){noise(.5,.22,900,0,'lowpass');noise(.25,.12,2400,.03,'bandpass',1);},
  slide(){noise(.6,.06,1800,0,'bandpass',2);},
  whistle(){tone(2600,.18,'square',.05,0);tone(2600,.35,'square',.05,.24);},
  happy(){tone(900,.08,'sine',.05,0,1500);tone(1300,.1,'sine',.05,.1,1900);tone(1700,.14,'sine',.04,.22,2300);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('orca-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1,BG=null,BGkey='';
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}

/* ---------- layout: side view of the pool edge. The ramp rises from under the water to the deck. ----------
   p = distance along the ramp line (px). p=0 where the ramp meets the water surface. The red line is at p=SL. */
const SL=150,TOP=186,DROP=-40,OZ=1.15,OL=128*OZ; /* line, top of the ramp, where the ramp drops into deep water, orca size, orca length */
function L(){
  const wy=Math.round(clamp(H*.56,290,H-200));             /* water surface */
  const th=Math.atan2(58,250);                             /* ramp angle */
  const ex=118,ey=wy;                                      /* ramp meets the water */
  const wx=150,wyy=wy+Math.min(120,(H-wy)*.48);            /* where the orca waits, deep in the pool */
  return {wy,th,ex,ey,c:Math.cos(th),s:Math.sin(th),wx,wyy};
}
/* screen point and angle on the ramp line (it turns flat at the top) */
function at(p){const l=L();if(p<=TOP)return {x:l.ex+p*l.c,y:l.ey-p*l.s,a:-l.th};
  const tx=l.ex+TOP*l.c,ty=l.ey-TOP*l.s;return {x:tx+(p-TOP),y:ty,a:0};}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null,PID=null;
function newGame(){ROUND++;G={phase:'ready',t0:performance.now(),res:null,shown:false,plan:undefined,snap:null,snapped:false,round:ROUND,tp:0,tr:0,bub:[],drops:[]};}
/* nose position at time t after letting go */
/* the swim from the waiting spot up to the edge of the ramp, then along the ramp */
function leg(){const l=L();const d=at(DROP);const dx=d.x-l.wx,dy=d.y-l.wyy;return {len:Math.hypot(dx,dy)+(-DROP),a:Math.atan2(dy,dx),dx,dy,seg:Math.hypot(dx,dy)};}
function pose(q){ /* q: distance swum from the waiting spot. p<0 parts are under water */
  const l=L(),g=leg();
  if(q<g.seg){const k=q/g.seg;const blend=ease((q-(g.seg-40))/40);const a=g.a*(1-blend)+(-l.th)*blend;return {x:l.wx+g.dx*k,y:l.wyy+g.dy*k,a,p:DROP-(g.seg-q)};}
  const p=DROP+(q-g.seg);const n=at(p);return {x:n.x,y:n.y,a:n.a,p};
}
function motion(t){
  const r=G.res;const a=(t-G.tr)/1000;const v=r.v;const g=leg();
  const t1=(g.len)/v;                        /* to the waterline at full speed */
  if(a<=0)return {q:0,p:-1e3,moving:true,under:true};
  if(a<t1){const q=v*a;return {q,p:pose(q).p,moving:true,under:true};}
  const dec=v*v/(2*Math.max(1,r.s));const tt=a-t1;const ts=v/dec;
  if(tt>=ts)return {q:g.len+r.s,p:r.s,moving:false,stopAt:G.tr+(t1+ts)*1000};
  const p=v*tt-dec*tt*tt/2;return {q:g.len+p,p,moving:true};
}

/* ---------- input: press = swim faster and faster; let go = up the ramp ---------- */
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
function press(ts=performance.now()){if(!G||G.phase!=='ready')return;ac();G.phase='hold';G.tp=ts;SFX.swimOn();}
function release(ts=performance.now()){
  if(!G||G.phase!=='hold')return;
  ts=Math.max(G.tp,Math.min(ts,G.tp+MAXT*1000));
  const u=(ts-G.tp)/1000/T;const s=SL*u*u;const d=(u*u-1)*100;
  const over=d>0;
  G.res={u,s,d,over,dev:devOf(d),v:Math.max(60,520*u)};G.tr=ts;G.phase='go';SFX.swimOff();
}
cv.addEventListener('pointerdown',e=>{if(!G||PID!==null)return;e.preventDefault();PID=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}press(tsOf(e));});
const up=e=>{if(e.pointerId!==PID)return;PID=null;release(tsOf(e));};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&$('result').hidden&&$('title').hidden){e.preventDefault();press(tsOf(e));}});
addEventListener('keyup',e=>{if(e.code==='Space'&&G){e.preventDefault();release(tsOf(e));}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* how far short of the line, in % of the slide to the line, rounded up so that score + dev = 100 */
function devOf(d){if(d>0)return Math.ceil(d*10-1e-9)/10;if(d>=-WIN)return 0;return Math.max(.1,Math.ceil(-d*10-1e-9)/10);}

function step(now){
  if(G.plan!==undefined&&G.plan!==null){
    if(G.phase==='ready'&&now>=G.t0+600)press(G.t0+600);
    if(G.phase==='hold'){const at=G.tp+T*Math.sqrt(Math.max(0,1+G.plan/100))*1000;if(now>=at)release(at);}
  }
  if(G.phase==='hold'){const u=(now-G.tp)/1000/T;SFX.swimSet(clamp(u/1.6,0,1));if(now-G.tp>=MAXT*1000)release(G.tp+MAXT*1000);}
  if(G.phase==='go'){
    const m=motion(now);
    if(!G.splashed&&m.p>=-14){G.splashed=true;SFX.splash();splashAt(at(0).x,L().wy,1+G.res.u);SFX.slide();}
    if(!m.moving){G.phase='stopped';G.ts=m.stopAt;if(G.res.over){SFX.whistle();anim($('app'),'shake');}else if(G.res.dev<1)SFX.happy();}
  }
  if(G.phase==='stopped'){const a=(now-G.ts)/1000;if(!G.snapped&&a>=.75){G.snapped=true;takeSnap();}
    if(a>=(G.res.over?2.0:1.7)&&!G.shown){G.shown=true;showResult();}}
}

/* ---------- drawing ---------- */
function bg(){
  const key=W+'x'+H+'@'+DPR*SC;if(BG&&BGkey===key)return BG;
  const c=document.createElement('canvas');c.width=Math.round(W*SC*DPR);c.height=Math.round(H*SC*DPR);const x=c.getContext('2d');x.scale(SC*DPR,SC*DPR);
  const {wy}=L();
  /* evening sky and the stands across the pool, out of focus */
  let g=x.createLinearGradient(0,0,0,wy);g.addColorStop(0,'#7fb8e8');g.addColorStop(.55,'#cfe6f4');g.addColorStop(1,'#eef6f8');x.fillStyle=g;x.fillRect(0,0,W,wy);
  x.save();x.filter='blur(3px)';
  const sy=wy-150;x.fillStyle='#b9c7d3';x.fillRect(-10,sy,W+20,120);
  for(let r=0;r<6;r++){x.fillStyle=r%2?'#a9b8c6':'#c4d0da';x.fillRect(-10,sy+r*18,W+20,9);
    for(let i=0;i<22;i++){if(rnd(r*40+i)<.45)continue;const px=i*17+rnd(i+r)*8,py=sy+r*18-6;x.fillStyle=['#e07a5f','#3d5a80','#f2cc8f','#81b29a','#f4f1de','#e5989b'][(i+r)%6];x.beginPath();x.arc(px,py,5,0,7);x.fill();x.fillRect(px-5,py,10,8);}}
  x.restore();
  x.fillStyle='rgba(225,236,243,.45)';x.fillRect(0,sy-10,W,130);
  /* the back wall of the pool, glass panel and a rim */
  g=x.createLinearGradient(0,wy-40,0,wy);g.addColorStop(0,'#6f8ea3');g.addColorStop(1,'#3f6680');x.fillStyle=g;x.fillRect(0,wy-40,W,40);
  x.fillStyle='rgba(255,255,255,.55)';x.fillRect(0,wy-40,W,2);x.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<5;i++){x.beginPath();x.moveTo(i*90+10,wy-38);x.lineTo(i*90+40,wy-38);x.lineTo(i*90+20,wy);x.lineTo(i*90-10,wy);x.closePath();x.fill();}
  /* deep water */
  g=x.createLinearGradient(0,wy,0,H);g.addColorStop(0,'#2b9ac4');g.addColorStop(.35,'#1a6f9e');g.addColorStop(1,'#0b3557');x.fillStyle=g;x.fillRect(0,wy,W,H-wy);
  /* the ramp: wet concrete. It goes on under the water. */
  const l=L();const tx=l.ex+TOP*l.c,ty=l.ey-TOP*l.s;const bx=l.ex+DROP*l.c,by=l.ey-DROP*l.s;
  x.beginPath();x.moveTo(bx,by);x.lineTo(tx,ty);x.lineTo(W+10,ty);x.lineTo(W+10,H+10);x.lineTo(bx,H+10);x.closePath();
  g=x.createLinearGradient(0,ty,0,H);g.addColorStop(0,'#f1f3f3');g.addColorStop((wy-ty)/(H-ty),'#c9d2d6');g.addColorStop(Math.min(1,(wy-ty)/(H-ty)+.001),'#4f9fc0');g.addColorStop(1,'#1d5576');x.fillStyle=g;x.fill();
  /* wet sheen along the slope */
  x.save();x.clip();g=x.createLinearGradient(l.ex,l.ey,tx,ty);g.addColorStop(0,'rgba(120,190,220,.55)');g.addColorStop(.45,'rgba(200,230,240,.25)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,ty-4,W,H);
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.beginPath();x.moveTo(bx,by);x.lineTo(tx,ty);x.lineTo(W+10,ty);x.stroke();x.restore();
  x.strokeStyle='rgba(70,90,100,.55)';x.lineWidth=1.2;x.beginPath();x.moveTo(l.ex,l.ey);x.lineTo(tx,ty);x.lineTo(W+10,ty);x.stroke();
  x.strokeStyle='rgba(20,60,90,.5)';x.lineWidth=2;x.beginPath();x.moveTo(bx,by);x.lineTo(bx,H);x.stroke();
  /* the deck edge and a fish bucket on it */
  x.fillStyle='#8a9aa3';x.fillRect(tx,ty,W-tx+10,4);
  const kx=W-26,ky=ty;x.fillStyle='#3f88c5';x.beginPath();x.moveTo(kx-14,ky-26);x.lineTo(kx+14,ky-26);x.lineTo(kx+11,ky);x.lineTo(kx-11,ky);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.35)';x.fillRect(kx-10,ky-24,4,22);x.fillStyle='#b8c6cf';x.beginPath();x.ellipse(kx,ky-26,14,4,0,0,7);x.fill();

  const lp=at(SL);x.save();x.translate(lp.x,lp.y);x.rotate(lp.a);x.fillStyle='#d62828';x.fillRect(-3,-1,6,10);x.restore();
  x.fillStyle='#9aa7ae';x.fillRect(lp.x-1.5,lp.y-58,3,56);

/* caustic light ripples drawn from a small cached tile */
let CA=null;
function caTile(){if(CA)return CA;const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;for(let i=0;i<26;i++){x.beginPath();const cx0=rnd(i)*128,cy0=rnd(i+9)*128,r=10+rnd(i+3)*18;x.ellipse(cx0,cy0,r,r*.6,rnd(i+5)*3,0,6.3);x.stroke();}
  CA=c;return c;}
function water(x,now,front){
  const {wy}=L();const t=now/1000;
  if(!front){
    x.save();x.beginPath();x.rect(0,wy,W,H-wy);x.clip();x.globalAlpha=.9;const tl=caTile();const ox=(t*14)%128,oy=(t*6)%128;
    for(let yy=wy-128;yy<H;yy+=128)for(let xx=-128;xx<W+128;xx+=128)x.drawImage(tl,xx-ox,yy+oy-128,128,128);x.restore();return;}
  /* the surface: a glassy band in front of everything below it */
  x.save();x.beginPath();x.moveTo(0,H);x.lineTo(0,wy);for(let xx=0;xx<=W;xx+=8){x.lineTo(xx,wy+Math.sin(xx*.05+t*2.2)*2+Math.sin(xx*.13-t*3.1)*1.2);}x.lineTo(W,H);x.closePath();
  const g=x.createLinearGradient(0,wy,0,H);g.addColorStop(0,'rgba(80,190,230,.38)');g.addColorStop(.25,'rgba(30,120,170,.28)');g.addColorStop(1,'rgba(5,40,70,.35)');x.fillStyle=g;x.fill();
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=1.6;x.beginPath();for(let xx=0;xx<=W;xx+=8){const yy=wy+Math.sin(xx*.05+t*2.2)*2+Math.sin(xx*.13-t*3.1)*1.2;xx?x.lineTo(xx,yy):x.moveTo(xx,yy);}x.stroke();x.restore();

/* the orca: nose at (0,0) facing +x, length OL. bend lifts the tail (radians), beat swings the flukes */
function orca(x,bend,beat,wet){
  const l=OL;x.save();

    xx.beginPath();xx.moveTo(0,0);xx.bezierCurveTo(-6,-14,-30,-22,-52,-22);xx.lineTo(-62,-21);xx.lineTo(-62,13);xx.lineTo(-52,13);xx.bezierCurveTo(-30,13,-8,10,0,0);xx.closePath();};

  x.save();x.translate(-52,0);x.rotate(beat);x.fillStyle='#15171c';x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-6,-6,-14,-16,-20,-18);x.bezierCurveTo(-16,-8,-12,-2,-10,0);x.bezierCurveTo(-12,2,-16,8,-20,18);x.bezierCurveTo(-14,16,-6,6,0,0);x.fill();x.restore();
  x.fillStyle='#f4f6f7';x.beginPath();x.moveTo(-6,10);x.bezierCurveTo(-18,10,-28,8,-34,5);x.bezierCurveTo(-24,12,-12,14,-2,14);x.closePath();x.fill();
  x.restore();
  x.fillStyle='#15171c';body(x);x.fill();
  /* white belly and chin */
  x.fillStyle='#f4f6f7';x.beginPath();x.moveTo(-3,3);x.bezierCurveTo(-14,10,-34,12,-58,12);x.lineTo(-58,9);x.bezierCurveTo(-40,8,-22,6,-6,1);x.closePath();x.fill();
  /* eye patch */
  x.beginPath();x.ellipse(-20,-8,7,3,-.15,0,7);x.fill();
  /* saddle patch */
  x.fillStyle='rgba(170,180,190,.75)';x.beginPath();x.ellipse(-56,-18,9,3,0,0,7);x.fill();
  /* dorsal fin */
  x.fillStyle='#15171c';x.beginPath();x.moveTo(-44,-21);x.bezierCurveTo(-46,-34,-50,-44,-48,-52);x.bezierCurveTo(-56,-40,-60,-28,-62,-21);x.closePath();x.fill();
  /* pectoral fin */
  x.beginPath();x.ellipse(-26,10,10,4,.5,0,7);x.fill();
  /* eye */
  x.fillStyle='#000';x.beginPath();x.arc(-13,-5,1.4,0,7);x.fill();
  /* gloss */
  const g=x.createLinearGradient(0,-22,0,6);g.addColorStop(0,`rgba(255,255,255,${.28+wet*.25})`);g.addColorStop(.5,'rgba(255,255,255,0)');
  x.fillStyle=g;body(x);x.fill();
  x.strokeStyle=`rgba(255,255,255,${.35+wet*.3})`;x.lineWidth=1.3;x.beginPath();x.moveTo(-8,-12);x.bezierCurveTo(-20,-19,-36,-20,-46,-20);x.stroke();
  x.restore();
}
function splashAt(sx,sy,k){for(let i=0;i<46;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2;const v=(80+Math.random()*220)*k;G.drops.push({x:sx+(Math.random()-.5)*30,y:sy,vx:Math.cos(a)*v+60,vy:Math.sin(a)*v,r:1.2+Math.random()*2.6,t0:performance.now()});}}
function drops(x,now){
  for(const d of G.drops){const a=(now-d.t0)/1000;if(a>1.4)continue;const px=d.x+d.vx*a,py=d.y+d.vy*a+420*a*a;if(py>L().wy+4&&a>.15)continue;
    x.fillStyle=`rgba(235,248,255,${.85*(1-a/1.4)})`;x.beginPath();x.arc(px,py,d.r,0,7);x.fill();}
}
function scene(x,now){
  x.drawImage(bg(),0,0,W,H);
  water(x,now,false);
  const l=L();const t=now/1000;
  /* where the orca is */
  let q=0,beat=Math.sin(t*4)*.25,bend=0,wet=0,bob=0,p=-1e3;
  if(G){
    if(G.phase==='ready'){bob=Math.sin(t*1.6)*3;}
    if(G.phase==='hold'){const u=(now-G.tp)/1000/T;beat=Math.sin(t*(5+u*16))*(.35+Math.min(u,1.6)*.2);bob=Math.sin(t*(3+u*6))*2;
      if(Math.random()<.5+u*.4)G.bub.push({x:l.wx-OL+Math.random()*14,y:l.wyy+Math.random()*16-8,t0:now,v:30+u*80});}
    if(G.phase==='go'||G.phase==='stopped'){const m=G.phase==='go'?motion(now):{q:leg().len+G.res.s,p:G.res.s,moving:false};q=m.q;p=m.p;beat=m.moving&&m.under?Math.sin(t*22)*.4:0;wet=1;
      if(G.phase==='stopped'&&!G.res.over&&p>OL*.45){const a=(now-G.ts)/1000;bend=.55*ease((a-.15)/.45)*(1+.08*Math.sin(a*5));beat=Math.sin(a*6)*.25*ease((a-.3)/.4);}}
  }
  /* bubbles */
  if(G){G.bub=G.bub.filter(b=>now-b.t0<1600);for(const b of G.bub){const a=(now-b.t0)/1000;const by=b.y-b.v*a;if(by<l.wy+3)continue;x.fillStyle='rgba(220,245,255,.55)';x.beginPath();x.arc(b.x-a*40,by,1.5+a*1.5,0,7);x.stroke&&x.fill();}}
  /* the orca along the ramp line (nose at p) */
  if(p>0){const sh=at(Math.max(0,p-OL*.45));const k=clamp(p/60,0,1);x.save();x.translate(sh.x,sh.y);x.rotate(sh.a);x.fillStyle=`rgba(20,40,50,${.25*k})`;x.beginPath();x.ellipse(0,1,OL*.42,5,0,0,7);x.fill();x.restore();}

  x.fillStyle='rgba(214,40,40,.9)';x.fillRect(-3,-1,6,3);
  x.restore();
  if(!window.__nolabel){x.save();x.font='900 12px '+BODYF();x.textAlign='center';x.textBaseline='bottom';const tx=Math.min(W-90,lp.x),ty=lp.y-58;
  const msg='ここまで（越えたらアウト）';const w=x.measureText(msg).width+14;x.fillStyle='#d62828';rr(x,tx-w/2,ty-18,w,20,6);x.fill();x.fillStyle='#fff';x.fillText(msg,tx,ty-2);x.restore();}
}
function pill(label,lx,ly){cx.save();cx.font='900 14px '+BODYF();cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(label).width+22;cx.fillStyle='rgba(20,40,60,.82)';rr(cx,lx-w/2,ly-15,w,30,15);cx.fill();cx.fillStyle='#fff';cx.fillText(label,lx,ly+1);cx.restore();}
function render(now){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  scene(cx,now);
  if(G&&G.round===1&&G.plan===undefined&&(G.phase==='ready'||G.phase==='hold')){const y=Math.max(70,L().wy-230);pill('長押しで勢いをためて、離すと乗り上げる',180,y);pill('鼻先が赤い線ぴったりで止まれば100%',180,y+36);}
  if(G&&G.phase==='stopped'&&G.res.over){const a=(now-G.ts)/1000;cx.fillStyle=`rgba(214,40,40,${.25*Math.max(0,1-a)})`;cx.fillRect(0,0,W,H);}

function loop(now){requestAnimationFrame(loop);if(G)step(now);render(now);}
requestAnimationFrame(loop);
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- result ---------- */
function cropBox(){const {wy}=L();return {y0:Math.max(0,wy-130),y1:Math.min(H,wy+70)};}
function takeSnap(){
  try{render(performance.now());}catch(e){}
  try{const {y0,y1}=cropBox(),r=SC*DPR;const c=document.createElement('canvas');c.width=cv.width;c.height=Math.round((y1-y0)*r);
    c.getContext('2d').drawImage(cv,0,Math.round(y0*r),cv.width,c.height,0,0,c.width,c.height);G.snap=c;}catch(e){}
}
function failed(r=G.res){return r.over;}
function score(){const r=G.res;if(failed(r))return 0;return Math.max(0,Math.round((100-r.dev)*10)/10);}
function pct(){return score().toFixed(1);}
function statusLine(r=G.res){
  if(r.over)return '線を越えて打ち上がりすぎ';
  if(r.dev===0)return '線ぴったり';
  return '線の'+r.dev.toFixed(1)+'%手前';
}
function titleOf(){
  const r=G.res;
  if(r.over)return '飼育員さんに怒られるシャチ';
  if(r.dev===0)return '座礁あそびの天才シャチ';
  if(r.dev<1)return 'ほぼ天才シャチ';
  if(r.dev<5)return 'ちょっと控えめなシャチ';
  if(r.dev<40)return '水ぎわのシャチ';
  return 'まだ泳いでいたいシャチ';
}
function lineOf(r){
  if(r.over)return '線を'+r.dev.toFixed(1)+'%越えた（アウト）';
  if(r.dev===0)return 'ちょうど線ぴったり';
  return '線まであと'+r.dev.toFixed(1)+'%';
}
function feedback(){return '止まった所：'+lineOf(G.res);}
function shareText(){
  return `プールのシャチになって線ギリギリまで乗り上げろ　${failed()?'越えた':'ギリギリ度'+pct()+'%'}（${statusLine()}）【${titleOf()}】\n${SHARE_URL}`;
}
async function showResult(){
  const r=G.res;
  $('rScore').innerHTML=failed(r)?`ギリギリ度<b>越えた</b>`:`ギリギリ度<b>${pct()}<small>%</small></b>`;
  $('rCount').textContent=statusLine();
  $('rTitle').textContent='【'+titleOf()+'】';
  const lines=[feedback()];
  if(PREV)lines.push('前の回：'+lineOf(PREV));
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=r;
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'orca-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){

  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='orca-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});


async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',Df='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);

  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('ギリギリ度',w/2,32);

  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#2b9ac4';x.fillRect(0,top0,w,sh);}

  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;

  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}


/* ---------- start ---------- */
function begin(){PID=null;newGame();resize();$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
$('startBtn').addEventListener('click',()=>{ac();begin();});
/* for checks and recording: play(p) holds so the slide ends p % past (+) or short (-) of the line; null = never lets go (auto at 3.2 s) */
function play(p){begin();G.plan=p===null?1e6:p;}
window.__orca={get G(){return G;},begin,play,press,release,shareText,showResult,score,L,at,motion,T,SL,WIN,MAXT};

</script>
