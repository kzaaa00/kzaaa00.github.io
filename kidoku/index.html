<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>既読をつけずに、全部読め。</title>
<meta name="description" content="通知を下に引いて、既読をつけずに全部読むゲーム。登場人物は架空です。">
<meta property="og:type" content="website">
<meta property="og:title" content="既読をつけずに、全部読め。">
<meta property="og:description" content="通知を引いて読むだけ。登場人物は架空です。">
<meta property="og:url" content="https://kzaaa00.github.io/kidoku/">
<meta property="og:image" content="https://kzaaa00.github.io/kidoku/play.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* A phone lock screen at night. Notifications from a made-up chat app arrive one by one.
   Pull a notification down to read it. Pull too far, or too fast, and the chat opens: 既読. */
:root{
  --night1:#1b1838; --night2:#3a2a5e; --glass:rgba(255,255,255,.93); --ink:#1f1a24; --muted:#6f6875;
  --app:#ff7a45; --app-d:#c4502a; --chat:#eef0f6; --bubble:#ffffff; --mine:#ffd9c7; --red:#e2364b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0c1c}
body{font-family:var(--body);color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:radial-gradient(120% 80% at 70% 0%,#5b3f8c 0,var(--night2) 35%,var(--night1) 100%);touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-10px,3px)}30%{transform:translate(9px,-3px)}45%{transform:translate(-7px,2px)}60%{transform:translate(5px,-1px)}75%{transform:translate(-3px,0)}}

/* lock screen */
#lock{position:absolute;inset:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;align-items:center}
#date{font-size:15px;font-weight:700;opacity:.85;letter-spacing:.06em}
#clock{font-family:var(--display);font-size:clamp(64px,21vw,96px);line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#stack{position:absolute;left:12px;right:12px;top:calc(150px + env(safe-area-inset-top,0px))}
#more{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:12px;font-weight:700;opacity:0;transition:opacity .2s}
#more.on{opacity:.8}
#hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}
#hint.on{opacity:.75;animation:hint 1.4s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(6px)}}
#home{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:132px;height:5px;margin-left:-66px;border-radius:3px;background:rgba(255,255,255,.7)}

/* notification */
.note{position:absolute;left:0;right:0;top:0;background:var(--glass);color:var(--ink);border-radius:20px;padding:12px 14px 0;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;touch-action:none;cursor:grab;will-change:height}
.note.enter{animation:enter .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{0%{transform:translateY(-130%)}100%{transform:none}}
.note.leave{transition:transform .3s ease-in,opacity .3s;transform:translateY(-140%);opacity:0}
.note.snap{transition:height .25s cubic-bezier(.3,1.4,.5,1)}
.note .top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.note .icon{width:22px;height:22px;border-radius:6px;background:var(--app);display:grid;place-items:center;flex:none}
.note .icon svg{width:15px;height:15px}
.note .time{margin-left:auto;font-weight:500}
.note .who{font-size:16px;font-weight:900;margin:4px 0 2px}
.note .pre{font-size:clamp(17px,4.9vw,20px);font-weight:700;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:clip}
.note .full{font-size:clamp(17px,4.9vw,20px);font-weight:700;line-height:1.55;display:none;word-break:break-all}
.note.pulled .pre{display:none}
.note.pulled .full{display:block}
.note .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--app);transform-origin:left;width:100%}
.note.done .bar{background:#3fae6a}

/* chat (opened = 既読) */
#chat{position:absolute;inset:0;background:var(--chat);color:var(--ink);display:flex;flex-direction:column;z-index:20;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#chat.on{transform:none}
#chat header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;background:#fff;border-bottom:1px solid #dfe2ea;font-weight:900;font-size:17px}
#chat header .back{font-size:22px;color:var(--app);font-weight:900}
#log{flex:1;overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
.msg .b{background:var(--bubble);border-radius:18px;padding:9px 13px;font-size:16px;font-weight:700;line-height:1.5;box-shadow:0 1px 0 rgba(0,0,0,.06);word-break:break-all}
.msg .nm{font-size:11px;color:var(--muted);font-weight:700;margin:0 0 2px 4px}
.msg .r{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;margin-bottom:2px}
.msg.new{animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
#kidokuMark{position:absolute;left:50%;top:42%;z-index:25;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--display);font-size:clamp(64px,22vw,110px);color:var(--red);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.18);opacity:0;pointer-events:none}
#kidokuMark.on{animation:stamp 1.1s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.95)}28%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0}}
#chatFoot{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #dfe2ea;display:flex;gap:10px}
#chatFoot button{flex:1}
#chatFoot button[hidden]{display:none}

/* overlays */
.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:radial-gradient(120% 80% at 70% 0%,#5b3f8c 0,var(--night2) 35%,var(--night1) 100%)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9.4vw,44px);line-height:1.35;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--app);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--app-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--app-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9cbd6}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,.small:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
#title .note2{margin-top:22px;font-size:11.5px;opacity:.6}
#fade{position:absolute;inset:0;z-index:28;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#fadeTime{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:42px;color:#fff;opacity:.9}

#result{background:#f6f3ee;color:var(--ink);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
#result h2 small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted)}
#rOut{font-size:20px;font-weight:900;line-height:1.45;margin:0}
#rTitle{font-size:15px;font-weight:900;color:var(--app-d);margin:0}
#rRows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;font-weight:700;margin:0}
#rRows dt{color:var(--muted)}
#rRows dd{margin:0;font-variant-numeric:tabular-nums}
#card{width:100%;border-radius:10px;border:1px solid #ddd6cc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:-4px 0 0}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="lock">
    <div id="date">11月8日 土曜日</div>
    <div id="clock">22:04</div>
    <div id="stack"><div id="more"></div></div>
    <div id="hint">↓ 引いて読む</div>
    <div id="home"></div>
  </div>

  <div id="chat" aria-hidden="true">
    <header><span class="back">‹</span><span id="chatName"></span></header>
    <div id="log"></div>
    <div id="chatFoot"><button class="btn ghost" id="again" type="button">もう一回</button><button class="btn" id="toResult" type="button">結果を見る</button></div>
  </div>
  <div id="kidokuMark">既読</div>
  <div id="fade"><div id="fadeTime"></div></div>

  <div id="title" class="panel">
    <h1>既読をつけずに、<br>全部読め。</h1>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="note2">登場人物はすべて架空です。音が出ます。</p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>既読報告書 <small id="rDate"></small></h2>
      <p id="rOut"></p>
      <p id="rTitle"></p>
      <dl id="rRows"></dl>
      <img id="card" alt="既読がついた場面の画像">
      <p class="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="retry" type="button">もう一回</button>
      </div>
      <p class="fine">登場人物・アプリはすべて架空です。</p>
    </div>
  </div>
  <button id="mute" type="button" aria-pressed="false">音 ON</button>
  <div id="toast" role="status"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const HASHTAG='既読をつけずに全部読め';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0];return 'https://kzaaa00.github.io/kidoku/';})();
const ICON='<svg viewBox="0 0 20 20"><path d="M10 2C5 2 1.5 5.2 1.5 9c0 2.2 1.2 4.1 3.1 5.4L4 18l4-2.3c.6.1 1.3.2 2 .2 5 0 8.5-3.2 8.5-6.9S15 2 10 2Z" fill="#fff"/></svg>';

/* ---------- the people (all made up) and what they send ---------- */
/* margin: how far past the last line the invisible 既読 line sits (px). vmax: pulling faster than this (px/ms) slips and opens. */
const STAGES=[
  {who:'田辺部長',time:'22:04',date:'11月8日 土曜日',color:'#5a6b8c',life:9000,margin:34,vmax:2.2,
   msgs:['ちょっといい？','明日の会議の資料なんだけど、表紙だけでいいから朝イチで作っておいてもらえる？','急がなくていいからね。（できれば7時までに）'],
   ouch:['既読ついたね。じゃあよろしく']},
  {who:'ゆうき',time:'23:41',date:'11月9日 日曜日',color:'#8c5a7a',life:9000,margin:24,vmax:1.9,
   msgs:['ひさしぶり','急にごめん。この前、駅で見かけた気がして、声かけようか迷ったけど、やめた。','あと、貸してた漫画、全巻まだそっちにあるよね？'],
   ouch:['既読ついたね']},
  {who:'3年2組 同窓会',group:true,time:'20:15',date:'11月10日 月曜日',color:'#3f8c6a',life:7000,gap:2300,margin:18,vmax:1.7,
   msgs:[['たかし','幹事やる人ー？'],['みほ','去年もたかしだったよね'],['たかし','じゃあ今年もおれで'],['けんじ','場所どこにする？駅前の居酒屋か、去年と同じ店か。あと子ども連れてくる人いる？'],['みほ','未読の人、見てるのわかってるからね']],
   ouch:['あ、既読ついた','生きてた','じゃあ幹事よろしく']},
  {who:'母',time:'21:30',date:'11月11日 火曜日',color:'#c4783a',life:10000,margin:12,vmax:1.5,
   msgs:['🍙🍙🍙','お父さんがスマホを新しくしたら、写真が全部消えたと言って騒いでいます。消えていませんでした。','今度の連休は帰ってくるの？帰ってくるなら布団を干しておくので、早めに教えてください。冷蔵庫の中のものは勝手に食べていいです。','🙆‍♀️'],
   ouch:['既読ついたね😊']}
];
const ENDING={who:'母',text:'既読つかないけど、読んでるのわかってるよ'};

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('kidoku-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
let NB=null;
function noise(dur,vol,hp,delay=0,type='highpass'){
  if(muted||!AC)return;if(!NB){const len=AC.sampleRate*.5;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
const SFX={
  ding(){tone(1318,.18,'sine',.09);tone(1760,.25,'sine',.07,.09);},
  read(){tone(660,.08,'triangle',.05);tone(880,.1,'triangle',.05,.06);},
  away(){noise(.12,.12,1800,0,'bandpass');},
  kidoku(){tone(110,.45,'sawtooth',.12,0,55);noise(.25,.6,400,0,'lowpass');tone(392,.5,'square',.05,.05,196);},
  reply(){tone(1046,.12,'sine',.09);tone(1568,.18,'sine',.07,.08);},
  clear(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.07,i*.09));}
};
const bgm={timer:null,step:0,next:0};
const PAD=[[57,64,67],[53,60,64],[55,62,67],[52,59,64]];
function bgmTick(){if(!AC||muted)return;while(bgm.next<AC.currentTime+.2){const ch=PAD[(bgm.step>>3)%4],t=bgm.next;
  if(bgm.step%8===0)ch.forEach(m=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.012,t+.4);g.gain.linearRampToValueAtTime(.0001,t+2.3);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+2.4);});
  if(bgm.step%2===0){const m=ch[(bgm.step>>1)%3]+12,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.012,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3);}
  bgm.step++;bgm.next+=.3;}}
function bgmOn(){if(!ac())return;bgmOff();bgm.next=AC.currentTime+.1;bgm.timer=setInterval(bgmTick,60);}
function bgmOff(){if(bgm.timer){clearInterval(bgm.timer);bgm.timer=null;}}
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('kidoku-mute',muted?'1':'0');}catch(err){}syncMute();});

/* ---------- game state ---------- */
let G=null;
function newGame(){G={stage:0,read:0,missed:0,total:STAGES.reduce((a,s)=>a+s.msgs.length,0),queue:[],front:null,timers:[],state:'idle',fail:null,start:performance.now(),firstPull:true};}
function later(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t;}
function clearTimers(){G.timers.forEach(clearTimeout);G.timers=[];}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1600);}

function setScene(st){$('clock').textContent=st.time;$('date').textContent=st.date;}
function startStage(i){
  const st=STAGES[i];G.stage=i;G.state='play';G.idx=0;G.sentAll=false;
  setScene(st);
  const list=st.msgs.map(m=>Array.isArray(m)?{from:m[0],text:m[1]}:{from:st.who,text:m});
  G.list=list;
  if(st.group){list.forEach((m,k)=>later(()=>arrive(m),600+k*st.gap));later(()=>{G.sentAll=true;},600+(list.length-1)*st.gap);}
  else{later(()=>arrive(list[0]),700);}
}
function arrive(m){
  if(G.state!=='play')return;
  const st=STAGES[G.stage];
  const n={m,born:performance.now(),life:st.life,read:false,el:null,done:false};
  G.queue.push(n);SFX.ding();try{navigator.vibrate&&navigator.vibrate(20);}catch(e){}
  if(!G.front)showFront();else updateMore();
  if(!st.group&&G.idx<G.list.length)G.idx++;
}
function updateMore(){const more=$('more'),k=G.queue.length-(G.front?1:0);more.textContent=k>0?`ほか ${k} 件の通知`:'';more.classList.toggle('on',k>0);}
function preview(t){const a=[...t];const k=Math.max(2,Math.floor(a.length*.45));return a.slice(0,k).join('')+'…';}
function showFront(){
  const n=G.queue[0];if(!n){G.front=null;updateMore();checkStageEnd();return;}
  G.front=n;n.born=performance.now();
  const st=STAGES[G.stage];
  const el=document.createElement('div');el.className='note enter';
  const who=st.group?`${st.who}`:st.who;
  el.innerHTML=`<div class="top"><span class="icon">${ICON}</span>もじもじ<span class="time">今</span></div>
    <div class="who">${who}${st.group?`<span style="font-weight:700;color:#6f6875;font-size:13px">　${n.m.from}</span>`:''}</div>
    <div class="pre"></div><div class="full"></div><div class="bar"></div>`;
  el.querySelector('.pre').textContent=preview(n.m.text);
  el.querySelector('.full').textContent=n.m.text;
  $('stack').appendChild(el);n.el=el;
  requestAnimationFrame(()=>{n.base=el.offsetHeight;el.style.height=n.base+'px';
    /* measure the full text height */
    el.classList.add('pulled');const full=el.querySelector('.full');n.fullH=full.offsetTop+full.offsetHeight+12;el.classList.remove('pulled');
    n.line=n.fullH+st.margin;
    placeHint();});
  bindDrag(n);updateMore();
}
function placeHint(){const h=$('hint');if(G.firstPull&&G.front&&G.front.el){h.style.top=($('stack').offsetTop+G.front.base+16)+'px';h.classList.add('on');}else h.classList.remove('on');}

/* drag to read */
function bindDrag(n){
  const el=n.el;let y0=0,lastY=0,lastT=0,drag=false,pid=null;
  el.addEventListener('pointerdown',e=>{if(G.state!=='play'||n.done)return;ac();drag=true;pid=e.pointerId;try{el.setPointerCapture(pid);}catch(err){}y0=e.clientY;lastY=e.clientY;lastT=performance.now();el.classList.remove('snap');G.firstPull=false;$('hint').classList.remove('on');e.preventDefault();});
  el.addEventListener('pointermove',e=>{if(!drag||G.state!=='play')return;const now=performance.now(),dy=e.clientY-lastY,dt=Math.max(1,now-lastT);
    const d=Math.max(0,e.clientY-y0);pull(n,d);
    if(dy>6&&dy/dt>STAGES[G.stage].vmax){openChat(n,'slip');return;}
    lastY=e.clientY;lastT=now;});
  const up=()=>{if(!drag)return;drag=false;release(n);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
function pull(n,d){
  const el=n.el;const h=n.base+d;
  if(d>4)el.classList.add('pulled');
  el.style.height=h+'px';
  if(h>=n.fullH-2&&!n.read){n.read=true;el.classList.add('done');SFX.read();}
  if(h>n.line)openChat(n,'line');
}
function release(n){
  if(G.state!=='play'||n.done)return;
  const el=n.el;el.classList.add('snap');el.style.height=n.base+'px';
  setTimeout(()=>el.classList.remove('pulled'),180);
  if(n.read)dismiss(n,true);
}
function dismiss(n,wasRead){
  if(n.done)return;n.done=true;
  if(wasRead)G.read++;else G.missed++;
  SFX.away();
  n.el.classList.add('leave');setTimeout(()=>n.el.remove(),320);
  G.queue.shift();G.front=null;
  const st=STAGES[G.stage];
  later(()=>{if(G.state!=='play')return;
    if(!st.group&&G.idx<G.list.length){arrive(G.list[G.idx]);}
    else showFront();},st.group?250:650);
}
function checkStageEnd(){
  const st=STAGES[G.stage];
  if(G.state!=='play'||G.queue.length)return;
  const allSent=st.group?G.sentAll:G.idx>=G.list.length;
  if(!allSent)return;
  G.state='between';
  if(G.stage<STAGES.length-1){later(()=>fadeTo(G.stage+1),600);}
  else later(ending,700);
}
function fadeTo(i){
  const f=$('fade');$('fadeTime').textContent=STAGES[i].time;f.classList.add('on');
  later(()=>{startStage(i);f.classList.remove('on');},900);
}
/* timers on the front notification */
function loop(){
  if(G&&G.state==='play'&&G.front&&G.front.el&&!G.front.done){
    const n=G.front,left=1-(performance.now()-n.born)/n.life;
    const bar=n.el.querySelector('.bar');if(bar)bar.style.transform=`scaleX(${Math.max(0,left)})`;
    if(left<=0){if(n.read)dismiss(n,true);else dismiss(n,false);}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 既読 ---------- */
function openChat(n,why){
  if(G.state!=='play')return;G.state='opened';clearTimers();
  const st=STAGES[G.stage];
  G.fail={stage:G.stage,who:st.who,why,text:n.m.text,from:n.m.from,shown:[]};
  $('hint').classList.remove('on');
  /* fill the chat: everything this person has sent so far */
  const log=$('log');log.innerHTML='';$('chatName').textContent=st.who;
  const sent=[];for(const m of G.list){sent.push(m);if(m===n.m)break;}
  sent.forEach((m,k)=>log.appendChild(bubble(st,m.from,m.text,k===sent.length-1?'既読':'')));
  G.fail.shown=sent.map(m=>[m.from,m.text]);
  $('chat').classList.add('on');$('chat').setAttribute('aria-hidden','false');
  $('toResult').hidden=true;$('again').hidden=true;
  setTimeout(()=>{SFX.kidoku();anim($('app'),'shake');anim($('kidokuMark'),'on');try{navigator.vibrate&&navigator.vibrate([60,40,120]);}catch(e){}},180);
  st.ouch.forEach((t,k)=>setTimeout(()=>{const b=bubble(st,st.group?['けんじ','みほ','たかし'][k]:st.who,t,'');b.classList.add('new');log.appendChild(b);SFX.reply();},950+k*700));
  G.fail.ouch=st.ouch.slice();
  setTimeout(()=>{$('toResult').hidden=false;$('again').hidden=false;},950+st.ouch.length*700+300);
  $('stack').querySelectorAll('.note').forEach(x=>x.remove());G.queue=[];G.front=null;updateMore();
  bgmOff();
}
function bubble(st,from,text,mark){
  const d=document.createElement('div');d.className='msg';
  const initial=(st.group?from:st.who).slice(0,1);
  d.innerHTML=`<div class="av" style="background:${st.color}">${initial}</div><div>${st.group?`<div class="nm">${from}</div>`:''}<div class="b"></div></div>${mark?`<div class="r" style="color:#e2364b">${mark}</div>`:''}`;
  d.querySelector('.b').textContent=text;return d;
}
$('toResult').addEventListener('click',()=>showResult());
$('again').addEventListener('click',()=>{$('chat').classList.remove('on');$('chat').setAttribute('aria-hidden','true');begin();});

/* ---------- clear ---------- */
function ending(){
  G.state='ending';
  const st=STAGES[STAGES.length-1];
  const el=document.createElement('div');el.className='note enter';
  el.innerHTML=`<div class="top"><span class="icon">${ICON}</span>もじもじ<span class="time">今</span></div><div class="who">母</div><div class="full" style="display:block"></div>`;
  el.querySelector('.full').textContent=ENDING.text;
  el.style.paddingBottom='14px';
  later(()=>{$('stack').appendChild(el);SFX.ding();},400);
  later(()=>{SFX.clear();showResult();},4200);
  bgmOff();
}

/* ---------- result ---------- */
function rank(){
  if(G.fail)return ['部長の既読担当','まだ未練がある人','今年の幹事','実家の既読係'][G.fail.stage];
  if(G.missed===0)return '既読をつけない達人';
  return G.missed<=2?'だいたい読んでる人':'未読スルー常習犯';
}
function outcome(){
  if(G.fail)return `${G.fail.who}に既読をつけた。`;
  return G.missed?`既読ゼロで逃げ切った。（${G.missed}件は読めずに流れた）`:'全部読んだ。既読ゼロ。';
}
async function showResult(){
  G.state='result';
  $('chat').classList.remove('on');$('chat').setAttribute('aria-hidden','true');
  $('stack').querySelectorAll('.note').forEach(x=>x.remove());
  const d=new Date();$('rDate').textContent=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  $('rOut').textContent=outcome();$('rTitle').textContent='【'+rank()+'】';
  const reached=G.fail?G.fail.stage+1:STAGES.length;
  $('rRows').innerHTML=`<dt>読んだ通知</dt><dd>${G.read} / ${G.total} 件</dd><dt>読めずに流れた</dt><dd>${G.missed} 件</dd><dt>既読</dt><dd>${G.fail?'1':'0'} 件</dd><dt>たどり着いた相手</dt><dd>${reached} / ${STAGES.length} 人</dd>`;
  $('result').hidden=false;$('mute').hidden=true;
  try{const url=await drawCard();$('card').src=url;}catch(e){}
}
function shareText(){
  if(G.fail)return `${G.fail.who}に既読つけたら「${G.fail.ouch[G.fail.ouch.length-1]}」って来た。【${rank()}】`;
  return G.missed?`既読ゼロで逃げ切った（${G.missed}件は読めず）。でも母には「読んでるのわかってるよ」って言われた`:'既読ゼロで全部読んだ。でも母には「読んでるのわかってるよ」って言われた';
}
$('shareX').addEventListener('click',()=>{
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText())+'&hashtags='+encodeURIComponent(HASHTAG)+'&url='+encodeURIComponent(SHARE_URL);
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});

/* 1200x675 card: the moment it went wrong (or the ending) */
function wrap(x,text,maxW){const out=[];let cur='';for(const ch of text){if(x.measureText(cur+ch).width>maxW&&cur){if('、。？！…」）'.includes(ch)){cur+=ch;continue;}out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  const W=1200,H=675,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',D='"Dela Gothic One",sans-serif';
  /* left: the chat (or the lock screen for a clear) */
  const LW=560;
  if(G.fail){
    const st=STAGES[G.fail.stage];
    x.fillStyle='#eef0f6';x.fillRect(0,0,LW,H);
    x.fillStyle='#fff';x.fillRect(0,0,LW,74);x.fillStyle='#dfe2ea';x.fillRect(0,74,LW,2);
    x.fillStyle='#1f1a24';x.font=`900 28px ${F}`;x.textBaseline='middle';x.fillText(st.who,64,38);
    x.fillStyle='#ff7a45';x.font=`900 36px ${F}`;x.fillText('‹',26,36);
    const items=G.fail.shown.slice(-3).map((m,k,arr)=>({from:m[0],text:m[1],mark:k===arr.length-1}))
      .concat(G.fail.ouch.map((t,k)=>({from:st.group?['けんじ','みほ','たかし'][k]:st.who,text:t,mark:false,ouch:true})));
    /* lay out from the bottom up */
    x.font=`700 26px ${F}`;
    const blocks=items.map(it=>{const lines=wrap(x,it.text,400);return {...it,lines,h:lines.length*38+24+(st.group?26:0)};});
    let y=H-28;
    for(let i=blocks.length-1;i>=0;i--){const b=blocks[i];y-=b.h;b.y=y;y-=16;}
    for(const b of blocks){
      if(b.y<90)continue;
      x.fillStyle=st.color;x.beginPath();x.arc(46,b.y+b.h-24,22,0,Math.PI*2);x.fill();
      x.fillStyle='#fff';x.font=`900 20px ${F}`;x.textAlign='center';x.fillText((st.group?b.from:st.who).slice(0,1),46,b.y+b.h-24);x.textAlign='left';
      let by=b.y;if(st.group){x.fillStyle='#6f6875';x.font=`700 18px ${F}`;x.fillText(b.from,86,by+10);by+=26;}
      x.font=`700 26px ${F}`;const bw=Math.max(...b.lines.map(l=>x.measureText(l).width))+30;
      x.fillStyle=b.ouch?'#fff4ea':'#fff';rr(x,80,by,bw,b.lines.length*38+20,22);x.fill();
      x.fillStyle='#1f1a24';b.lines.forEach((l,k)=>x.fillText(l,95,by+30+k*38));
      if(b.mark){x.fillStyle='#e2364b';x.font=`900 22px ${F}`;x.fillText('既読',80+bw+10,by+b.lines.length*38+6);}
    }
  }else{
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a2a5e');g.addColorStop(1,'#1b1838');x.fillStyle=g;x.fillRect(0,0,LW,H);
    x.fillStyle='#fff';x.textAlign='center';x.font=`400 110px ${D}`;x.textBaseline='alphabetic';x.fillText('21:30',LW/2,190);x.textAlign='left';
    x.fillStyle='rgba(255,255,255,.94)';rr(x,36,250,LW-72,190,28);x.fill();
    x.fillStyle='#ff7a45';rr(x,62,276,30,30,8);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(77,290,10,8,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(69,293);x.lineTo(67,301);x.lineTo(75,296);x.fill();
    x.fillStyle='#6f6875';x.font=`700 20px ${F}`;x.textBaseline='middle';x.fillText('もじもじ',104,292);
    x.fillStyle='#1f1a24';x.font=`900 26px ${F}`;x.fillText('母',62,336);
    x.font=`700 28px ${F}`;wrap(x,ENDING.text,LW-130).forEach((l,k)=>x.fillText(l,62,380+k*40));
  }
  /* right: the report */
  x.fillStyle='#fffaf2';x.fillRect(LW,0,W-LW,H);x.fillStyle='#1f1a24';x.fillRect(LW,0,6,H);
  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle='#1f1a24';x.font=`400 42px ${D}`;x.fillText('既読報告書',LW+56,104);
  x.fillRect(LW+56,124,W-LW-112,4);
  x.font=`900 34px ${F}`;const outLines=wrap(x,outcome(),W-LW-112);outLines.forEach((l,k)=>x.fillText(l,LW+56,190+k*48));
  let y=190+outLines.length*48+10;
  x.fillStyle='#c4502a';x.font=`900 28px ${F}`;x.fillText('【'+rank()+'】',LW+50,y);
  y+=56;x.fillStyle='#6f6875';x.font=`700 24px ${F}`;
  x.fillText(`読んだ通知 ${G.read} / ${G.total} 件　既読 ${G.fail?1:0} 件`,LW+56,y);
  /* the line that hurts, big */
  const big=G.fail?'「'+G.fail.ouch[G.fail.ouch.length-1]+'」':'「'+ENDING.text+'」';
  x.fillStyle='#1f1a24';let fs=44;x.font=`900 ${fs}px ${F}`;let bl=wrap(x,big,W-LW-112);
  while(bl.length>2&&fs>30){fs-=2;x.font=`900 ${fs}px ${F}`;bl=wrap(x,big,W-LW-112);}
  const by=H-70-34-(bl.length-1)*fs*1.3;bl.forEach((l,k)=>x.fillText(l,LW+56,by+k*fs*1.3));
  x.fillStyle='#1f1a24';x.fillRect(LW+6,H-70,W-LW-6,70);
  x.fillStyle='#fff';x.font=`400 24px ${D}`;x.fillText('既読をつけずに、全部読め。',LW+40,H-26);
  x.fillStyle='#ffd23f';x.font=`700 20px ${F}`;x.textAlign='right';x.fillText('#'+HASHTAG,W-30,H-27);x.textAlign='left';
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
function begin(){
  if(G)clearTimers();
  newGame();
  $('stack').querySelectorAll('.note').forEach(x=>x.remove());
  $('chat').classList.remove('on');$('title').hidden=true;
  bgmOn();startStage(0);
}
$('startBtn').addEventListener('click',()=>{ac();begin();});
window.__kidoku={get G(){return G;},STAGES,begin,openChat,showResult,startStage,pull,clearTimers};
</script>
</body>
