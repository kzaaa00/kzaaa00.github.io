/* Spilled rice-cracker seeds on a wet road full of fallen leaves that look just like them. Tap only the real ones. */

<body>
<div id="app">
  <canvas id="cv" aria-label="雨上がりの道。細長いオレンジ茶色の落ち葉と、本物の柿の種が散らばっている"></canvas>

<script>
const $=id=>document.getElementById(id);
const GAME='ぶちまけた柿の種を、落ち葉とまちがえずに拾え。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://tapitta.com/kakinotane/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');
const DISP=getComputedStyle(document.documentElement).getPropertyValue('--display');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const NS=10;       /* ten real seeds */
const LIM=10;      /* seconds */
const LOCK=.6;     /* after pinching a leaf, the hand is busy for 0.6 s */
const REACH=14;    /* a tap picks the nearest thing whose edge is within 14 px */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('kakinotane-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}

const SFX={
  pick(){noise(.04,.09,3200,0,'bandpass',2);tone(1200,.05,'square',.018,0,900);},
  bag(){noise(.09,.05,5000,.03,'highpass');},
  leaf(){noise(.16,.07,1800,0,'bandpass',.7);tone(220,.16,'triangle',.05,.02,160);},
  tick(){tone(1500,.03,'sine',.025);},
  happy(){tone(880,.1,'sine',.05,0,1320);tone(1320,.12,'sine',.05,.12,1760);tone(1760,.2,'sine',.04,.26,2200);},
  ok(){tone(660,.09,'sine',.045,0,880);tone(990,.14,'sine',.04,.1,1100);},
  sad(){tone(330,.3,'triangle',.05,0,220);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('kakinotane-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1,BG=null,BGkey='',ST=null,STkey='';
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',()=>{resize();if(G&&G.layoutH&&Math.abs(G.layoutH-H)>1)layoutObjs(G);});try{visualViewport.addEventListener('resize',()=>resize());}catch(e){}
resize();
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}

/* ---------- layout: looking down at a wet road; a stone wall and three bollards at the top ---------- */
function L(){const wall=Math.round(clamp(H*.19,96,150));return {wall,top:wall+34,bot:H-20,bag:{x:54,y:H-58}};}
function persp(y){const {wall}=L();return .74+.38*clamp((y-wall)/(H-wall),0,1);}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* positions are stored as fractions so the field survives a resize */
function makeObjs(R){
  const seeds=[],leaves=[];
  for(let i=0;i<NS;i++){let u,v,ok,n=0;do{u=.06+R()*.88;v=.04+R()*.92;ok=seeds.every(s=>Math.hypot((s.u-u)*360,(s.v-v)*440)>58)&&!(u<.32&&v>.8);n++;}while(!ok&&n<400);
    seeds.push({kind:'S',u,v,a:R()*Math.PI*2,len:20+R()*2.5,w:5.6+R()*.7,c:(R()<.5?-1:1)*(.9+R()*.4),hue:14+R()*6,lt:36+R()*6,spk:Math.floor(R()*1e6),z:R()});}
  const nL=230;
  for(let i=0;i<nL;i++){const curl=R()<.22;
    leaves.push({kind:'L',u:R()*1.04-.02,v:R()*1.02-.01,a:R()*Math.PI*2,len:curl?17+R()*6:21+R()*13,w:curl?4.2+R()*1.6:4.6+R()*3,bend:(R()-.5)*(curl?7:4),hue:16+R()*20,sat:50+R()*28,lt:28+R()*22,st:3+R()*4,wet:R(),vein:R()<.85,z:R(),spk:Math.floor(R()*1e6)});}
  return {seeds,leaves};
}
function layoutObjs(g){
  const {top,bot,bag}=L();const hh=bot-top;
  for(const o of g.all){o.x=8+o.u*344;o.y=top+o.v*hh;o.s=persp(o.y);}
  /* leaves keep clear of seeds (a seed is never hidden) and of the bag */
  for(const o of g.leaves){o.hide=false;
    if(Math.hypot(o.x-bag.x,o.y-bag.y)<52){o.hide=true;continue;}
    for(let n=0;n<6;n++){let bad=null;for(const s of g.seeds){const need=o.w*o.s/2+s.len*s.s*.5+1.5;if(Math.hypot(o.x-s.x,o.y-s.y)<need+o.len*o.s*.5&&segDist(o,s.x,s.y)<o.w*o.s/2+s.w*s.s/2+1.5){bad=s;break;}}
      if(!bad)break;const dx=o.x-bad.x,dy=o.y-bad.y,d=Math.hypot(dx,dy)||1;o.x+=dx/d*6;o.y+=dy/d*6;if(n===5)o.hide=true;}
    for(const s of g.seeds){if(!o.hide&&segDist(o,s.x,s.y)<s.w*s.s/2+o.w*o.s/2)o.hide=true;}}
  g.layoutH=H;ST=null;
}
function ends(o){const h=o.len*o.s/2,c=Math.cos(o.a),s=Math.sin(o.a);return [o.x-c*h,o.y-s*h,o.x+c*h,o.y+s*h];}
function segDist(o,px,py){const [ax,ay,bx,by]=ends(o);const dx=bx-ax,dy=by-ay;const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
function newGame(seed){ROUND++;const R=mulberry(seed||((Date.now()&0xffff)+ROUND*977));
  const {seeds,leaves}=makeObjs(R);const now=performance.now();
  G={phase:'play',t0:now,seeds,leaves,all:[...leaves,...seeds].sort((a,b)=>a.z-b.z),k:0,m:0,taps:[],fx:[],lock:0,res:null,shown:false,plan:null,snap:null,round:ROUND,lastPick:now};
  layoutObjs(G);
}
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
/* a tap at (px,py) logical, time t */
function tap(px,py,t){
  if(!G||G.phase!=='play')return;ac();
  G.taps.push({x:px,y:py,t});
  if(t<G.lock)return;
  let best=null,bd=1e9;
  for(const o of G.all){if(o.got||o.hide)continue;let d=segDist(o,px,py)-o.w*o.s/2;if(o.kind==='S')d-=3;if(d<bd){bd=d;best=o;}}
  if(!best||bd>REACH){G.fx.push({k:'none',x:px,y:py,t});return;}
  if(best.kind==='S'){best.got=t;G.k++;G.lastPick=t;ST=null;SFX.pick();setTimeout(()=>SFX.bag(),380);G.fx.push({k:'seed',o:best,t});
    if(G.k===NS)finish(t);}
  else{G.m++;G.lock=t+LOCK*1000;best.flip=t;ST=null;SFX.leaf();G.fx.push({k:'leaf',o:best,t});}
}
function toLogical(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/SC,(e.clientY-r.top)/SC];}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='play'||G.plan)return;e.preventDefault();const [px,py]=toLogical(e);tap(px,py,tsOf(e));try{if(navigator.vibrate)navigator.vibrate(8);}catch(err){}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function step(now){
  if(G.phase==='title')return;
  if(G.phase==='play'){
    if(G.plan){for(const p of G.plan){if(p.done)continue;if(now-G.t0>=p.t*1000){p.done=true;const o=p.k==='S'?G.seeds[p.i]:p.k==='L'?G.leaves.filter(l=>!l.hide)[p.i]:null;
      const [px,py]=o?[o.x+(p.dx||0),o.y+(p.dy||0)]:[p.x,p.y];G.lastTapXY=[px,py,now];tap(px,py,G.t0+p.t*1000);}}}
    const left=LIM-(now-G.t0)/1000;
    if(left<=3&&Math.ceil(left)!==G.tk&&left>0){G.tk=Math.ceil(left);SFX.tick();}
    if(left<=0)finish(G.t0+LIM*1000);
  }
  if(G.phase==='done'){const a=(now-G.tj)/1000;
    if(!G.played&&a>=1.3){G.played=true;const k=G.res.k;if(k===NS&&!G.res.m)SFX.happy();else if(k>=7)SFX.ok();else if(k<=3)SFX.sad();}
    if(!G.snap&&a>=1.05)takeSnap();
    if(a>=2.6&&!G.shown){G.shown=true;showResult();}}
}
function finish(t){
  if(G.phase!=='play')return;
  const used=Math.min(LIM,(t-G.t0)/1000);
  G.res={k:G.k,m:G.m,used,per:G.k?(G.lastPick-G.t0)/1000/G.k:0,all:G.k===NS};G.phase='done';G.tj=performance.now();
}

/* ---------- drawing ---------- */
function bg(){
  const key=W+'x'+H+'@'+DPR*SC;if(BG&&BGkey===key)return BG;
  const c=document.createElement('canvas');c.width=Math.round(W*SC*DPR);c.height=Math.round(H*SC*DPR);const x=c.getContext('2d');x.scale(SC*DPR,SC*DPR);
  const {wall}=L();const R=mulberry(77);
  /* asphalt, wet: dark with a cool sheen toward the top */
  let g=x.createLinearGradient(0,wall,0,H);g.addColorStop(0,'#4d5058');g.addColorStop(.35,'#3c3e44');g.addColorStop(1,'#2e2f33');x.fillStyle=g;x.fillRect(0,wall,W,H-wall);
  for(let i=0;i<5200;i++){const yy=wall+R()*(H-wall),s=persp(yy);const l=R();x.fillStyle=l<.5?`rgba(15,15,18,${.25+R()*.3})`:`rgba(${150+R()*60},${150+R()*55},${150+R()*50},${.12+R()*.22})`;x.fillRect(R()*W,yy,(.6+R()*1.2)*s,(.5+R()*.9)*s);}
  /* wet sheen patches reflecting the sky */
  for(let i=0;i<5;i++){const px=R()*W,py=wall+40+R()*(H-wall-80),rx=60+R()*90;g=x.createRadialGradient(px,py,4,px,py,rx);g.addColorStop(0,'rgba(190,200,215,.16)');g.addColorStop(1,'rgba(190,200,215,0)');x.fillStyle=g;x.save();x.translate(px,py);x.scale(1,.45);x.translate(-px,-py);x.beginPath();x.arc(px,py,rx,0,7);x.fill();x.restore();}
  /* a puddle */
  const pu={x:262,y:wall+(H-wall)*.42,rx:74,ry:24};
  x.save();x.beginPath();x.ellipse(pu.x,pu.y,pu.rx,pu.ry,-.05,0,7);x.clip();
  g=x.createLinearGradient(0,pu.y-pu.ry,0,pu.y+pu.ry);g.addColorStop(0,'#8c96a6');g.addColorStop(1,'#5a6170');x.fillStyle=g;x.fillRect(pu.x-pu.rx,pu.y-pu.ry,pu.rx*2,pu.ry*2);

  $('rTitle').textContent='【'+titleOf()+'】';

  if(PREV)lines.push('前の回：'+PREV.k+'粒・葉っぱ'+PREV.m+'回、'+lineOf(PREV));
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=r;
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'kakinotane-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='kakinotane-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});


async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',Df='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  x.fillStyle='#f7f6f2';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('10粒中、拾えた柿の種',w/2,32);
  const fl=failed(),n=fl?bigWord():pct(),u=fl?'':'%';let fs=fl?64:96;x.font=`400 ${fs}px ${Df}`;let tw=x.measureText(n).width;
  while(tw*1.3>w-30&&fs>40){fs-=4;x.font=`400 ${fs}px ${Df}`;tw=x.measureText(n).width;}
  x.font=`400 ${Math.round(fs*.45)}px ${Df}`;const pw=u?x.measureText(u).width+4:0;
  const sx=(w-(tw+pw))/2;x.textAlign='left';x.fillStyle='#c0392b';x.font=`400 ${fs}px ${Df}`;x.fillText(n,sx,124);
  if(u){x.font=`400 ${Math.round(fs*.45)}px ${Df}`;x.fillText(u,sx+tw+4,124);}
  x.textAlign='center';x.fillStyle='#24262b';let ss=17;x.font=`900 ${ss}px ${F}`;while(x.measureText(statusLine()).width>w-20&&ss>11){ss-=.5;x.font=`900 ${ss}px ${F}`;}x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#e2cfb6';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(feedback()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(feedback(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}


/* ---------- start ---------- */
function begin(seed){newGame(seed);resize();layoutObjs(G);$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
$('startBtn').addEventListener('click',()=>{ac();begin();});
/* the title shows a field too */
newGame(5);G.phase='title';ROUND=0;
/* for checks and recording: play(plan, seed). plan: [{t:sec, k:'S'|'L'|'X', i:index, x,y}] */
function play(plan,seed){begin(seed);G.plan=plan.map(p=>({...p}));}
window.__kakinotane={get G(){return G;},begin,play,tap,shareText,showResult,score,L,NS,LIM,REACH,segDist};
