<html lang="ja">
<head>

<style>
/* A plastic bottle. Pull the label's tear strip down along the perforation in one go:
   pull off line and the tear runs sideways, and the rest of the label stays on. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1f2228}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#e6eef2;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#eef5f8,#d9e7ee)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,8.2vw,40px);line-height:1.4;margin:0 0 14px;text-wrap:balance}
#title .lead{margin:0 0 26px;font-size:15px;font-weight:900;line-height:1.6}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9ccd2}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7;white-space:pre-line}
#rPrev{font-size:13px;font-weight:700;color:var(--muted);margin:-6px 0 0;line-height:1.6;border-top:1px dashed #cfd2d8;padding-top:6px}
#rPrev[hidden]{display:none}
#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="ペットボトルのラベルのミシン目を、上から下へ引いてはがす画面"></canvas>

  <div id="title" class="panel">
    <h1>ペットボトルの<br>ラベルを、<br>一回で全部はがせ。</h1>
    <p class="lead">全部はがせたら、次はタイム勝負。<br>速く引くほど、ミシン目からそれやすい。</p>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">商品はすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>ラベルの結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p id="rPrev" hidden></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、ラベルの裂け目が通った道">
      <p class="fine">商品はすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='ペットボトルのラベルを、一回で全部はがせ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://kzaaa00.github.io/label/';})();
const DISP=fontVar('--display'),BODY=fontVar('--body');
function fontVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n);}


/* ---------- the rules (sim.js uses the same numbers) ---------- */
const LEN=200;     /* the perforation: 200 px of the 360-wide space = the label's 100 mm */
const GRIP=30;     /* the tear tip heads toward the finger, which is this far below it */
const BUDGET=12;   /* strain allowed: sum of (sideways offset)^2 x (depth)^2 x (1 + speed/V0) along the way */
const V0=400;      /* speed (px/s of tear) at which the same offset strains the label twice as hard.
                      A slow pull is exactly the first version's rule; the faster the pull, the sooner it runs off. */
const VT=.1;       /* the speed is smoothed over about this many seconds */
const POW=2;
const MAG=4;       /* the drawing shows the sideways offset this many times larger */
const SUB=.5;

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('label-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  zip(d=0){noise(.035,.07,2600+Math.random()*1400,d,'bandpass',2.5);},
  rip(){noise(.22,.28,1900,0,'bandpass',.8);noise(.1,.18,4200,.03,'highpass');},
  snap(d=0){noise(.05,.25,1200,d,'bandpass',1.5);tone(420,.06,'triangle',.04,d,200);},
  pop(){noise(.08,.22,900,0,'bandpass',1);tone(330,.12,'sine',.06,0,620);},
  thud(d=0){noise(.12,.2,300,d,'lowpass');tone(140,.12,'sine',.06,d,80);},
  soft(){tone(500,.08,'sine',.035,0,380);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('label-mute',muted?'1':'0');}catch(err){}syncMute();});

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1;
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
/* the bottle: centre X. The label runs from Lt to Lb (= LEN). The perforation is at PX. */
function L(){const Lt=Math.round(Math.max(140,Math.min(H-300,H*.47-100)));return {X:180,bw:58,Lt,Lb:Lt+LEN,PX:212,base:Lt+LEN+34};}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function ease(e){e=Math.max(0,Math.min(1,e));return e*e*(3-2*e);}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}

/* ---------- the tear (same steps as sim.js) ---------- */
function newTear(){return {tx:0,ty:0,S:0,px:0,py:0,pts:[[0,0]],off:false,time:0,started:false,v:0};}
/* the finger moved to (fx,fy), measured from where it went down, dt seconds after the last move.
   Returns 'off', 'done' or ''. The clock runs from the moment the tear starts to move. */
function advance(T,fx,fy,dt){
  if(T.off)return 'off';
  dt=Math.max(0,dt||0);
  if(!T.started){if(fy<=T.ty){T.px=fx;T.py=fy;return '';}T.started=true;dt=Math.min(dt,1/60);}
  T.time+=dt;
  if(fy>T.ty){
    const dy=fy-T.ty,vi=dy/Math.max(dt,1e-3);
    T.v=T.v?T.v+(vi-T.v)*(1-Math.exp(-dt/VT)):vi;
    const m=1+T.v/V0;
    while(T.ty<fy&&T.ty<LEN){
      const st=Math.min(SUB,fy-T.ty,LEN-T.ty);
      const nx=T.px+(fx-T.px)*((T.ty+st-T.py)/Math.max(1e-9,fy-T.py));
      T.tx+=st*(nx-T.tx)/GRIP;T.ty+=st;T.S+=m*T.tx*T.tx*st*Math.pow(T.ty/LEN,POW);
      if(T.pts.length===0||T.ty-T.pts[T.pts.length-1][1]>=2)T.pts.push([T.tx,T.ty]);
      if(T.S>BUDGET){T.off=true;T.pts.push([T.tx,T.ty]);return 'off';}
    }
    T.pts.push([T.tx,T.ty]);
    if(T.ty>=LEN)return 'done';
  }
  T.px=fx;T.py=fy;return '';
}
/* a planned pull (for checks and recording): straight at `ang` degrees, plus a slow sway */
function planX(p,y){return Math.tan((p.ang||0)*Math.PI/180)*y+(p.sway||0)*Math.sin(y/(p.wl||90)*Math.PI*2)+(p.bend||0)*Math.pow(y/LEN,3);}
function planResult(p){const T=newTear(),dt=2/(p.speed||260);const end=p.stopAt||LEN+4;for(let y=2;y<=end;y+=2){const r=advance(T,planX(p,y),y,dt);if(r)return {r,T,pct:pctOf(T,r),time:T.time};}return {r:'stop',T,pct:pctOf(T,'stop'),time:T.time};}
function pctOf(T,r){return r==='done'?100:Math.min(99.9,Math.floor(T.ty/LEN*1000)/10);}

/* ---------- state ---------- */
let G=null;
function newGame(){G={phase:'aim',t:0,drag:null,T:newTear(),res:null,shown:false,snap:null,snapped:false,zipAt:0};}

/* ---------- input: put a finger down anywhere and pull straight down ---------- */
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='aim'||G.auto)return;ac();try{cv.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();const P=pt(e);G.drag={x0:P.x,y0:P.y,fx:0,fy:0,ts:e.timeStamp};});
/* every point the finger passed (coalesced events), each with its own time: the speed is what the finger really did */
cv.addEventListener('pointermove',e=>{if(!G||!G.drag||G.phase!=='aim')return;
  let evs=[e];try{const c=e.getCoalescedEvents&&e.getCoalescedEvents();if(c&&c.length)evs=c;}catch(err){}
  for(const ev of evs){if(!G.drag||G.phase!=='aim')break;const P=pt(ev);const ts=ev.timeStamp||e.timeStamp;const dt=Math.max(0,(ts-G.drag.ts)/1000);G.drag.ts=Math.max(G.drag.ts,ts);pull(P.x-G.drag.x0,P.y-G.drag.y0,dt);}});
const up=()=>{if(!G||!G.drag)return;G.drag=null;if(G.phase!=='aim')return;
  if(G.T.ty<8){G.T=newTear();return;} /* a tap or a tiny pull: start again */
  finish('stop');};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function pull(fx,fy,dt){
  if(G.drag){G.drag.fx=fx;G.drag.fy=fy;}
  const before=G.T.ty,r=advance(G.T,fx,fy,dt);
  if(G.T.ty-G.zipAt>=7){G.zipAt=G.T.ty;SFX.zip();}
  if(r==='off')finish('off');else if(r==='done')finish('clean');
  return before;
}
function finish(kind){
  if(G.phase!=='aim')return;
  const T=G.T;G.drag=null;G.auto=null;
  G.res={kind,pct:pctOf(T,kind==='clean'?'done':kind),side:T.tx>=0?1:-1,ty:T.ty,tx:T.tx,time:T.time,strain:T.S/BUDGET};
  G.phase=kind;G.t=0;remember();
  if(kind==='off'){SFX.rip();anim($('app'),'shake');try{navigator.vibrate&&navigator.vibrate([30,20,60]);}catch(e){}}
  else if(kind==='clean'){SFX.pop();}
  else SFX.soft();
  G.endIn=kind==='off'?1900:kind==='clean'?2100:1300;
}
function step(dt,now){
  G.t+=dt;
  if(G.phase==='aim'&&G.auto){const a=G.auto;if(G.t>=a.at){
      const y=Math.min((G.t-a.at)*a.speed,(a.p.stopAt||LEN+4));
      while(a.y+2<=y&&G.phase==='aim'){a.y+=2;a.fx=planX(a.p,a.y);pull(a.fx,a.y,2/a.speed);}
      if(G.phase==='aim'&&a.p.stopAt&&a.y>=a.p.stopAt){finish('stop');}
  }}
  if(G.phase==='off'){if(!G.snd1&&G.t>=.3){G.snd1=true;SFX.snap();}}
  if(G.phase==='clean'){if(!G.snd1&&G.t>=.75){G.snd1=true;SFX.thud();}}
  const snapAt=G.phase==='off'?1.1:G.phase==='clean'?1.3:.35;
  if(G.phase!=='aim'&&!G.snapped&&G.t>=snapAt){G.snapped=true;takeSnap();}
  if(G.phase!=='aim'&&G.t*1000>=G.endIn&&!G.shown){G.shown=true;showResult();}
}

/* ---------- drawing ---------- */
function drawRoom(x){
  const {base}=L();
  x.fillStyle='#e6eef2';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(120,150,165,.18)';x.lineWidth=1;
  for(let y=base-20;y>0;y-=36){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
  for(let r=0;(r)*36<base;r++)for(let c=0;c<11;c++){const xx=c*36+(r%2?18:0);x.beginPath();x.moveTo(xx,base-20-r*36);x.lineTo(xx,base-20-r*36-36);x.stroke();}
  x.fillStyle='#b9c4cb';x.fillRect(0,base-20,W,H-base+20);
  x.fillStyle='#cfd8de';x.fillRect(0,base-20,W,5);
  x.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<6;i++)x.fillRect(0,base-6+i*24,W,1);
}
/* the bottle outline: shoulders up to the neck */
function bottlePath(x){
  const {X,bw,Lt,base}=L(),top=Lt-36,nk=17,nt=Lt-96;
  x.beginPath();x.moveTo(X-bw,base-10);x.lineTo(X-bw,top);
  x.bezierCurveTo(X-bw,top-30,X-nk,nt+22,X-nk,nt);x.lineTo(X+nk,nt);
  x.bezierCurveTo(X+nk,nt+22,X+bw,top-30,X+bw,top);x.lineTo(X+bw,base-10);
  x.quadraticCurveTo(X+bw,base,X+bw-10,base);x.lineTo(X-bw+10,base);x.quadraticCurveTo(X-bw,base,X-bw,base-10);x.closePath();
}
function drawBottle(x){
  const {X,bw,Lt,base}=L();
  x.fillStyle='rgba(40,70,90,.16)';x.beginPath();x.ellipse(X+8,base+2,bw+12,8,0,0,Math.PI*2);x.fill();
  x.save();bottlePath(x);x.clip();
  const g=x.createLinearGradient(X-bw,0,X+bw,0);g.addColorStop(0,'#b7d6e4');g.addColorStop(.3,'#e4f2f8');g.addColorStop(.7,'#d3e8f1');g.addColorStop(1,'#a9cad9');
  x.fillStyle=g;x.fillRect(X-bw-2,Lt-100,bw*2+4,base-Lt+102);
  /* water up to the shoulder */
  x.fillStyle='rgba(120,180,210,.22)';x.fillRect(X-bw-2,Lt-30,bw*2+4,base-Lt+30);
  x.fillStyle='rgba(255,255,255,.5)';x.fillRect(X-bw-2,Lt-31,bw*2+4,1.5);
  /* ribs and a highlight */
  x.strokeStyle='rgba(80,130,155,.2)';x.lineWidth=1.2;for(const dy of [-12,base-Lt-14]){x.beginPath();x.moveTo(X-bw,Lt+dy);x.lineTo(X+bw,Lt+dy);x.stroke();}
  x.fillStyle='rgba(255,255,255,.55)';x.fillRect(X-bw+10,Lt-60,7,base-Lt+40);
  x.restore();
  bottlePath(x);x.strokeStyle='rgba(70,110,130,.45)';x.lineWidth=1.4;x.stroke();
  /* cap */
  const nt=Lt-96;x.fillStyle='#f4f6f7';rr(x,X-21,nt-28,42,28,5);x.fill();x.strokeStyle='rgba(60,80,90,.35)';x.lineWidth=1;x.stroke();
  x.strokeStyle='rgba(60,80,90,.18)';for(let i=-17;i<=17;i+=4){x.beginPath();x.moveTo(X+i,nt-25);x.lineTo(X+i,nt-3);x.stroke();}
  x.fillStyle='#e3e8ea';x.fillRect(X-23,nt-2,46,5);
}
/* the label, printed side out. hole: the strip already pulled off (a path of points). */
function labelPaint(x,ox,oy,squash){
  const {X,bw,Lt,Lb}=L();const w=bw*2,h=LEN;
  x.save();x.translate(ox,oy);
  if(squash){x.translate(0,Lb);x.scale(1,squash);x.translate(0,-Lb);}

  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  let pic=null;try{pic=trailPic();}catch(e){pic=G.snap;}
  try{x.drawImage(pic,0,0,pic.width,pic.height,0,top0,w,sh);}catch(e){x.fillStyle='#e9e2d4';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';x.textBaseline='middle';const fb=feedback();
  fb.forEach((t,i)=>{let fz=14;x.font=`700 ${fz}px ${F}`;while(x.measureText(t).width>w-20&&fz>10){fz-=.5;x.font=`700 ${fz}px ${F}`;}x.fillText(t,w/2,fbTop+fbH/2+(i-(fb.length-1)/2)*21);});
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${D}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>9){gs-=.5;x.font=`400 ${gs}px ${D}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
function begin(){newGame();resize();$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
$('startBtn').addEventListener('click',()=>{ac();begin();});
/* for checks and recording: play(p) pulls along planX(p) at p.speed px/s after p.at seconds */
function play(p){begin();G.auto={p,at:p.at||.5,speed:p.speed||260,y:0,fx:0};}
window.__label={get G(){return G;},begin,play,planResult,planX,shareText,showResult,score,L,LEN,feedback};
</script>
