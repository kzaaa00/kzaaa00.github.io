<style>

/* An omelette from above. Draw one stroke of ketchup over the dotted heart: slow = thick, fast = thin. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;

*,*::before,*::after{box-sizing:border-box}

body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}

@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

<body>
<div id="app">
  <canvas id="cv" aria-label="木のテーブルの上のお皿とオムライスを真上から見た画面。ハートの点線とうすい帯がある"></canvas>

  <div id="title" class="panel">

    <button class="btn" id="startBtn" type="button">はじめる</button>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='オムライスのケチャップを、はみ出さずにハートに描け。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://tapitta.com/ketchup/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');

/* ---------- the rules: score.js (shared with sim.js) ---------- */
/* shared by the game and sim.js: ketchup line width from the drawing speed, and the score of one stroke */
const KQ=(typeof process!=='undefined'&&process.env.KQ)?+process.env.KQ:2600;      /* ketchup flow: width (px) = KQ / speed (px/s) */
const WMIN=3.2,WMAX=30;
const BAND=(typeof process!=='undefined'&&process.env.BAND)?+process.env.BAND:8;       /* the pale heart band: 8 px each side of the dotted line */
const CENT=(typeof process!=='undefined'&&process.env.CENT)?+process.env.CENT:.6,CENK=2; /* the line's average distance from the dotted line: up to 0.6 px is free, then 2 % per px */
const VSTART=300;   /* speed assumed when the finger first touches (no blob at the start) */
function heartPts(cx,cy,S,N){ /* the dotted line, resampled evenly along its length */
  const raw=[];for(let i=0;i<=2000;i++){const t=i/2000*Math.PI*2;const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);raw.push([cx+x*S,cy-y*S]);}
  const cum=[0];for(let i=1;i<raw.length;i++)cum.push(cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));
  const L=cum[cum.length-1],out=[];let k=0;
  for(let i=0;i<N;i++){const s=i/N*L;while(cum[k+1]<s)k++;const f=(s-cum[k])/(cum[k+1]-cum[k]||1);out.push({x:raw[k][0]+(raw[k+1][0]-raw[k][0])*f,y:raw[k][1]+(raw[k+1][1]-raw[k][1])*f});}
  return {pts:out,L};
}
/* add a point of the stroke: speed is smoothed over ~50 ms, the width follows from it */
function addPt(st,x,y,t){
  const p=st.pts;if(!p.length){p.push({x,y,t,v:VSTART,w:KQ/VSTART});return;}
  const q=p[p.length-1];const dt=Math.max(1,t-q.t);const inst=Math.hypot(x-q.x,y-q.y)/(dt/1000);
  const a=1-Math.exp(-dt/50);const v=q.v+(inst-q.v)*a;let w=KQ/Math.max(1,v);w=w<WMIN?0:Math.min(WMAX,w);
  p.push({x,y,t,v,w});
}
function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let u=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0;u=Math.max(0,Math.min(1,u));return Math.hypot(px-a.x-u*dx,py-a.y-u*dy);}
function judge(pts,G){ /* G = heartPts(...) */
  const g=G.pts,N=g.length;let unc=0;
  for(const q of g){let ok=false;for(let j=1;j<pts.length;j++){const a=pts[j-1],b=pts[j];const w=Math.min(a.w,b.w)?(a.w+b.w)/2:0;if(!w)continue;
      if(Math.abs(q.x-a.x)>40&&Math.abs(q.x-b.x)>40)continue;if(segDist(q.x,q.y,a,b)-w/2<=0){ok=true;break;}}
    if(!ok)unc++;}
  if(pts.length===1&&pts[0].w){/* a single dab */unc=N-g.filter(q=>Math.hypot(q.x-pts[0].x,q.y-pts[0].y)<=pts[0].w/2).length;}
  let ov=0,sd=0,sl=0;
  for(let j=1;j<pts.length;j++){const a=pts[j-1],b=pts[j];const w=Math.min(a.w,b.w)?(a.w+b.w)/2:0;if(!w)continue;const l=Math.max(.5,Math.hypot(b.x-a.x,b.y-a.y));
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let d=1e9;for(let i=0;i<N;i++){const dd=segDist(mx,my,g[i],g[(i+1)%N]);if(dd<d)d=dd;}
    const o=Math.max(0,d+w/2-BAND);ov+=l*Math.min(o,2*BAND);sd+=l*d;sl+=l;}
  const uncP=unc/N*100,ovP=ov/(G.L*BAND)*100,md=sl?sd/sl:BAND,cen=CENK*Math.max(0,md-CENT);
  return {unc:uncP,ovf:ovP,cen,md,dev:uncP+ovP+cen};
}

/* a synthetic stroke along the heart: lateral wobble a (px rms), speed v (px/s) varying by b, ends 'over' px past the start */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genStroke(G,o,t0){
  const R=mulberry(o.seed||1),g=G.pts,N=g.length,L=G.L;
  const waves=[];for(let i=0;i<4;i++)waves.push({k:2*Math.PI/(60+R()*260),ph:R()*7});
  const wv=[];for(let i=0;i<3;i++)wv.push({k:2*Math.PI/(80+R()*300),ph:R()*7});
  const nz=(s,W)=>{let z=0;for(const w of W)z+=Math.sin(w.k*s+w.ph);return z/Math.sqrt(W.length/2);};
  const at=s=>{const f=((s%L)+L)%L/L*N;const i=Math.floor(f)%N,j=(i+1)%N,u=f-Math.floor(f);const p={x:g[i].x+(g[j].x-g[i].x)*u,y:g[i].y+(g[j].y-g[i].y)*u};
    const a=g[(i+N-2)%N],b=g[(i+3)%N];const tx=b.x-a.x,ty=b.y-a.y,l=Math.hypot(tx,ty)||1;return {x:p.x,y:p.y,nx:-ty/l,ny:tx/l};};
  const out=[];let s=0,t=t0;const end=L+(o.over||0);const dt=1000/120;
  while(s<=end){const p=at(s);const e=o.a*nz(s,waves);out.push({x:p.x+p.nx*e,y:p.y+p.ny*e,t});
    const v=Math.max(40,o.v*(1+o.b*nz(s,wv)));s+=v*dt/1000;t+=dt;}
  return out;
}

const WIN=.05;     /* off by 0.05 % or less still counts as 100.0 % */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('ketchup-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}

let SQ=null;
const SFX={
  squeezeOn(){if(muted||!AC||SQ)return;try{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf();s.loop=true;f.type='bandpass';f.frequency.value=380;f.Q.value=3;g.gain.value=.0001;s.connect(f).connect(g).connect(AC.destination);s.start();SQ={s,f,g};}catch(e){}},
  squeezeSet(w){if(!SQ||!AC)return;const t=AC.currentTime;SQ.g.gain.setTargetAtTime(.015+Math.min(.09,w/300),t,.03);SQ.f.frequency.setTargetAtTime(260+w*12,t,.05);},
  squeezeOff(){if(!SQ||!AC)return;const t=AC.currentTime;SQ.g.gain.setTargetAtTime(.0001,t,.04);const s=SQ.s;setTimeout(()=>{try{s.stop();}catch(e){}},300);SQ=null;},
  pfft(){noise(.12,.12,600,0,'lowpass');},
  happy(){tone(880,.1,'sine',.05,0,1320);tone(1320,.12,'sine',.05,.12,1760);tone(1760,.2,'sine',.04,.26,2200);},
  sad(){tone(330,.3,'triangle',.05,0,220);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('ketchup-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1,BG=null,BGkey='';
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);HG=null;
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}

/* ---------- layout: the plate from above, the omelette, the heart ---------- */
const HS=6.6;   /* heart scale: 16*6.6*2 = 211 px wide */
function L(){const cy=Math.round(clamp(H*.5,270,H-230));return {cx:180,cy,hy:cy+12};}
let HG=null;function heart(){if(!HG){const l=L();HG=heartPts(l.cx,l.hy,HS,360);}return HG;}
resize();

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null,PID=null;
function newGame(){ROUND++;G={phase:'ready',t0:performance.now(),st:{pts:[]},res:null,shown:false,plan:undefined,snap:null,snapped:false,round:ROUND,drips:[]};}
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
function ptOf(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
function down(x,y,t){if(!G||G.phase!=='ready')return;ac();G.phase='draw';G.td=t;addPt(G.st,x,y,t);SFX.squeezeOn();SFX.pfft();}
function move(x,y,t){if(!G||G.phase!=='draw')return;const p=G.st.pts;if(t<=p[p.length-1].t)return;addPt(G.st,x,y,t);SFX.squeezeSet(p[p.length-1].w);}
function up(t){if(!G||G.phase!=='draw')return;SFX.squeezeOff();G.phase='done';G.tu=t;
  const r=judge(G.st.pts,heart());r.devS=devOf(r.dev);G.res=r;}
cv.addEventListener('pointerdown',e=>{if(!G||PID!==null||G.phase!=='ready')return;e.preventDefault();PID=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}const p=ptOf(e);down(p.x,p.y,tsOf(e));});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==PID)return;const list=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of (list.length?list:[e])){const p=ptOf(c);move(p.x,p.y,tsOf(c));}});
const upH=e=>{if(e.pointerId!==PID)return;PID=null;up(tsOf(e));};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* rounded up to 0.1 so that score + off = 100 */
function devOf(d){if(d<=WIN)return 0;return Math.max(.1,Math.ceil(d*10-1e-9)/10);}

function step(now){
  if(G.plan){ /* scripted stroke for checks and the video */
    if(!G.planPts){G.planPts=genStroke(heart(),G.plan,G.t0+700);G.pi=0;}
    const P=G.planPts;
    while(G.pi<P.length&&P[G.pi].t<=now){const q=P[G.pi];if(G.pi===0)down(q.x,q.y,q.t);else move(q.x,q.y,q.t);G.pi++;}
    if(G.pi>=P.length&&G.phase==='draw')up(P[P.length-1].t+10);
  }
  if(G.phase==='draw'){ /* the finger rests: ketchup keeps coming out where it is */
    const p=G.st.pts,q=p[p.length-1];if(now-q.t>45){addPt(G.st,q.x,q.y,now);SFX.squeezeSet(p[p.length-1].w);}
    if(now-G.td>15000)up(now);
  }
  if(G.phase==='done'){const a=(now-G.tu)/1000;
    if(!G.played&&a>=.25){G.played=true;if(G.res.devS<1)SFX.happy();else if(G.res.devS>40)SFX.sad();}
    if(!G.snapped&&a>=.5){G.snapped=true;takeSnap();}
    if(a>=1.4&&!G.shown){G.shown=true;showResult();}}
}

/* ---------- drawing ---------- */
function bg(){
  const key=W+'x'+H+'@'+DPR*SC;if(BG&&BGkey===key)return BG;
  const c=document.createElement('canvas');c.width=Math.round(W*SC*DPR);c.height=Math.round(H*SC*DPR);const x=c.getContext('2d');x.scale(SC*DPR,SC*DPR);
  const l=L();
  /* wooden table */
  x.fillStyle='#c9925e';x.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){x.strokeStyle=`rgba(120,70,30,${.06+rnd(i)*.08})`;x.lineWidth=1+rnd(i+3)*2;x.beginPath();const y=rnd(i+5)*H;x.moveTo(0,y);x.bezierCurveTo(120,y+rnd(i+7)*20-10,240,y+rnd(i+9)*20-10,W,y+rnd(i+11)*16-8);x.stroke();}
  /* plate */
  x.fillStyle='rgba(60,30,10,.22)';x.beginPath();x.ellipse(l.cx+4,l.cy+10,172,142,0,0,7);x.fill();
  let g=x.createRadialGradient(l.cx-40,l.cy-50,20,l.cx,l.cy,175);g.addColorStop(0,'#ffffff');g.addColorStop(.8,'#eef0f2');g.addColorStop(1,'#d4d8dd');
  x.fillStyle=g;x.beginPath();x.ellipse(l.cx,l.cy,170,140,0,0,7);x.fill();
  x.strokeStyle='rgba(150,160,170,.5)';x.lineWidth=1.5;x.beginPath();x.ellipse(l.cx,l.cy,140,112,0,0,7);x.stroke();
  /* omelette */
  x.fillStyle='rgba(120,80,20,.25)';x.beginPath();x.ellipse(l.cx+3,l.cy+9,146,112,0,0,7);x.fill();
  g=x.createRadialGradient(l.cx-30,l.cy-40,10,l.cx,l.cy,150);g.addColorStop(0,'#ffe27a');g.addColorStop(.7,'#f8c64a');g.addColorStop(1,'#e09a2a');
  x.fillStyle=g;x.beginPath();x.ellipse(l.cx,l.cy,145,110,0,0,7);x.fill();
  x.save();x.clip();for(let i=0;i<60;i++){x.fillStyle=`rgba(${rnd(i)<.5?255:200},${rnd(i)<.5?240:140},${rnd(i)<.5?180:40},.18)`;x.beginPath();x.ellipse(l.cx+(rnd(i+1)-.5)*280,l.cy+(rnd(i+2)-.5)*210,4+rnd(i+3)*14,2+rnd(i+4)*5,rnd(i+5)*3,0,7);x.fill();}x.restore();
  /* the pale heart band and the dotted line */
  const hp=heart().pts;
  x.strokeStyle='rgba(255,255,255,.42)';x.lineWidth=BAND*2;x.lineJoin='round';x.lineCap='round';x.beginPath();hp.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.stroke();
  x.fillStyle='rgba(150,40,20,.55)';hp.forEach((p,i)=>{if(i%4===0){x.beginPath();x.arc(p.x,p.y,1.3,0,7);x.fill();}});
  BG=c;BGkey=key;return c;
}
function ketchup(x,pts,upto){
  const n=upto===undefined?pts.length:upto;
  x.lineCap='round';x.lineJoin='round';
  for(let pass=0;pass<3;pass++){
    for(let j=1;j<n;j++){const a=pts[j-1],b=pts[j];const w=Math.min(a.w,b.w)?(a.w+b.w)/2:0;if(!w)continue;
      if(pass===0){x.strokeStyle='rgba(90,10,5,.35)';x.lineWidth=w+1.2;x.beginPath();x.moveTo(a.x+.6,a.y+1);x.lineTo(b.x+.6,b.y+1);x.stroke();}
      else if(pass===1){x.strokeStyle='#b8140f';x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
      else{x.strokeStyle='rgba(255,170,150,.55)';x.lineWidth=Math.max(.8,w*.22);x.beginPath();x.moveTo(a.x-w*.15,a.y-w*.18);x.lineTo(b.x-w*.15,b.y-w*.18);x.stroke();}}
  }
  if(n===1&&pts[0].w){x.fillStyle='#b8140f';x.beginPath();x.arc(pts[0].x,pts[0].y,pts[0].w/2,0,7);x.fill();}
}
function bottle(x,p,tilt){
  x.save();x.translate(p.x,p.y);x.rotate(tilt);
  x.fillStyle='#f4f4f2';x.beginPath();x.moveTo(-3,-2);x.lineTo(3,-2);x.lineTo(5,-16);x.lineTo(-5,-16);x.closePath();x.fill();
  let g=x.createLinearGradient(-22,0,22,0);g.addColorStop(0,'#9e0f0b');g.addColorStop(.35,'#e0281f');g.addColorStop(.6,'#c41a14');g.addColorStop(1,'#7e0a07');
  x.fillStyle=g;rr(x,-20,-90,40,74,14);x.fill();
  x.fillStyle='#f4f4f2';rr(x,-12,-22,24,8,3);x.fill();
  x.fillStyle='rgba(255,255,255,.35)';rr(x,-14,-84,6,56,3);x.fill();
  x.fillStyle='#fff8e8';rr(x,-14,-66,28,22,4);x.fill();x.fillStyle='#c41a14';x.font='900 9px '+BODYF();x.textAlign='center';x.textBaseline='middle';x.fillText('トマト',0,-55);
  x.restore();
}
function scene(x,now){
  x.drawImage(bg(),0,0,W,H);
  if(!G)return;
  ketchup(x,G.st.pts);
  if(G.phase==='draw'){const p=G.st.pts[G.st.pts.length-1];bottle(x,p,-.18);}
}
function pill(label,lx,ly){cx.save();cx.font='900 14px '+BODYF();cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(label).width+22;cx.fillStyle='rgba(60,30,10,.82)';rr(cx,lx-w/2,ly-15,w,30,15);cx.fill();cx.fillStyle='#fff';cx.fillText(label,lx,ly+1);cx.restore();}
function render(now){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  scene(cx,now);
  if(G&&G.round===1&&G.plan===undefined&&G.phase==='ready'){const y=Math.max(44,L().cy-180);pill('指で1筆、点線の上をなぞる',180,y);pill('うすい帯からはみ出さずに点線を全部かくす',180,y+36);}
  if(G&&G.phase==='ready'){const p=heart().pts[0];cx.fillStyle='rgba(184,20,15,.85)';cx.font='900 11px '+BODYF();cx.textAlign='center';cx.fillText('どこから描いてもOK',p.x,p.y-20);}

function loop(now){requestAnimationFrame(loop);if(G)step(now);render(now);}
requestAnimationFrame(loop);

/* ---------- result ---------- */
function cropBox(){const l=L();return {y0:Math.max(0,l.cy-150),y1:Math.min(H,l.cy+150)};}
function takeSnap(){
  try{render(performance.now());}catch(e){}
  try{const {y0,y1}=cropBox(),r=SC*DPR;const c=document.createElement('canvas');c.width=cv.width;c.height=Math.round((y1-y0)*r);
    c.getContext('2d').drawImage(cv,0,Math.round(y0*r),cv.width,c.height,0,0,c.width,c.height);G.snap=c;}catch(e){}
}
function failed(){return false;}
function score(){return Math.max(0,Math.round((100-G.res.devS)*10)/10);}
function pct(){return score().toFixed(1);}
function statusLine(r=G.res){
  if(r.devS===0)return '点線ぜんぶかくれて、はみ出しなし';
  return 'すき間'+r.unc.toFixed(1)+'%・はみ出し'+r.ovf.toFixed(1)+'%・ずれ'+r.cen.toFixed(1)+'%';
}
function titleOf(){
  const r=G.res;
  if(r.devS===0)return 'オムライス屋さんのハート';
  if(r.devS<1)return 'ほぼお店のハート';
  const gap=r.unc>=r.ovf;
  if(r.devS<10)return gap?'ちょっとかすれたハート':'ちょっとぶにゅっとしたハート';
  if(r.devS<40)return gap?'かすれハート':'ぶにゅっとハート';
  return gap?'描きかけのハート':'ケチャップの事故';
}
function lineOf(r){
  if(r.devS===0)return 'ぴったり';
  const parts=[];if(r.unc>=.05)parts.push('点線が'+r.unc.toFixed(1)+'%見えている');if(r.ovf>=.05)parts.push('帯から'+r.ovf.toFixed(1)+'%はみ出し');if(r.cen>=.05)parts.push('線のずれ'+r.cen.toFixed(1)+'%');
  return parts.join('、')||'ほんの少しずれた';
}
function feedback(){return '描いたハート：'+lineOf(G.res);}
function shareText(){
  return `オムライスのケチャップをはみ出さずにハートに描け　ハート度${pct()}%（${statusLine()}）【${titleOf()}】\n${SHARE_URL}`;
}
async function showResult(){
  const r=G.res;
  $('rScore').innerHTML=`ハート度<b>${pct()}<small>%</small></b>`;
  $('rCount').textContent=statusLine();
  $('rTitle').textContent='【'+titleOf()+'】';
  const lines=[feedback()];
  if(PREV)lines.push('前の回：'+lineOf(PREV));
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=r;
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'ketchup-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='ketchup-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});


async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',Df='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  x.fillStyle='#f7f6f2';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('ハート度',w/2,32);
  const fl=failed(),n=fl?'撮れない':pct(),u=fl?'':'%';let fs=fl?64:96;x.font=`400 ${fs}px ${Df}`;let tw=x.measureText(n).width;

  x.font=`400 ${Math.round(fs*.45)}px ${Df}`;const pw=u?x.measureText(u).width+4:0;
  const sx=(w-(tw+pw))/2;x.textAlign='left';x.fillStyle='#c8402c';x.font=`400 ${fs}px ${Df}`;x.fillText(n,sx,124);
  if(u){x.font=`400 ${Math.round(fs*.45)}px ${Df}`;x.fillText(u,sx+tw+4,124);}
  x.textAlign='center';x.fillStyle='#24262b';let ss=17;x.font=`900 ${ss}px ${F}`;while(x.measureText(statusLine()).width>w-20&&ss>11){ss-=.5;x.font=`900 ${ss}px ${F}`;}x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#f8c64a';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(feedback()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(feedback(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}


/* ---------- start ---------- */

$('startBtn').addEventListener('click',()=>{ac();begin();});
