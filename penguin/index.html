<!doctype html>
<html lang="ja">
<head>

<style>
/* Through a phone camera: penguins waddle straight at you. Tap the shutter the moment the front one fits the frame. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2a27}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#9fd27a;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#e4f4ff,#cfe9d0)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,7.6vw,38px);line-height:1.45;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9ccd2}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="しゃがんだ飼育員のスマホのカメラ越しに、芝生の上をこちらへ寄ってくるペンギンの群れの画面"></canvas>

  <div id="title" class="panel">
    <h1>大好きで<br>寄ってくるペンギンを、<br>全員1枚に収めろ。</h1>
    <p style="margin:0 0 14px;font-weight:900;font-size:14px;line-height:1.6">あなたは飼育員。しゃがんでスマホを向けたら、<br>みんな寄ってきた。</p>
    <p style="margin:0 0 14px;font-size:13px;line-height:1.6">枠からはみ出さない、ぎりぎりの大きさで撮る。<br><b>いちばん外のペンギンが枠の線に触れた瞬間が100%</b>。<br>内側の子は枠に触れなくていい。</p>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">登場するものはすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>ペンギン写真の結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、撮れた写真">
      <p class="fine">登場するものはすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='大好きで寄ってくるペンギンを、全員1枚に収めろ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://kzaaa00.github.io/penguin/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const V=320;       /* the front penguin's usual walking speed, mm per second (it changes its mind: see makePlan) */
const D0=1500;     /* it starts 1.5 m away */
const BEST=400;    /* at 40 cm it fills the frame exactly */
const OKMM=.05;
const OKP=.0125;    /* within 0.0125% of just-fitting counts as exactly right (100.0%) */
const PECK=150;    /* closer than 15 cm and it pecks the lens instead */
const END=60;      /* nobody waits forever: at 6 cm it pecks anyway */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('penguin-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  shutter(){noise(.05,.25,3000,0,'highpass');noise(.06,.2,1800,.07,'bandpass',2);},
  step(){noise(.03,.03,700,0,'bandpass',4);},
  peck(){tone(900,.05,'square',.06,0,500);tone(900,.05,'square',.06,.12,500);noise(.05,.12,2500,0,'bandpass',3);noise(.05,.12,2500,.12,'bandpass',3);},
  coo(){tone(620,.12,'triangle',.05,0,880);tone(700,.1,'triangle',.04,.15,520);},
  hey(){tone(760,.07,'triangle',.05,0,1100);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('penguin-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1;
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
/* CY: the centre of the frame. FH: its height. A penguin d mm away is K/d px tall: exactly FH*.92 at BEST. */
const FW=300,FH=200,K=FH*.96/.92*BEST; /* the drawn penguin is .92 h tall, so at BEST it fills 96% of the frame */
function L(){const CY=Math.round(Math.max(210,Math.min(H-250,H*.42)));return {CY,hz:CY-30,SH:Math.min(H-62,CY+FH/2+120)};}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null;
function newGame(seed){ROUND++;if(seed==null)seed=Math.random()*1e9|0;const F=formation(seed);
  G={phase:'walk',t0:performance.now()+500,res:null,shown:false,plan:undefined,snap:null,snapped:false,round:ROUND,ts:0,lastStep:0,F};
  G.Dstar=dAtFill(1);G.segs=makePlan(seed,G.Dstar);}
/* the flock: the leader in the middle, the others around it, a bit further back. Different every round. */
function formation(seed){const R=rng(seed*7+3);const n=5+(R()<.5?1:0);const F=[{ox:0,dz:0}];
  const side=R()<.5?1:-1;const slots=[[-1,0],[1,0],[-.55,1],[.55,1],[0,2]];
  for(let i=1;i<n;i++){const [sx,row]=slots[i-1];F.push({ox:sx*side*(100+R()*70)+(R()-.5)*20,dz:30+row*60+R()*90});}
  return F;}
/* boxes of every penguin when the leader is D mm away (screen px) */
function boxes(D,F){const {CY}=L();const hl=K/Math.max(30,D);return F.map((f,i)=>{const d=Math.max(30,D+f.dz);const h=K/d,w=h*.62;
  const X=180+f.ox*h/230;const Y=CY+hl*.46-(hl-h)*.3;return {i,d,h,w,X,Y,l:X-w*.56,r:X+w*.56,t:Y-h*.97,b:Y};});}
/* how full the frame is: 1 = the first penguin just touches the frame edge */
function fillAt(D,F){F=F||G.F;const {CY}=L();let f=0;for(const q of boxes(D,F))f=Math.max(f,(180-q.l)/(FW/2),(q.r-180)/(FW/2),(CY-q.t)/(FH/2),(q.b-CY)/(FH/2));return f;}
function dAtFill(f){let lo=40,hi=D0*2;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(fillAt(m)>f)lo=m;else hi=m;}return (lo+hi)/2;}
/* every round the front penguin walks its own way: it stops to look around (?), suddenly hurries (!),
   or gets bumped forward by the one behind (!). It never stands still right at the frame size. */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makePlan(seed,Ds){Ds=Ds||BEST;
  const R=rng(seed);let t=0,d=D0,last='',first=true;const S=[];
  const push=(dur,dd,kind,extra)=>{S.push(Object.assign({t0:t,t1:t+dur,d0:d,d1:d-dd,kind},extra||{}));t+=dur;d-=dd;};
  const still=()=>d>Ds*1.15+80;
  while(d>END){
    const v=V*(.75+R()*.5);const dist=first?260+R()*200:120+R()*220;first=false;
    push(dist/v*1000,dist,'walk');if(d<=END)break;
    const r=R();
    if(r<.4&&still()&&last!=='look'){push(500+R()*700,0,'look');last='look';}
    else if(r<.75&&last!=='hurry'){const dd=Math.min(d-END+10,140+R()*160);push(dd/(V*2.3)*1000,dd,'hurry');last='hurry';}
    else if(still()&&d>Ds*1.15+80){push(450+R()*350,0,'look',{bump:1});push(140,75,'push');last='push';}
  }
  return S;
}
function segAt(rel){const S=G.segs;for(const g of S)if(rel<g.t1)return g;return null;}
/* distance of the front penguin at time t (ms) */
function distAt(t){if(!G)return D0;const rel=t-G.t0;if(rel<=0)return D0;const g=segAt(rel);
  if(!g){const z=G.segs[G.segs.length-1];return z.d1-V*(rel-z.t1)/1000;}
  return g.d0+(g.d1-g.d0)*(rel-g.t0)/(g.t1-g.t0);}
/* first moment (ms, page clock) the front penguin is at distance d */
function timeAt(d){for(const g of G.segs)if(g.d0>=d&&g.d1<d&&g.d1<g.d0)return G.t0+g.t0+(g.d0-d)/(g.d0-g.d1)*(g.t1-g.t0);
  const z=G.segs[G.segs.length-1];return G.t0+z.t1+(z.d1-d)/V*1000;}

/* ---------- input: one tap = the shutter ---------- */
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='walk')return;e.preventDefault();ac();if(tsOf(e)<G.t0)return;shoot(tsOf(e));});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&G.phase==='walk'&&$('result').hidden&&$('title').hidden){e.preventDefault();ac();shoot(tsOf(e));}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function shoot(ts,auto){
  if(!G||G.phase!=='walk')return;
  const d=distAt(ts);const fill=fillT(ts);const pct=(fill-1)*100;
  const pecked=d<PECK;
  G.res={d,fill,pct,err:-pct,pecked,dev:devOf(pct),auto:!!auto};G.phase='shot';G.ts=ts;G.dShot=d;
  if(pecked){SFX.peck();anim($('app'),'shake');}else{SFX.shutter();}
  if(!pecked&&Math.abs(pct)<2)setTimeout(()=>SFX.coo(),500);
  G.endIn=pecked?1900:1700;
}
function devOf(p){const a=Math.abs(p);if(a<=OKP)return 0;return Math.max(.1,Math.ceil(a*10-1e-9)/10);}
function step(now){
  if(G.phase==='walk'){
    if(G.plan!==undefined&&G.plan!==null){const at=G.plan==='peck'?timeAt(120):(G.planAt||(G.planAt=timeAtFill(1+G.plan/100)));if(now>=at)shoot(at);}
    if(G.phase==='walk'&&distAt(now)<=END)shoot(timeAt(END),true);
    if(G.phase==='walk'&&now>G.t0){const g=segAt(now-G.t0);const k=g?g.kind:'walk';const gap=k==='hurry'?120:k==='push'?60:300;if(k!=='look'&&now-G.lastStep>gap){G.lastStep=now;SFX.step();}if(g&&g!==G.lastSeg){G.lastSeg=g;if(k==='hurry'||k==='push')SFX.hey();}}
  }
  if(G.phase==='shot'){
    const a=(now-G.ts)/1000;
    if(!G.snapped&&a>=.2){G.snapped=true;takeSnap();}
    if(a*1000>=G.endIn&&!G.shown){G.shown=true;showResult();}
  }
}

/* ---------- drawing ---------- */
function drawField(x){
  const {hz}=L();
  let g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#8cc8ef');g.addColorStop(1,'#d8eef7');x.fillStyle=g;x.fillRect(0,0,W,hz);
  /* far trees and a fence */
  x.fillStyle='#7fae6a';for(let i=0;i<9;i++){x.beginPath();x.arc(i*46-10,hz-6,26+rnd(i)*12,Math.PI,0);x.fill();}
  x.fillStyle='#f4efe4';x.fillRect(0,hz-10,W,4);for(let i=0;i<20;i++)x.fillRect(i*20,hz-18,3,14);
  g=x.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#a9d98a');g.addColorStop(1,'#6fae4e');x.fillStyle=g;x.fillRect(0,hz,W,H-hz);
  x.strokeStyle='rgba(60,110,40,.25)';x.lineWidth=1;for(let i=0;i<60;i++){const px=rnd(i+3)*W,py=hz+Math.pow(rnd(i+7),.7)*(H-hz);x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py-5);x.moveTo(px,py);x.lineTo(px+2,py-5);x.stroke();}
}
/* one penguin, h px tall, feet at (X, Y) */
function tiltOf(ph,mode,ma){return mode==='look'?Math.sin(ma*4.2)*.2:Math.sin(ph)*(mode==='hurry'?.13:.08);}
function flipOf(ph,mode,ma){return mode==='hurry'||mode==='push'?.95+Math.sin(ma*38)*.4:.35+Math.sin(ph*2)*.12;}
/* the exact outline box of a drawn penguin (body, flippers, feet; not the shadow), from the same numbers penguin() draws with */
function pbox(q){const {X,Y,h,ph,mode,ma}=q;const w=h*.62,r0=tiltOf(ph,mode,ma),fl=flipOf(ph,mode,ma);
  let l=1e9,r=-1e9,t=1e9,b=-1e9;
  const ell=(cx,cy,a,bb,th)=>{const c=Math.cos(r0),s=Math.sin(r0);const X1=X+cx*c-cy*s,Y1=Y+cx*s+cy*c,T=th+r0;
    const hw=Math.sqrt(a*a*Math.cos(T)**2+bb*bb*Math.sin(T)**2),hh=Math.sqrt(a*a*Math.sin(T)**2+bb*bb*Math.cos(T)**2);
    l=Math.min(l,X1-hw);r=Math.max(r,X1+hw);t=Math.min(t,Y1-hh);b=Math.max(b,Y1+hh);};
  ell(0,-h*.46,w*.5,h*.46,0);
  for(const sg of [-1,1]){const a=-sg*fl;ell(sg*w*.46-Math.sin(a)*h*.14,-h*.55+Math.cos(a)*h*.14,w*.1,h*.2,a);}
  ell(-w*.2,-h*.02+Math.max(0,Math.sin(ph))*-h*.02,w*.17,h*.04,0);ell(w*.2,-h*.02+Math.max(0,-Math.sin(ph))*-h*.02,w*.17,h*.04,0);
  return {l,r,t,b};}
function penguin(x,X,Y,h,ph,peck,mode,ma){
  const w=h*.62;x.save();x.translate(X,Y);x.rotate(tiltOf(ph,mode,ma));
  x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(0,0,w*.45,h*.02,0,0,Math.PI*2);x.fill();
  /* feet */

/* the flock: the front one walks at the middle; three more behind it */
const FLOCK=[[0,0],[-80,260],[95,480],[-25,720]];
function poseAt(t){

/* every penguin as it is drawn when the leader is d0 away at page time t (tw: seconds since the round began) */

  const walked=(D0-d0)/320*7;
  return boxes(d0,F).sort((a,b)=>b.d-a.d).map(p=>{const lead=p.i===0;
    return Object.assign(p,{lead,ph:(lead?walked:walked+tw*2)+p.i*1.7,mode:lead?P.mode:(P.mode==='look'&&!(p.i===1&&P.off<-20)?'look':'walk'),ma:P.ma+p.i*.4});});}
/* how full the frame is, measured on the drawn penguins: 1 = the first one just touches the frame line */
function fillOf(list){const {CY}=L();let f=0;for(const q of list){const b=pbox(q);f=Math.max(f,(180-b.l)/(FW/2),(b.r-180)/(FW/2),(CY-b.t)/(FH/2),(b.b-CY)/(FH/2));}return f;}
function fillT(t){return fillOf(flockAt(distAt(t),t,poseAt(t)));}
/* first moment the drawn flock reaches fill f (scripted shots) */
function timeAtFill(f){const t1=timeAt(END);let a=G.t0;for(let t=G.t0;t<=t1;t+=4){if(fillT(t)>=f){let lo=t-4,hi=t;for(let k=0;k<40;k++){const m=(lo+hi)/2;if(fillT(m)>=f)hi=m;else lo=m;}return hi;}}return t1;}
function drawFlock(x,d0,tw,now){
  const P=G&&G.phase==='walk'?poseAt(now):G&&G.phase==='shot'?poseAt(G.ts):{mode:'walk',ma:0,off:0,mark:''};
  const tt=G?(G.phase==='shot'?G.ts:now):now;let top=null;

    penguin(x,X,Y,h,p.ph,p.lead&&G&&G.res&&G.res.pecked,p.mode,p.ma);
    if(p.lead)top={X,Y:Y-h*.98,h};}
  if(top&&P.mark&&!(G&&G.phase==='shot')){const fs=clamp(top.h*.2,16,44);x.save();x.font='900 '+fs+'px '+BODYF();x.textAlign='center';x.textBaseline='bottom';

function scene(x,now,d){

function render(now){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);

/* ---------- result ---------- */
function cropBox(){const {CY}=L();return {y0:Math.max(0,CY-FH/2-40),y1:Math.min(H,CY+FH/2+40)};}

function lineOf(r){

async function showResult(){
  const r=G.res;

const TOUCH=matchMedia('(pointer:coarse)').matches;

/* The share image: the result on top, the photo you took in the middle, the distance line, and a band with the game name and the creator. */
async function drawCard(){
