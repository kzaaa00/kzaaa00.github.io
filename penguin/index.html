<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寄ってくるペンギンを、枠ぴったりで撮れ。</title>
<meta name="description" content="どんどん寄ってくるペンギンを、カメラの枠にぴったり収まる瞬間に撮る。近すぎるとくちばしでつつかれる。登場するものはすべて架空です。">
<meta property="og:type" content="website">
<meta property="og:title" content="寄ってくるペンギンを、枠ぴったりで撮れ。">
<meta property="og:description" content="枠にぴったり収まる瞬間に撮る。">
<meta property="og:url" content="https://kzaaa00.github.io/penguin/">
<meta property="og:image" content="https://kzaaa00.github.io/penguin/play.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Through a phone camera: penguins waddle straight at you. Tap the shutter the moment the front one fits the frame. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2a27}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#9fd27a;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#e4f4ff,#cfe9d0)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,7.6vw,38px);line-height:1.45;margin:0 0 30px;text-wrap:balance}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9ccd2}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}
#rScore b small{font-size:30px;margin-left:2px}
#rCount{font-size:15px;font-weight:900;margin:0;line-height:1.4}
#rTitle{font-size:16px;font-weight:900;color:var(--red-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#app.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="スマホのカメラ越しに、芝生の上をこちらへ歩いてくるペンギンたちの画面"></canvas>

  <div id="title" class="panel">
    <h1>寄ってくる<br>ペンギンを、<br>枠ぴったりで撮れ。</h1>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">登場するものはすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>ペンギン写真の結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、撮れた写真">
      <p class="fine">登場するものはすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='寄ってくるペンギンを、枠ぴったりで撮れ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://kzaaa00.github.io/penguin/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const V=320;       /* the front penguin walks at you at 320 mm per second, always */
const D0=1500;     /* it starts 1.5 m away */
const BEST=400;    /* at 40 cm it fills the frame exactly */
const OKMM=.05;    /* within 0.05 mm of that counts as exactly right (100.0%) */
const PECK=150;    /* closer than 15 cm and it pecks the lens instead */
const END=60;      /* nobody waits forever: at 6 cm it pecks anyway */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('penguin-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  shutter(){noise(.05,.25,3000,0,'highpass');noise(.06,.2,1800,.07,'bandpass',2);},
  step(){noise(.03,.03,700,0,'bandpass',4);},
  peck(){tone(900,.05,'square',.06,0,500);tone(900,.05,'square',.06,.12,500);noise(.05,.12,2500,0,'bandpass',3);noise(.05,.12,2500,.12,'bandpass',3);},
  coo(){tone(620,.12,'triangle',.05,0,880);tone(700,.1,'triangle',.04,.15,520);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('penguin-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1;
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',resize);try{visualViewport.addEventListener('resize',resize);}catch(e){}
resize();
/* CY: the centre of the frame. FH: its height. A penguin d mm away is K/d px tall: exactly FH*.92 at BEST. */
const FW=210,FH=250,K=FH*.96/.92*BEST; /* the drawn penguin is .92 h tall, so at BEST it fills 96% of the frame */
function L(){const CY=Math.round(Math.max(210,Math.min(H-250,H*.42)));return {CY,hz:CY-30,SH:Math.min(H-62,CY+FH/2+120)};}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null;
function newGame(){ROUND++;G={phase:'walk',t0:performance.now()+500,res:null,shown:false,plan:undefined,snap:null,snapped:false,round:ROUND,ts:0,lastStep:0};}
/* distance of the front penguin at time t (ms) */
function distAt(t){if(!G)return D0;return D0-V*Math.max(0,t-G.t0)/1000;}

/* ---------- input: one tap = the shutter ---------- */
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='walk')return;e.preventDefault();ac();if(tsOf(e)<G.t0)return;shoot(tsOf(e));});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&G.phase==='walk'&&$('result').hidden&&$('title').hidden){e.preventDefault();ac();shoot(tsOf(e));}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function shoot(ts,auto){
  if(!G||G.phase!=='walk')return;
  const d=distAt(ts);const err=d-BEST;const pct=err/BEST*100;
  const pecked=d<PECK;
  G.res={d,err,pct,pecked,dev:devOf(err),auto:!!auto};G.phase='shot';G.ts=ts;G.dShot=d;
  if(pecked){SFX.peck();anim($('app'),'shake');}else{SFX.shutter();}
  if(!pecked&&Math.abs(err)<8)setTimeout(()=>SFX.coo(),500);
  G.endIn=pecked?1900:1700;
}
function devOf(err){const a=Math.abs(err);if(a<=OKMM)return 0;return Math.max(.1,Math.ceil(a/BEST*1000-1e-9)/10);}
function step(now){
  if(G.phase==='walk'){
    if(G.plan!==undefined&&G.plan!==null){const at=G.t0+(D0-BEST*(1+G.plan/100))/V*1000;if(now>=at)shoot(at);}
    if(G.phase==='walk'&&distAt(now)<=END)shoot(G.t0+(D0-END)/V*1000,true);
    if(G.phase==='walk'&&now>G.t0&&now-G.lastStep>300){G.lastStep=now;SFX.step();}
  }
  if(G.phase==='shot'){
    const a=(now-G.ts)/1000;
    if(!G.snapped&&a>=.2){G.snapped=true;takeSnap();}
    if(a*1000>=G.endIn&&!G.shown){G.shown=true;showResult();}
  }
}

/* ---------- drawing ---------- */
function drawField(x){
  const {hz}=L();
  let g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#8cc8ef');g.addColorStop(1,'#d8eef7');x.fillStyle=g;x.fillRect(0,0,W,hz);
  /* far trees and a fence */
  x.fillStyle='#7fae6a';for(let i=0;i<9;i++){x.beginPath();x.arc(i*46-10,hz-6,26+rnd(i)*12,Math.PI,0);x.fill();}
  x.fillStyle='#f4efe4';x.fillRect(0,hz-10,W,4);for(let i=0;i<20;i++)x.fillRect(i*20,hz-18,3,14);
  g=x.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#a9d98a');g.addColorStop(1,'#6fae4e');x.fillStyle=g;x.fillRect(0,hz,W,H-hz);
  x.strokeStyle='rgba(60,110,40,.25)';x.lineWidth=1;for(let i=0;i<60;i++){const px=rnd(i+3)*W,py=hz+Math.pow(rnd(i+7),.7)*(H-hz);x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py-5);x.moveTo(px,py);x.lineTo(px+2,py-5);x.stroke();}
}
/* one penguin, h px tall, feet at (X, Y) */
function penguin(x,X,Y,h,ph,peck){
  const w=h*.62;x.save();x.translate(X,Y);x.rotate(Math.sin(ph)*.08);
  x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(0,0,w*.55,h*.06,0,0,Math.PI*2);x.fill();
  /* feet */
  x.fillStyle='#f0a23a';x.beginPath();x.ellipse(-w*.2,-h*.02+Math.max(0,Math.sin(ph))*-h*.02,w*.17,h*.04,0,0,Math.PI*2);x.ellipse(w*.2,-h*.02+Math.max(0,-Math.sin(ph))*-h*.02,w*.17,h*.04,0,0,Math.PI*2);x.fill();
  /* body */
  x.fillStyle='#22262e';x.beginPath();x.ellipse(0,-h*.46,w*.5,h*.46,0,0,Math.PI*2);x.fill();
  /* flippers */
  x.save();x.translate(-w*.46,-h*.55);x.rotate(.35+Math.sin(ph*2)*.12);x.beginPath();x.ellipse(0,h*.14,w*.1,h*.2,0,0,Math.PI*2);x.fill();x.restore();
  x.save();x.translate(w*.46,-h*.55);x.rotate(-.35-Math.sin(ph*2)*.12);x.beginPath();x.ellipse(0,h*.14,w*.1,h*.2,0,0,Math.PI*2);x.fill();x.restore();
  /* belly and face */
  x.fillStyle='#fbfbf7';x.beginPath();x.ellipse(0,-h*.38,w*.36,h*.36,0,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(-w*.16,-h*.78,w*.17,h*.1,0,0,Math.PI*2);x.ellipse(w*.16,-h*.78,w*.17,h*.1,0,0,Math.PI*2);x.fill();
  x.fillStyle='#22262e';x.beginPath();x.arc(-w*.15,-h*.79,h*.028,0,Math.PI*2);x.arc(w*.15,-h*.79,h*.028,0,Math.PI*2);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(-w*.14,-h*.8,h*.01,0,Math.PI*2);x.arc(w*.16,-h*.8,h*.01,0,Math.PI*2);x.fill();
  /* beak (opens when it pecks) */
  const o=peck?h*.03:0;x.fillStyle='#f0a23a';x.beginPath();x.moveTo(-w*.09,-h*.73);x.lineTo(w*.09,-h*.73);x.lineTo(0,-h*.66+o);x.closePath();x.fill();
  x.fillStyle='rgba(255,150,170,.45)';x.beginPath();x.ellipse(-w*.26,-h*.7,w*.07,h*.025,0,0,Math.PI*2);x.ellipse(w*.26,-h*.7,w*.07,h*.025,0,0,Math.PI*2);x.fill();
  x.restore();
}
/* the flock: the front one walks at the middle; three more behind it */
const FLOCK=[[0,0],[-80,260],[95,480],[-25,720]];
function drawFlock(x,d0,tw){
  const {CY}=L();const list=FLOCK.map(([ox,dd],i)=>({ox,d:d0+dd,i})).sort((a,b)=>b.d-a.d);
  for(const p of list){const d=Math.max(30,p.d);const h=K/d;const X=180+p.ox*(K/d)/230;const Y=CY+h*.46+(p.i?-(1-BEST/d)*30:0);
    penguin(x,X,Y,h,tw*7+p.i*1.7,p.i===0&&G&&G.res&&G.res.pecked);}
}
function drawUI(x,phase){
  const {CY,SH}=L();
  /* frame brackets */
  const x0=180-FW/2,x1=180+FW/2,y0=CY-FH/2,y1=CY+FH/2,b=24;
  x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=3.5;x.lineCap='round';
  for(const [px,py,sx,sy] of [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]){x.beginPath();x.moveTo(px,py+sy*b);x.lineTo(px,py);x.lineTo(px+sx*b,py);x.stroke();}
  x.font='900 12px '+BODYF();x.textAlign='center';x.textBaseline='bottom';x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.35)';x.strokeText('この枠にぴったり',180,y0-6);x.fillStyle='#fff';x.fillText('この枠にぴったり',180,y0-6);
  /* phone camera bar and shutter */
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,SH-40,W,H-SH+40);
  x.fillStyle='#fff';x.beginPath();x.arc(180,SH+8,27,0,Math.PI*2);x.fill();
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;x.beginPath();x.arc(180,SH+8,21,0,Math.PI*2);x.stroke();
  x.fillStyle='rgba(255,255,255,.35)';rr(x,52,SH-6,30,30,6);x.fill();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.arc(292,SH+8,14,0,Math.PI*2);x.stroke();
}
function pill(label,lx,ly){cx.save();cx.font='900 15px '+BODYF();cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(label).width+22;cx.fillStyle='rgba(36,38,43,.86)';rr(cx,lx-w/2,ly-15,w,30,15);cx.fill();cx.fillStyle='#fff';cx.fillText(label,lx,ly+1);cx.restore();}

function scene(x,now,d){
  drawField(x);
  const tw=G?Math.max(0,(G.phase==='walk'?now:G.ts)-G.t0)/1000:0;
  drawFlock(x,d,tw);
}
function render(now){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  const d=G?(G.phase==='walk'?distAt(now):G.dShot):D0;
  if(G&&G.phase==='shot'&&G.res.pecked){
    /* it keeps coming and pecks the lens */
    const a=(now-G.ts)/1000;const dd=Math.max(175,G.dShot-a*200);cx.save();cx.translate(Math.sin(a*60)*3*(a<.5),0);scene(cx,now,dd);cx.restore();
    if(a>.15){cx.fillStyle='rgba(255,255,255,.18)';cx.fillRect(0,0,W,H);}
  }else{scene(cx,now,d);}
  drawUI(cx,G?G.phase:'');
  if(G&&G.phase==='shot'&&!G.res.pecked){const a=(now-G.ts)/1000;if(a<.25){cx.fillStyle=`rgba(255,255,255,${1-a/.25})`;cx.fillRect(0,0,W,H);}}
  if(G&&G.phase==='walk'&&G.round===1&&G.plan===undefined){const {CY}=L();pill('枠ぴったりの瞬間にタップ',180,CY+FH/2+36);}
}
function loop(now){requestAnimationFrame(loop);if(G)step(now);render(now);}
requestAnimationFrame(loop);
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- result ---------- */
function cropBox(){const {CY}=L();return {y0:Math.max(0,CY-FH/2-40),y1:Math.min(H,CY+FH/2+40)};}
function takeSnap(){
  try{render(performance.now());}catch(e){}
  try{const {y0,y1}=cropBox(),r=SC*DPR;const c=document.createElement('canvas');c.width=cv.width;c.height=Math.round((y1-y0)*r);
    c.getContext('2d').drawImage(cv,0,Math.round(y0*r),cv.width,c.height,0,0,c.width,c.height);G.snap=c;}catch(e){}
}
function failed(r=G.res){return r.pecked;}
function score(){const r=G.res;if(failed(r))return 0;return Math.max(0,Math.round((100-r.dev)*10)/10);}
function pct(){return score().toFixed(1);}
function cmOf(r){return (Math.abs(r.err)/10).toFixed(1);}
function statusLine(r=G.res){
  if(r.pecked)return 'くちばしでレンズをつつかれた';
  if(r.dev===0)return '枠ぴったり';
  return r.err>0?r.dev.toFixed(1)+'%遠い（'+cmOf(r)+'cm早い）':r.dev.toFixed(1)+'%近い（'+cmOf(r)+'cm遅い）';
}
function titleOf(){
  const r=G.res;
  if(r.pecked)return 'くちばしに撮られた人';
  if(r.dev===0)return 'ペンギンの専属カメラマン';
  if(r.dev<1)return 'ほぼ専属カメラマン';
  if(r.err>0){if(r.dev<5)return 'ちょっとせっかちな人';if(r.dev<40)return '遠慮がちな人';return '豆粒ペンギンの人';}
  if(r.dev<5)return 'ちょっと待ちすぎた人';return 'ドアップの人';
}
function lineOf(r){
  if(r.pecked)return 'ちょうどより'+Math.ceil(Math.abs(r.pct)*10)/10+'%近い（つつかれた）';
  if(r.dev===0)return 'ちょうど枠ぴったり';
  return 'ちょうどより'+r.dev.toFixed(1)+'%'+(r.err>0?'遠い（'+cmOf(r)+'cm早い）':'近い（'+cmOf(r)+'cm遅い）');
}
function feedback(){return '距離：'+lineOf(G.res);}
function shareText(){
  return `寄ってくるペンギンを、枠ぴったりで撮れ　${failed()?'つつかれた':'ぴったり度'+pct()+'%'}（${statusLine()}）【${titleOf()}】\n${SHARE_URL}`;
}

async function showResult(){
  const r=G.res;
  $('rScore').innerHTML=failed(r)?`ぴったり度<b>つつかれた</b>`:`ぴったり度<b>${pct()}<small>%</small></b>`;
  $('rCount').textContent=statusLine();
  $('rTitle').textContent='【'+titleOf()+'】';
  const lines=[feedback()];
  if(PREV)lines.push('前の回：'+lineOf(PREV));
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=r;
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'penguin-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='penguin-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});

/* The share image: the result on top, the photo you took in the middle, the distance line, and a band with the game name and the creator. */
async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',Df='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  x.fillStyle='#f7f6f2';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('ぴったり度',w/2,32);
  const fl=failed(),n=fl?'つつかれた':pct(),u=fl?'':'%';let fs=fl?64:96;x.font=`400 ${fs}px ${Df}`;let tw=x.measureText(n).width;
  while(tw*1.3>w-30&&fs>40){fs-=4;x.font=`400 ${fs}px ${Df}`;tw=x.measureText(n).width;}
  x.font=`400 ${Math.round(fs*.45)}px ${Df}`;const pw=u?x.measureText(u).width+4:0;
  const sx=(w-(tw+pw))/2;x.textAlign='left';x.fillStyle='#c8402c';x.font=`400 ${fs}px ${Df}`;x.fillText(n,sx,124);
  if(u){x.font=`400 ${Math.round(fs*.45)}px ${Df}`;x.fillText(u,sx+tw+4,124);}
  x.textAlign='center';x.fillStyle='#24262b';let ss=17;x.font=`900 ${ss}px ${F}`;while(x.measureText(statusLine()).width>w-20&&ss>11){ss-=.5;x.font=`900 ${ss}px ${F}`;}x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#a9d98a';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(feedback()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(feedback(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
function begin(){PID=null;newGame();resize();$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
let PID=null;
$('startBtn').addEventListener('click',()=>{ac();begin();});
/* for checks and recording: play(p) taps when the front penguin is p % farther (+) or nearer (-) than exactly right; null = never */
function play(p){begin();G.plan=p;}
window.__penguin={get G(){return G;},begin,play,shoot,shareText,showResult,score,L,distAt,V,D0,BEST,OKMM};
</script>
