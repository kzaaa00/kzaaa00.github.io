<style>
/* Three reels (when / who / what happened) spin; each stop fixes one part, and the three parts read as one post.
   The made-up "predicted likes" then count up from zero. */
:root{
  --ink:#1d2430; --muted:#6c7480; --paper:#f4f2ee; --pink:#e5336b; --pink-d:#a81c47; --gold:#ffd23f; --navy:#1d2430;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1d2430}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--paper);touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#go{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:20}
#me{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-decoration:underline;z-index:20}
#go[hidden]{display:none}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.panel[hidden]{display:none}
#title{background:linear-gradient(#f7f5f1,#e6e2da)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,10vw,44px);line-height:1.3;margin:0 0 30px}
.btn{border:0;border-radius:14px;background:var(--pink);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(calc(100vw - 40px),300px);box-shadow:0 5px 0 var(--pink-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
#go.btn:active{transform:translate(-50%,3px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfc9bf}
.btn.x{background:#000;box-shadow:0 5px 0 #444}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .fine{margin-top:22px;font-size:11.5px;color:var(--muted)}

#result{background:#f4f2ee;justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rText{margin:0;font-size:20px;font-weight:900;line-height:1.5;background:#fff;border:1px solid #ddd8cf;border-radius:12px;padding:12px 14px}
#rLikes{margin:0;font-size:16px;font-weight:900;line-height:1.1}
#rLikes b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--pink);font-variant-numeric:tabular-nums;margin-top:4px}
#rTitle{font-size:17px;font-weight:900;color:var(--pink-d);margin:0}
#rSub{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.7}
#card{width:min(100%,260px);margin:0 auto;border-radius:10px;border:1px solid #ddd8cf;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0}
#result .cap[hidden]{display:none}
.btn:disabled{opacity:.5}
#result .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#result .btns .btn{width:100%}
#result .btns .btn[hidden],#result .btns .link[hidden]{display:none}
#result .link{background:none;border:0;color:var(--muted);font:700 13px var(--body);text-decoration:underline;padding:2px 8px;cursor:pointer}
#result .fine{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 10px}
.fine .me{color:inherit;font-weight:700;text-decoration:underline;margin-left:.5em;display:inline-block;padding:4px 0}
#title .fine .me{margin:6px 0 0}
#mute{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.15);color:var(--ink);border-radius:999px;font:700 11px var(--body);padding:4px 10px;cursor:pointer}
#mute[hidden]{display:none}
</style>

const parseReel=s=>s.trim().split('\n').map(l=>{const[t,g,p]=l.split('|');return{t,g:g||'',p:+p||0};});
const REELS=[parseReel(REEL_WHEN),parseReel(REEL_WHO),parseReel(REEL_DID)];
const THEME={w:'会社',l:'恋愛',f:'家族',s:'学校',n:'ネット',d:'開発',a:'動物',e:'食べもの'};
if(typeof module!=='undefined')module.exports={REELS,THEME};

/* posts link to the main page, which has the link card (本人 11/12: 画像ありに戻す). /omakase/p/ stays up so links already posted keep working. */
const SHARE_URL='https://kzaaa00.github.io/omakase/';
const LABELS=['いつ・どこで','だれが','どうした','おまけ'];
const AUTO_STOP=2.4;      /* a reel nobody stops stops by itself after this many seconds: it is "おまかせ" after all */
const SPEED=11;           /* words per second while spinning */

/* ---------- predicted likes ----------
   The same sentence always gets the same number (a hash of the text), so people can compare.
   Stronger words and words from the same theme push it up; only three of one theme with strong words reach a million.
   Rough odds (sim.js over every combination): 100万〜 about 1/640, 10万〜 1/69, 1万〜 1/10, 0〜9 1/19. */
const LK={base:-.5,perPunch:.55,two:1.0,three:2.4,gap:.4,noise:1.5};
function h32(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function match(ws){let best=1,th='';for(const c of Object.keys(THEME)){const k=ws.filter(w=>w.g.includes(c)).length;if(k>best){best=k;th=c;}}return {n:best,th};}
function sentenceOf(ws){return ws.map(w=>w.t).join('');}
/* About two games in five (本人案 11/11, 1/3から上げた 11/12) a bonus fourth reel appears after the third stops, and spins the endings
   people actually post with: 「〜したの草」「〜したのワロタ」… It does not change the predicted likes. */
const BONUS=.4;
/* #KAITO is listed twice so it comes up a little more often (本人 11/12「ちょっとだけ出やすく」) */
const ENDREEL=['の草','のワロタ','んだが？','件','の、じわる','ってマジ？',' #KAITO','の優勝','の、令和すぎる','の、意味わからん','の、親の顔より見た','のせいで眠れない','ので寝ます','って話する？','の、今年いちばん笑った','。続きはnoteで',' #KAITO'].map(t=>({t,g:'',p:0}));
const reelList=i=>i<3?REELS[i]:ENDREEL;
function postText(){return sentenceOf(G.ws)+(G.end||'');}
/* a tense scene (punch 2 in the first reel) with a spoken line in the last one is where the laughs usually are,
   so it gets a small push (本人 11/12「ちょっとだけ」). base was lowered so the top tiers stay about as rare as before. */
function gapBonus(ws){return ws[0].p===2&&ws[2].t.includes('「')?LK.gap:0;}
function likesOf(ws){
  const m=match(ws).n,p=ws.reduce((a,w)=>a+w.p,0),r=(h32(sentenceOf(ws))%10007)/10007;
  const L=LK.base+LK.perPunch*p+(m===2?LK.two:m===3?LK.three:0)+gapBonus(ws)+(r*2-1)*LK.noise;
  return Math.max(0,Math.floor(Math.pow(10,L)));
}
const TIERS=[[1e6,'伝説のバズ'],[1e5,'トレンド入り'],[1e4,'バズった'],[1e3,'ちょっと伸びた'],[100,'いつもの'],[10,'身内だけ見た'],[0,'誰にも見られてない']];
function tierOf(n){return TIERS.find(t=>n>=t[0])[1];}
function fmtLikes(n){
  if(n<1e4)return n.toLocaleString('ja-JP');
  if(n<1e5)return (Math.floor(n/1e3)/10).toFixed(1).replace(/\.0$/,'')+'万';
  return Math.floor(n/1e4)+'万';
}

let AC=null,muted=false;
try{muted=localStorage.getItem('omakase-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*.5;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  tick(){noise(.025,.05,2400,0,'highpass');},
  stop(){tone(150,.12,'triangle',.12,0,90);noise(.06,.18,900,0,'bandpass',2);},
  count(k){tone(520+k*700,.05,'triangle',.035);},
  bonus(){[392,523,659].forEach((f,i)=>tone(f,.1,'triangle',.05,i*.06));},
  land(){tone(196,.25,'sine',.09);tone(392,.18,'triangle',.04,.02);}
};

/* layout in logical units (360 wide) */
function L(){
  const top=Math.max(54,(H-640)*.35+54);
  const winH=50,gap=22,rx=16,rw=W-32;
  const reels=[0,1,2].map(i=>({x:rx,y:top+18+i*(winH+gap+4),w:rw,h:winH}));
  /* the bonus reel slides in under the third one and pushes the post down */
  const bk=G&&G.reels.length>3?Math.min(1,(G.t-G.bonusT)/.35):0,be=1-Math.pow(1-bk,3);
  if(G&&G.reels.length>3)reels.push({x:rx+40,y:reels[2].y+winH+22,w:rw-80,h:40,k:be});
  const postY=reels[2].y+winH+22+be*62;
  return {top,reels,winH,post:{x:rx,y:postY,w:rw,h:Math.max(150,Math.min(190,H-postY-170))}};
}

/* ---------- game state ---------- */
let G=null,played=false;
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function newReelState(i,old){
  const n=reelList(i).length;
  return {order:shuffled(n),pos:old?old.pos%n:Math.random()*n,state:'idle',from:0,to:0,t0:0,dur:0,pick:old?old.pick:null};
}
function initIdle(){G={phase:'idle',reels:[0,1,2].map(i=>{const r=newReelState(i);r.pick=REELS[i][r.order[Math.round(r.pos)%REELS[i].length]];return r;}),t:0,ws:null};G.reels.length=3;}
initIdle();

/* No title screen (本人 11/11): the reels are already spinning when the page opens, so the first second of a video
   (and of a visit from X) shows what this is. Until the first tap nothing stops by itself. */
function spin(attract){
  if(!attract)ac();
  G={phase:'spin',bonus:Math.random()<BONUS,reels:G.reels.slice(0,3).map((r,i)=>{const s=newReelState(i,r);s.state='spin';s.pick=null;return s;}),t:0,next:0,lastStop:0,ws:null,likes:0,shown:0};
  G.attract=!!attract;G.lastStop=G.t;$('go').hidden=false;$('go').textContent='止める';
}
const TAP_GAP=.4;   /* a tap this soon after a reel stopped by itself is ignored, so a tap that lands just as the auto-stop
                       fires does not stop the next reel too (本人 11/12「一気に二つめくれる」). Two quick taps still stop two reels. */
function stopNext(byTap){
  if(!G||G.phase!=='spin')return;
  if(byTap&&G.autoAt!=null&&G.t-G.autoAt<TAP_GAP)return;
  if(G.attract){G.attract=false;ac();}
  const i=G.reels.findIndex(r=>r.state==='spin');if(i<0)return;
  const r=G.reels[i];
  /* the reel slides one or two words past where it was tapped, so aiming is not really possible */
  const slip=1+(Math.random()<.5?1:0);
  r.state='stopping';r.from=r.pos;r.to=Math.ceil(r.pos)+slip;r.t0=G.t;r.dur=.42+slip*.12;
  G.lastStop=G.t;
  if(G.reels.every(q=>q.state!=='spin'))$('go').hidden=true;
}
function reelWord(i,k){const R=reelList(i),r=G.reels[i];return R[r.order[((Math.round(k)%R.length)+R.length)%R.length]];}

function allStopped(){
  G.ws=G.reels.slice(0,3).map(r=>r.pick);G.likes=likesOf(G.ws);G.end=G.reels[3]?G.reels[3].pick.t:'';
  G.phase='count';G.t0=G.t;
  const lg=Math.log10(G.likes+1);
  G.cdur=.6+lg*.28+(G.likes>=1e6?.8:0);   /* about 1.3 s for a usual number, 2.9 s for a million (本人「もうちょっと短く」) */
  G.lastTick=-1;
}

function step(dt){
  if(!G)return;G.t+=dt;
  if(G.phase==='spin'){
    for(const [i,r] of G.reels.entries()){
      if(r.state==='spin'){const before=Math.floor(r.pos);r.pos+=SPEED*dt;if(Math.floor(r.pos)!==before&&i===G.reels.findIndex(q=>q.state==='spin'))SFX.tick();}
      else if(r.state==='stopping'){
        const k=Math.min(1,(G.t-r.t0)/r.dur);
        /* ease out with a small bounce at the end */
        const e=1-Math.pow(1-k,3);const b=k<1?Math.sin(k*Math.PI)*.12*(1-k):0;
        r.pos=r.from+(r.to-r.from)*e+b;
        if(k>=1){r.pos=r.to;r.state='stopped';r.pick=reelWord(i,r.to);SFX.stop();try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}}
      }
    }
    if(G.reels.some(r=>r.state==='spin')&&G.reels.every(r=>r.state!=='stopping')&&!G.attract&&G.t-G.lastStop>AUTO_STOP){stopNext();G.autoAt=G.t;}
    if(G.reels.every(r=>r.state==='stopped')){
      if(G.bonus&&G.reels.length===3&&G.t-G.lastStop>.5){
        const r=newReelState(3);r.state='spin';G.reels.push(r);G.bonusT=G.t;G.lastStop=G.t;
        $('go').hidden=false;SFX.bonus();
      }else if(!G.bonus||G.reels.length>3)allStopped();
    }
  }else if(G.phase==='count'){
    const k=Math.min(1,(G.t-G.t0)/G.cdur);
    /* count up in log space, so the number passes through every tier on the way */
    const e=1-Math.pow(1-k,2.4);
    G.shown=k>=1?G.likes:Math.floor(Math.pow(10,Math.log10(G.likes+1)*e)-1);
    const tick=Math.floor((G.t-G.t0)/.07);if(tick!==G.lastTick&&k<1){G.lastTick=tick;SFX.count(e);}
    if(k>=1){G.phase='done';G.doneAt=G.t;SFX.land();
      /* hearts float up: none for small numbers, a few for a buzz, a lot for the legendary ones */
      const n=G.likes>=1e6?60:G.likes>=1e5?28:G.likes>=1e4?12:0;
      G.fx=[...Array(n)].map(()=>({x:Math.random()*W,y:H+Math.random()*H*.6,v:90+Math.random()*140,s:5+Math.random()*9,w:Math.random()*6}));}
  }else if(G.phase==='done'){
    if(G.fx)for(const f of G.fx){f.y-=f.v*dt;f.x+=Math.sin(G.t*2+f.w)*.4;}
    if(G.t-G.doneAt>(G.likes>=1e4?2.4:1.5)&&!G.resultShown){G.resultShown=true;showResult();}
  }
}

/* ---------- drawing ---------- */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function fitFont(x,text,maxW,size,weight=900,fam=FB){x.font=`${weight} ${size}px ${fam}`;const w=x.measureText(text).width;if(w>maxW){size=Math.max(10,size*maxW/w);x.font=`${weight} ${size}px ${fam}`;}return size;}
/* wrap whole parts when they fit, so a line never starts with a lone "が" */
function wrapParts(x,parts,maxW){const out=[];let cur='';for(const t of parts){if(!cur||x.measureText(cur+t).width<=maxW){cur+=t;continue;}if(x.measureText(t).width<=maxW){out.push(cur);cur=t;}else{const ls=wrap(x,cur+t,maxW);cur=ls.pop();out.push(...ls);}}if(cur)out.push(cur);return out;}
function wrap(x,text,maxW){const out=[];let cur='';for(const ch of text){if(x.measureText(cur+ch).width>maxW&&cur){if('、。？！…」）'.includes(ch)){cur+=ch;continue;}out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
function draw(){
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  cx.fillStyle='#f4f2ee';cx.fillRect(0,0,W,H);
  const lay=L();
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillStyle='#1d2430';cx.font=`400 18px ${FD}`;cx.fillText(GAME,W/2,lay.top-16);
  /* reels */
  lay.reels.forEach((b,i)=>{
    const r=G.reels[i];
    cx.save();if(b.k!==undefined){cx.globalAlpha=b.k;cx.translate(0,(1-b.k)*-14);}
    cx.textAlign='left';cx.fillStyle='#6c7480';cx.font=`900 11.5px ${FB}`;cx.fillText(LABELS[i],b.x+4,b.y-9);
    cx.save();rr(cx,b.x,b.y,b.w,b.h,10);cx.fillStyle=r.state==='stopped'?'#fff':'#fbfaf8';cx.fill();
    cx.lineWidth=r.state==='stopped'?2.5:1.5;cx.strokeStyle=r.state==='stopped'?'#1d2430':'#cfc9bf';cx.stroke();cx.clip();
    const base=Math.floor(r.pos),frac=r.pos-base,moving=r.state==='spin'||r.state==='stopping';
    for(let k=-1;k<=1;k++){
      const y=b.y+b.h/2+(k-frac)*b.h;
      const w=reelWord(i,base+k);if(!w)continue;
      cx.globalAlpha=(b.k??1)*(moving?(r.state==='spin'?.55:.8):(k===0?1:0));
      reelText(w.t,'',b,y);
    }
    cx.globalAlpha=b.k??1;
    /* soft fade at the top and bottom of the window */
    const gTop=cx.createLinearGradient(0,b.y,0,b.y+14);gTop.addColorStop(0,'rgba(244,242,238,.9)');gTop.addColorStop(1,'rgba(244,242,238,0)');
    cx.fillStyle=gTop;cx.fillRect(b.x,b.y,b.w,14);
    const gB=cx.createLinearGradient(0,b.y+b.h-14,0,b.y+b.h);gB.addColorStop(0,'rgba(244,242,238,0)');gB.addColorStop(1,'rgba(244,242,238,.9)');
    cx.fillStyle=gB;cx.fillRect(b.x,b.y+b.h-14,b.w,14);
    cx.restore();
    if(i<lay.reels.length-1){cx.fillStyle='#b8b2a8';cx.beginPath();const ax=b.x+b.w/2,ay=b.y+b.h+9;cx.moveTo(ax-6,ay-3);cx.lineTo(ax+6,ay-3);cx.lineTo(ax,ay+3);cx.fill();}
    cx.restore();
  });
  /* the post being written */
  const p=lay.post;
  cx.save();rr(cx,p.x,p.y,p.w,p.h,14);cx.fillStyle='#fff';cx.fill();cx.strokeStyle='#ddd8cf';cx.lineWidth=1.5;cx.stroke();cx.restore();
  cx.fillStyle='#d9d4cb';cx.beginPath();cx.arc(p.x+28,p.y+28,14,0,7);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x+28,p.y+24,5,0,7);cx.fill();cx.beginPath();cx.arc(p.x+28,p.y+37,8,Math.PI,0);cx.fill();
  cx.textAlign='left';cx.fillStyle='#1d2430';cx.font=`900 13px ${FB}`;cx.fillText('あなた',p.x+50,p.y+23);
  cx.fillStyle='#8a919b';cx.font=`700 11px ${FB}`;cx.fillText(G.phase==='idle'?'下書き':'たった今',p.x+50,p.y+38);
  const parts=[];for(const r of G.reels){if(r.state!=='stopped'||!r.pick)break;parts.push(r.pick.t);}
  const typing=G.phase==='spin';
  if(typing&&Math.floor(G.t*2.5)%2)parts.push('｜');
  let fs=17;cx.fillStyle='#1d2430';cx.font=`900 ${fs}px ${FB}`;
  let lines=wrapParts(cx,parts,p.w-28);
  if(lines.length>3){fs=15;cx.font=`900 ${fs}px ${FB}`;lines=wrapParts(cx,parts,p.w-28);}
  lines.slice(0,4).forEach((l,k)=>cx.fillText(l,p.x+16,p.y+64+k*(fs+8)));
  if(G.phase==='idle'&&!played){cx.fillStyle='#a3a9b1';cx.font=`700 14px ${FB}`;cx.fillText('ここにツイートができます',p.x+16,p.y+64);}
  /* likes row inside the post */
  const ly=p.y+p.h-22;
  const n=G.phase==='count'||G.phase==='done'?G.shown:0;
  heart(cx,p.x+24,ly,9,G.phase==='done'?'#e5336b':'#c6c1b8');
  cx.fillStyle=G.phase==='done'?'#e5336b':'#8a919b';cx.font=`900 14px ${FB}`;cx.fillText(G.phase==='count'||G.phase==='done'?fmtLikes(n):'0',p.x+40,ly+1);
  /* the big counter under the post */
  if(G.phase==='count'||G.phase==='done'){
    const cy=p.y+p.h+44;
    if(G.fx)for(const f of G.fx)heart(cx,f.x,f.y,f.s,'rgba(229,51,107,.45)');
    cx.textAlign='center';cx.fillStyle='#6c7480';cx.font=`900 13px ${FB}`;cx.fillText('予想いいね',W/2,cy-28);
    const pop=G.phase==='done'?1+Math.max(0,.18-(G.t-G.doneAt))*1.2:1;
    cx.save();cx.translate(W/2,cy+6);cx.scale(pop,pop);
    cx.fillStyle='#e5336b';fitFont(cx,fmtLikes(n),W-40,48,400,FD);cx.fillText(fmtLikes(n),0,0);cx.restore();
    cx.fillStyle=G.phase==='done'?'#a81c47':'#9aa0a8';cx.font=`900 17px ${FB}`;cx.fillText('【'+tierOf(n)+'】',W/2,cy+48);
  }else if(G.phase==='spin'){
    cx.textAlign='center';cx.fillStyle='#6c7480';cx.font=`900 14px ${FB}`;
    cx.fillText(G.attract?'タップで1つずつ止める':played?'どこをタップしても止まる':'放っておいても止まる',W/2,p.y+p.h+30);
  }
}
/* one line when it fits at a readable size, otherwise two lines; the ending is drawn in pink */
function reelText(t,tail,b,y){
  const full=t+tail,maxW=b.w-22;cx.textAlign='left';
  let fs=fitFont(cx,full,maxW,19);let lines=[full];
  if(fs<14.5){fs=Math.min(15,fitFont(cx,full,maxW*2-10,19)*1.0);cx.font=`900 ${fs}px ${FB}`;lines=wrap(cx,full,maxW);if(lines.length>2){fs=fs*.9;cx.font=`900 ${fs}px ${FB}`;lines=wrap(cx,full,maxW);}}
  const lh=fs*1.18;let off=0;
  lines.slice(0,2).forEach((l,n)=>{
    const ly=y+1+(n-(lines.length-1)/2)*lh;let x=b.x+b.w/2-cx.measureText(l).width/2;
    const cut=Math.max(0,Math.min(l.length,t.length-off));
    cx.fillStyle='#1d2430';cx.fillText(l.slice(0,cut),x,ly);x+=cx.measureText(l.slice(0,cut)).width;
    if(cut<l.length){cx.fillStyle='#e5336b';cx.fillText(l.slice(cut),x,ly);}
    off+=l.length;
  });
}
function heart(x,X,Y,s,col){x.save();x.translate(X,Y);x.fillStyle=col;x.beginPath();x.moveTo(0,s*.9);x.bezierCurveTo(-s*1.4,-s*.1,-s*.7,-s*1.1,0,-s*.35);x.bezierCurveTo(s*.7,-s*1.1,s*1.4,-s*.1,0,s*.9);x.fill();x.restore();}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* tap anywhere on the play screen to stop the next reel */
$('app').addEventListener('pointerdown',e=>{
  if(!$('result').hidden)return;
  if(e.target.closest('#mute,#me'))return;
  if(G.phase==='spin'){if(!e.target.closest('#go'))stopNext(true);}
  else if(G.phase==='count'){G.t0=G.t-G.cdur;}   /* tap to skip the count-up */
  else if(G.phase==='done'&&!G.resultShown&&G.t-G.doneAt>.4){G.resultShown=true;showResult();}
});
$('go').addEventListener('click',()=>{if(G.phase==='spin')stopNext(true);else if(G.phase==='idle')spin();});

/* ---------- result ---------- */
function shareText(){
  /* the format 本人 asked for (11/11): the sentence, three empty lines, then the number, the URL and the tag */
  return `${postText()}\n\n\n\n予想いいね:${fmtLikes(G.likes)}\n${SHARE_URL}\n#ツイートおまかせゲーム`;
}
async function showResult(){
  played=true;
  $('rText').textContent=postText();
  $('rLikes').innerHTML=`予想いいね<b>${fmtLikes(G.likes)}</b>`;
  $('rTitle').textContent='【'+tierOf(G.likes)+'】';
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;$('result').scrollTop=0;
  G.cardFile=null;setShareUI();
  try{$('card').src=await snapshot();$('card').style.visibility='visible';}catch(e){}
  try{const bl=await new Promise(r=>G.cardCanvas.toBlob(r,'image/png'));if(bl)G.cardFile=new File([bl],'omakase-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
/* Two buttons (本人指示 11/11): 「このツイートを投稿」 posts the text only, 「画像付きで投稿」 adds a screenshot of the game screen.
   Phones go through the share sheet, so picking X opens the post inside the X app (also from X's in-app browser).
   Where there is no share sheet (PCs, some in-app browsers) we open the X post page; for the image version we save the picture first. */
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile();
  $('shareImg').disabled=!G.cardFile;
  $('cap').textContent=f||!G.cardFile?'':'「画像付きで投稿」は画像を保存してから投稿画面を開きます。画像は投稿画面で添付してください。';
  $('cap').hidden=!$('cap').textContent;
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
function saveImage(){
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='omakase.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
$('shareX').addEventListener('click',shareTextOnly);
$('shareImg').addEventListener('click',async()=>{
  if(!G.cardFile)return;
  if(!canShareFile()){saveImage();openIntent();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;saveImage();openIntent();}
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;spin();});

/* The image is the play screen itself at its final state, drawn again at a fixed phone size (360x640, 3x),
   cut just below the title, with a thin band for the game name and the creator. */
async function snapshot(){
  try{await document.fonts.ready;}catch(e){}
  const keep={cx,W,H,SC,DPR,fx:G.fx};
  const k=3;W=360;H=640;SC=1;DPR=k;
  const lay=L(),bottom=lay.post.y+lay.post.h+112,band=40;
  const c=document.createElement('canvas');c.width=360*k;c.height=(bottom+band)*k;cx=c.getContext('2d');
  /* still hearts instead of the moving ones */
  const n=G.likes>=1e6?40:G.likes>=1e5?20:G.likes>=1e4?9:0;let sd=h32(sentenceOf(G.ws));const rnd=()=>((sd=Math.imul(sd^sd>>>15,2246822507)>>>0)%1000)/1000;
  G.fx=[...Array(n)].map(()=>({x:rnd()*360,y:lay.post.y+lay.post.h+14+rnd()*90,s:5+rnd()*8,v:0,w:0}));
  const t=G.t,da=G.doneAt;G.doneAt=G.t-5;
  try{draw();}finally{G.doneAt=da;G.t=t;}
  cx.setTransform(k,0,0,k,0,0);
  cx.fillStyle='#1d2430';cx.fillRect(0,bottom,360,band);
  cx.textBaseline='middle';cx.textAlign='left';cx.fillStyle='#fff';cx.font=`400 14px ${FD}`;cx.fillText(GAME,14,bottom+band/2);
  cx.textAlign='right';cx.fillStyle='#ffd23f';cx.font=`700 10px ${FB}`;cx.fillText('予想は適当です　作った人 '+CREATOR,346,bottom+band/2);
  ({cx,W,H,SC,DPR}=keep);G.fx=keep.fx;
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

/* ---------- start ---------- */
spin(true);
window.__omakase={get G(){return G;},postText,spin,stopNext,likesOf,match,tierOf,fmtLikes,shareText,showResult,REELS};
</script>
