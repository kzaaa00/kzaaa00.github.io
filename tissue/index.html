/* Handing out pocket tissues in front of a station at dusk. Tap the moment each passer-by reaches the dotted line: too early and they dodge, too late and they walk past. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}

<body>

<script>
const $=id=>document.getElementById(id);
const GAME='駅前のティッシュを、10人全員に受け取らせろ。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://tapitta.com/tissue/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');
const DISP=getComputedStyle(document.documentElement).getPropertyValue('--display');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const NP=10;        /* ten people walk past */
const WPX=3.8;      /* tap while the person's body is within 3.8 px of the dotted line: they take it. In time that is WPX/speed */
const AS=.6;        /* a tap belongs to the person whose moment is nearest, if within 0.6 s */
/* walkers: speed px/s and look. All fictional. */
const TYPES=[
  {k:'salary',v:165,coat:'#2f3a55',coat2:'#222a3f',pants:'#262b38',skin:'#f0c8a4',hair:'#2a2420',bag:'#4a3626',h:96},
  {k:'student',v:105,coat:'#3b4a6b',coat2:'#2a3550',pants:'#4a4f62',skin:'#f3cdb0',hair:'#1f1a18',phone:true,skirt:true,h:88},
  {k:'granny',v:70,coat:'#a47a8a',coat2:'#8b6473',pants:'#6b5a52',skin:'#efc9aa',hair:'#d9d6d2',bent:true,h:80},
  {k:'runner',v:240,coat:'#e0563b',coat2:'#c2432c',pants:'#2b2f3a',skin:'#e8b892',hair:'#2a2018',run:true,h:94},
  {k:'office',v:135,coat:'#c9b08a',coat2:'#b39872',pants:'#3a3236',skin:'#f4d0b3',hair:'#4a3020',bag:'#8a2f3a',h:90},
  {k:'uncle',v:150,coat:'#6b5642',coat2:'#56442f',pants:'#3c3a36',skin:'#e6bd98',hair:'#3a342e',cap:true,h:92}];

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('tissue-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}

const SFX={
  swish(){noise(.07,.05,3500,0,'highpass');},
  take(){tone(880,.06,'sine',.05,0,1100);noise(.05,.04,4500,0,'highpass');},
  dodge(){tone(300,.12,'triangle',.05,0,220);},
  miss(){tone(240,.14,'sine',.04,0,180);},
  happy(){tone(880,.1,'sine',.05,0,1320);tone(1320,.12,'sine',.05,.12,1760);tone(1760,.2,'sine',.04,.26,2200);},
  ok(){tone(660,.09,'sine',.045,0,880);tone(990,.14,'sine',.04,.1,1100);},
  sad(){tone(330,.3,'triangle',.05,0,220);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('tissue-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1,BG=null,BGkey='';
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',()=>resize());try{visualViewport.addEventListener('resize',()=>resize());}catch(e){}
resize();
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- layout: the sidewalk in front of a station at dusk; people walk left to right on the lane ---------- */
const MX=180;   /* the dotted line: where you hand it over */
const WS=1.45;  /* walkers are drawn 1.45x */
function L(){const lane=Math.round(clamp(H*.64,340,H-170));return {lane,sky:lane-170};}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function newGame(seed){ROUND++;const R=mulberry(seed||((Date.now()&0xffff)+ROUND*977));
  const now=performance.now();let t=now+1500;const P=[];const order=[];
  for(let i=0;i<NP;i++){let k;do{k=Math.floor(R()*TYPES.length);}while(order.length&&k===order[order.length-1]);order.push(k);}
  for(let i=0;i<NP;i++){const ty=TYPES[order[i]];if(i)t+=Math.max(950,(1050+R()*650)*(ty.v<90?1.25:1));P.push({ty,tr:t,state:'come',dt:null,ts:null,d:(R()-.5)*6});}
  G={phase:'play',t0:now,P,taps:[],arm:-1e9,res:null,shown:false,plan:null,snap:null,snapped:false,round:ROUND,end:t+900};}
function tsOf(e){const n=performance.now();const t=e&&e.timeStamp;return (t&&Math.abs(n-t)<1000)?t:n;}
function tap(t){
  if(!G||G.phase!=='play')return;ac();G.arm=t;SFX.swish();
  let best=null,bd=1e9;for(const p of G.P){if(p.state!=='come')continue;const d=Math.abs(t-p.tr);if(d<bd){bd=d;best=p;}}
  if(!best||bd>AS*1000){G.taps.push({t,p:null});return;}
  const dt=(t-best.tr)/1000,win=WPX/best.ty.v;best.dt=dt;best.ts=t;
  if(Math.abs(dt)<=win){best.state='take';SFX.take();G.snapAt=t+140;}
  else if(dt<0){best.state='dodge';SFX.dodge();}
  else{best.state='late';SFX.miss();}
  G.taps.push({t,p:best});
}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='play'||G.plan)return;e.preventDefault();tap(tsOf(e));try{if(navigator.vibrate)navigator.vibrate(8);}catch(err){}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function step(now){
  if(G.phase==='play'){
    if(G.plan){for(let i=0;i<NP;i++){const p=G.P[i],o=G.plan[i];if(o===null||o===undefined||p.planned)continue;if(now>=p.tr+o*1000){p.planned=true;tap(p.tr+o*1000);}}}
    for(const p of G.P)if(p.state==='come'&&now>p.tr+AS*1000)p.state='pass';
    if(G.snapAt&&now>=G.snapAt){G.snapAt=0;takeSnap();}
    if(now>=G.end&&G.P.every(p=>p.state!=='come')){finish(now);}
  }
  if(G.phase==='done'){const a=(now-G.tj)/1000;
    if(!G.played&&a>=1.3){G.played=true;const k=G.res.k;if(k===NP)SFX.happy();else if(k>=7)SFX.ok();else if(k<=2)SFX.sad();}
    if(!G.snapped&&!G.snap&&a>=.3){G.snapped=true;takeSnap();}
    if(a>=2.4&&!G.shown){G.shown=true;showResult();}}
}
function finish(now){
  const P=G.P;const k=P.filter(p=>p.state==='take').length,e=P.filter(p=>p.state==='dodge').length,l=P.filter(p=>p.state==='late').length,n=P.filter(p=>p.state==='pass').length;
  const ds=P.filter(p=>p.dt!==null).map(p=>p.dt);const avg=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0;
  G.res={k,early:e,late:l,none:n,avg,taps:ds.length};G.phase='done';G.tj=now;
}

/* ---------- drawing ---------- */
function bg(){
  const key=W+'x'+H+'@'+DPR*SC;if(BG&&BGkey===key)return BG;
  const c=document.createElement('canvas');c.width=Math.round(W*SC*DPR);c.height=Math.round(H*SC*DPR);const x=c.getContext('2d');x.scale(SC*DPR,SC*DPR);
  const {lane,sky}=L(),bk=lane-185;
  /* dusk sky */
  let g=x.createLinearGradient(0,0,0,bk+40);g.addColorStop(0,'#2b2d5c');g.addColorStop(.55,'#8a5a86');g.addColorStop(1,'#f2a06b');x.fillStyle=g;x.fillRect(0,0,W,bk+40);
  for(let i=0;i<20;i++){x.fillStyle=`rgba(255,255,255,${.3+rnd(i)*.5})`;x.beginPath();x.arc(rnd(i+1)*W,rnd(i+2)*(bk*.45),.6+rnd(i+3)*.8,0,7);x.fill();}
  /* far buildings, blurred */
  x.save();x.shadowColor='rgba(30,20,50,.6)';x.shadowBlur=6*SC*DPR;
  for(let i=0;i<9;i++){const bw=40+rnd(i+10)*50,bh=60+rnd(i+11)*120,bx=i*44-20;x.fillStyle=`rgba(${50+rnd(i)*20},${40+rnd(i)*15},${70+rnd(i)*20},.92)`;x.fillRect(bx,bk+40-bh,bw,bh);
    for(let r=0;r<bh/14-1;r++)for(let q=0;q<bw/12-1;q++)if(rnd(i*97+r*13+q)<.45){x.fillStyle=`rgba(255,${200+rnd(r+q)*40},${120+rnd(q)*60},.75)`;x.fillRect(bx+5+q*12,bk+40-bh+6+r*14,6,7);}}
  x.restore();
  /* the station front: a canopy, a lit sign and the entrance */
  const sy=bk-20;
  g=x.createLinearGradient(0,sy,0,lane-20);g.addColorStop(0,'#5a5866');g.addColorStop(1,'#3b3a45');x.fillStyle=g;x.fillRect(0,sy,W,lane-20-sy);
  x.fillStyle='#2a2933';x.fillRect(0,sy,W,10);
  x.save();x.shadowColor='rgba(255,240,200,.9)';x.shadowBlur=16*SC*DPR;x.fillStyle='#fdf6e4';rr(x,96,sy-34,168,30,5);x.fill();x.restore();
  x.fillStyle='#1d3d7a';x.font='400 17px '+DISP;x.textAlign='center';x.textBaseline='middle';x.fillText('ほしぞら駅',180,sy-19);
  x.fillStyle='#e0563b';x.fillRect(100,sy-10,160,3);
  /* entrance light and shops */
  g=x.createLinearGradient(0,sy+10,0,lane-20);g.addColorStop(0,'rgba(255,230,170,.95)');g.addColorStop(1,'rgba(255,200,130,.75)');x.fillStyle=g;x.fillRect(120,sy+22,120,lane-42-sy);
  x.fillStyle='rgba(60,50,70,.6)';for(let i=0;i<4;i++)x.fillRect(120+i*40,sy+22,3,lane-42-sy);
  for(const [sx,col,t] of [[14,'#ffcf5a','カラオケ'],[262,'#7fd6ff','カフェ']]){x.save();x.shadowColor=col;x.shadowBlur=12*SC*DPR;x.fillStyle=col;rr(x,sx,sy+20,84,22,4);x.fill();x.restore();
    x.fillStyle='#2a2430';x.font='900 11px '+BODYF();x.fillText(t,sx+42,sy+31);x.fillStyle='rgba(255,220,160,.5)';x.fillRect(sx+6,sy+50,72,lane-72-sy);}
  /* blurred crowd at the entrance */
  x.save();x.shadowColor='rgba(20,15,30,.8)';x.shadowBlur=8*SC*DPR;for(let i=0;i<14;i++){const px=20+rnd(i+60)*320,ph=40+rnd(i+61)*16;x.fillStyle=`rgba(${40+rnd(i)*40},${35+rnd(i+1)*30},${55+rnd(i+2)*30},.75)`;rr(x,px-8,lane-28-ph,16,ph,7);x.fill();x.beginPath();x.arc(px,lane-34-ph,7,0,7);x.fill();}x.restore();
  /* the sidewalk: tiles in perspective */

  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('10人中、受け取った人',w/2,32);
  const fl=failed(),n=fl?bigWord():pct(),u=fl?'':'%';let fs=fl?64:96;x.font=`400 ${fs}px ${Df}`;let tw=x.measureText(n).width;
  while(tw*1.3>w-30&&fs>40){fs-=4;x.font=`400 ${fs}px ${Df}`;tw=x.measureText(n).width;}
  x.font=`400 ${Math.round(fs*.45)}px ${Df}`;const pw=u?x.measureText(u).width+4:0;
  const sx=(w-(tw+pw))/2;x.textAlign='left';x.fillStyle='#d9542f';x.font=`400 ${fs}px ${Df}`;x.fillText(n,sx,124);
  if(u){x.font=`400 ${Math.round(fs*.45)}px ${Df}`;x.fillText(u,sx+tw+4,124);}
  x.textAlign='center';x.fillStyle='#24262b';let ss=17;x.font=`900 ${ss}px ${F}`;while(x.measureText(statusLine()).width>w-20&&ss>11){ss-=.5;x.font=`900 ${ss}px ${F}`;}x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#e2cfb6';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(feedback()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(feedback(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}

window.__tissue={get G(){return G;},begin,play,tap,shareText,showResult,score,L,MX,WPX,TYPES,NP};
