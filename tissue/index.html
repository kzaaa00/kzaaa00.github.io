<style>

/* A tissue box on a living-room table. Pull the sheet up at just the right speed: too fast and the next ones come along, too slow and the next one stays in. */
:root{
  --ink:#24262b; --muted:#6f7480; --paper:#f7f6f2; --red:#c8402c; --red-d:#8f2a1b; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2a27}
body{font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#b37a46;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-3px)}45%{transform:translate(-6px,2px)}60%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}}

.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}

.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font:900 18px var(--body);padding:15px 0;width:min(100%,300px);box-shadow:0 5px 0 var(--red-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}

#result{background:var(--paper);justify-content:flex-start;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#result .sheet{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;text-align:left}
#result h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:3px solid var(--ink);padding-bottom:6px}
#rScore{margin:0;font-size:17px;font-weight:900;line-height:1.1}
#rScore b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);font-variant-numeric:tabular-nums;margin-top:2px}

#card{width:100%;border-radius:10px;border:1px solid #d6d8dc;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#result .cap{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 -4px}

<body>
<div id="app">
  <canvas id="cv" aria-label="リビングのテーブルの上のティッシュの箱。1枚だけ上に出ている"></canvas>

  <div id="title" class="panel"><div class="tcard">
    <h1>ティッシュを、<br>1枚だけ<br>引き抜け。</h1>
    <p style="margin:0 0 16px;font-size:13px;line-height:1.6">上へ引いて1枚とる。<br>速すぎると2枚目もついてくる。<br>遅いと次のティッシュが出てこない。</p>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine">登場するものはすべて架空です。音が出ます。<br><a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
  </div></div>

  <div id="result" class="panel" hidden>
    <div class="sheet">
      <h2>ティッシュの結果</h2>
      <p id="rScore"></p>
      <p id="rCount"></p>
      <p id="rTitle"></p>
      <p id="rSub"></p>
      <p class="cap" id="cap">画像を長押し（PCは右クリック）で保存できます。</p>
      <div class="btns">
        <button class="btn" id="retry" type="button">もう一回</button>
        <button class="btn x" id="shareX" type="button">Xで共有</button>
        <button class="btn ghost" id="saveImg" type="button" hidden>画像を保存</button>
        <button class="link" id="textOnly" type="button" hidden>文字だけでXに投稿</button>
      </div>
      <img id="card" alt="結果と、引き抜いたあとのティッシュの箱">
      <p class="fine">登場するものはすべて架空です。<a class="me" href="https://x.com/ordwxjhj" target="_blank" rel="noopener">作った人 @ordwxjhj</a></p>
    </div>
  </div>

  <button id="mute" type="button" aria-pressed="false">音 ON</button>
</div>

<script>
const $=id=>document.getElementById(id);
const GAME='ティッシュを、1枚だけ引き抜け。';
const CREATOR='@ordwxjhj';
const SHARE_URL=(()=>{const h=location.href;if(/^https?:/.test(h)&&!/claude\.ai|claudeusercontent/.test(h))return h.split('#')[0].split('?')[0];return 'https://tapitta.com/tissue/';})();
const BODYF=()=>getComputedStyle(document.documentElement).getPropertyValue('--body');
const DISP=getComputedStyle(document.documentElement).getPropertyValue('--display');

/* ---------- the rules (sim.js uses the same numbers) ---------- */
const D=120;       /* pull the tissue up this far (px) and it leaves the box: the speed is judged there */
const S0=3;        /* the pull starts counting once the finger has moved this far */
const V0=520;      /* the right speed, px per second, averaged over the whole pull (S0..D) */
const OK=.0006;    /* within 0.06% of it counts as exactly right (100.0%) */
const SLOW=-.5,FAST=.5; /* slower than half: the next tissue falls back into the box. Faster than 1.5x: a whole bunch comes out */

/* ---------- audio ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('tissue-mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
let NB=null;
function nbuf(){if(!NB){const len=AC.sampleRate*1;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(dur,vol,freq,delay=0,type='bandpass',q=1){
  if(muted||!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02);
}
function tone(f,dur,type='sine',vol=.05,delay=0,f2){
  if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}

const SFX={
  rustle(){noise(.12,.05,4200,0,'highpass');},
  pull(v){noise(.16,.07+.06*v,2600+1800*v,0,'bandpass',.7);},
  pop(){tone(520,.08,'sine',.05,0,880);noise(.05,.04,5000,0,'highpass');},
  flutter(d){noise(.09,.035,3000+Math.random()*2000,d,'bandpass',2);},
  sink(){tone(400,.25,'triangle',.05,0,170);},
  burst(){noise(.6,.25,2200,0,'bandpass',.5);noise(.3,.15,6000,.05,'highpass');},
  happy(){tone(880,.1,'sine',.05,0,1320);tone(1320,.12,'sine',.05,.12,1760);tone(1760,.2,'sine',.04,.26,2200);},
  ok(){tone(660,.09,'sine',.045,0,880);tone(990,.14,'sine',.04,.1,1100);}
};
function syncMute(){$('mute').textContent=muted?'音 OFF':'音 ON';$('mute').setAttribute('aria-pressed',String(muted));}
syncMute();
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('tissue-mute',muted?'1':'0');}catch(err){}syncMute();});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- canvas ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
let W=360,H=640,SC=1,DPR=1,BG=null,BGkey='';
function resize(){
  const r=$('app').getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);
  SC=r.width/360;W=360;H=r.height/SC;cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
}
addEventListener('resize',()=>resize());try{visualViewport.addEventListener('resize',()=>resize());}catch(e){}
resize();
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function ease(e){e=clamp(e,0,1);return e*e*(3-2*e);}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);}

/* ---------- layout: the box sits on a living-room table; By is the front edge of its top ---------- */
const CXB=180,BXW=118,BXB=98,BFH=96,TOPD=46,REST=66;
function L(){const By=Math.round(clamp(H*.6,330,H-170));const slit=By-TOPD/2;return {By,slit,tip0:slit-REST,line:slit-REST-D,Tt:By-112};}

/* ---------- state ---------- */
let G=null,ROUND=0,PREV=null,PID=null;
function newGame(){ROUND++;G={phase:'ready',t0:performance.now(),pull:0,drag:null,res:null,shown:false,plan:undefined,snap:null,snapped:false,round:ROUND,tj:0,fx:0};}

/* ---------- input: one pull up ---------- */
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='ready'||PID!==null)return;e.preventDefault();ac();PID=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}
  const P=pt(e);G.drag={y0:P.y,x0:P.x,pts:[[e.timeStamp||performance.now(),0]]};G.phase='pull';SFX.rustle();try{if(navigator.vibrate)navigator.vibrate(8);}catch(err){}});
cv.addEventListener('pointermove',e=>{if(!G||!G.drag||e.pointerId!==PID)return;
  let evs=[e];try{const c=e.getCoalescedEvents&&e.getCoalescedEvents();if(c&&c.length)evs=c;}catch(err){}
  for(const ev of evs){const P=pt(ev);G.fx=clamp((P.x-G.drag.x0)*.25,-14,14);addPoint(ev.timeStamp||performance.now(),G.drag.y0-P.y);if(G.phase!=='pull')break;}});
const upH=e=>{if(e.pointerId!==PID)return;PID=null;if(G&&G.phase==='pull'){G.phase='ready';G.drag=null;G.back=performance.now();G.backFrom=G.pull;G.pull=0;G.fx=0;}};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* the tissue follows the finger 1:1; the moment it has come up D it leaves the box and the speed is judged */
function addPoint(t,dy){
  const d=G.drag;d.pts.push([t,dy]);G.pull=clamp(dy,0,D);
  if(dy>=D){const v=avgSpeed(d.pts);G.lastPts=d.pts;G.drag=null;judge(v,t);}
}
function crossT(pts,y){for(let i=1;i<pts.length;i++)if(pts[i][1]>=y){const a=pts[i-1],b=pts[i];return a[0]+(b[0]-a[0])*((y-a[1])/Math.max(1e-6,b[1]-a[1]));}return pts[pts.length-1][0];}
/* where the finger started moving: touch screens send no events while the finger rests, so after a pause the step from
   the resting point to the first move is not part of the pull; take the start from the pace of the first moves instead (potechi 11/23) */
function startT(pts){const i=pts.findIndex(p=>p[1]>=S0);if(i<1)return pts[0][0];const a=pts[i-1],b=pts[i];
  if(b[0]-a[0]<=40)return a[0]+(b[0]-a[0])*((S0-a[1])/Math.max(1e-6,b[1]-a[1]));
  let j=i+1;while(j<pts.length-1&&pts[j][0]-b[0]<24)j++;const c=pts[Math.min(j,pts.length-1)];
  const v=(c[1]-b[1])/Math.max(1,c[0]-b[0]);return v>0?b[0]-(b[1]-S0)/v:b[0];}
function avgSpeed(pts){const t0=startT(pts),t1=crossT(pts,D);return (D-S0)/Math.max(1,(t1-t0))*1000;}

function judge(v,t){
  const r=v/V0-1;
  let kind;
  if(Math.abs(r)<=OK)kind='clean';
  else if(r<SLOW)kind='slip';
  else if(r>FAST)kind='rip';
  else kind=r<0?'slow':'fast';
  const d=r*100;
  /* too fast: the next sheets come along, 1 more for every 3 %; a burst brings out a big bunch */
  const fly=kind==='fast'?Math.max(1,Math.round(d/3)):kind==='rip'?36:0;
  /* too slow: the next tissue is not pulled up all the way; 1 % too slow leaves it 2 % lower */
  const open=kind==='slow'?clamp(1+2*r,.04,1):kind==='slip'?0:1;
  G.res={v,r,d,kind,fly,open,dev:devOf(d,kind)};G.phase='out';G.tj=t||performance.now();G.vout=v;
  const {By}=L();
  G.sheets=[];for(let i=0;i<Math.min(fly,40);i++){const side=(i%2?1:-1)*(kind==='rip'?1:1),k=rnd(i*7+ROUND);
    G.sheets.push({delay:.05+i*(kind==='rip'?.025:.07),vx:side*(40+k*(kind==='rip'?230:120)),vy:-(kind==='rip'?520+rnd(i*3)*500:380+rnd(i*3)*160),
      land:{x:clamp(CXB+side*(60+rnd(i*5+ROUND)*(kind==='rip'?150:90)),20,W-20),y:By+BFH-6+rnd(i*11+ROUND)*Math.max(20,H-By-BFH-20)},rot:(rnd(i*13)-.5)*1.6,s:.8+rnd(i*17)*.35});}
  if(kind==='rip'){SFX.burst();anim($('app'),'shake');}
  else SFX.pull(clamp(r*2,0,1));
  for(let i=0;i<Math.min(8,fly);i++)SFX.flutter(.1+i*.07);
  if(kind==='clean'||kind==='fast'||kind==='slow')SFX.pop();
  if(kind==='slip')setTimeout(()=>SFX.sink(),350);
  G.endIn=kind==='rip'?2900:2500;
}
function devOf(d,kind){const a=Math.abs(d);if(kind==='clean')return 0;return Math.max(.1,Math.ceil(a*10-1e-9)/10);}

function step(now){
  if(G.phase==='ready'&&G.plan!==undefined&&now-G.t0>=500){
    const v=V0*(1+G.plan/100);G.phase='pull';G.drag={y0:0,x0:0,pts:[[now,0]],auto:v,ta:now};SFX.rustle();}
  if(G.phase==='pull'&&G.drag&&G.drag.auto){const d=G.drag;const dy=(now-d.ta)/1000*d.auto;
    if(dy>=D){d.pts.push([d.ta+D/d.auto*1000,D]);G.pull=D;G.lastPts=d.pts;G.drag=null;judge(d.auto,d.ta+D/d.auto*1000);}else{d.pts.push([now,dy]);G.pull=dy;}}
  if(G.phase==='out'){
    const a=(now-G.tj)/1000;
    if(!G.played&&a>=1.3){G.played=true;const r=G.res;if(r.dev<1&&!failed(r))SFX.happy();else if(!failed(r))SFX.ok();}
    if(!G.snapped&&a*1000>=G.endIn-500){G.snapped=true;takeSnap();}
    if(a*1000>=G.endIn&&!G.shown){G.shown=true;showResult();}
  }
}

/* ---------- drawing: a cosy living room, the box lit by a window on the left ---------- */
function bg(){
  const key=W+'x'+H+'@'+DPR*SC;if(BG&&BGkey===key)return BG;
  const c=document.createElement('canvas');c.width=Math.round(W*SC*DPR);c.height=Math.round(H*SC*DPR);const x=c.getContext('2d');x.scale(SC*DPR,SC*DPR);
  const {By,Tt}=L();
  /* wall */
  let g=x.createLinearGradient(0,0,W,Tt);g.addColorStop(0,'#f6ecdd');g.addColorStop(1,'#e2cfb6');x.fillStyle=g;x.fillRect(0,0,W,Tt+2);
  for(let i=0;i<14;i++){x.fillStyle=`rgba(170,130,90,${i%2?.05:.025})`;x.fillRect(i*28,0,14,Tt);}
  /* window light falling on the wall, soft */
  x.save();x.globalAlpha=.55;g=x.createRadialGradient(70,Tt*.35,10,70,Tt*.35,Tt*.9);g.addColorStop(0,'rgba(255,250,225,1)');g.addColorStop(1,'rgba(255,250,225,0)');x.fillStyle=g;x.fillRect(0,0,W,Tt);x.restore();
  x.save();x.translate(30,Tt*.08);x.transform(1,0,-.25,1,0,0);for(let i=0;i<2;i++)for(let j=0;j<2;j++){g=x.createLinearGradient(0,0,0,Tt*.4);g.addColorStop(0,'rgba(255,252,235,.55)');g.addColorStop(1,'rgba(255,252,235,.1)');x.fillStyle=g;rr(x,i*58,j*(Tt*.22),50,Tt*.19,4);x.fill();}x.restore();
  /* out-of-focus background: a lamp glow, a plant and a frame */
  g=x.createRadialGradient(W-40,Tt*.3,4,W-40,Tt*.3,110);g.addColorStop(0,'rgba(255,214,140,.75)');g.addColorStop(1,'rgba(255,214,140,0)');x.fillStyle=g;x.fillRect(0,0,W,Tt);
  x.save();x.shadowColor='rgba(60,100,50,.6)';x.shadowBlur=14*SC*DPR;for(let i=0;i<16;i++){x.fillStyle=`rgba(${70+rnd(i)*30},${120+rnd(i+1)*40},${60+rnd(i+2)*20},.55)`;x.beginPath();x.ellipse(W-70+(rnd(i+3)-.5)*70,Tt-40-rnd(i+4)*90,16,8,rnd(i+5)*3,0,7);x.fill();}x.restore();

  if(r.kind==='slip')return '箱に指をつっこむ人';
  if(r.kind==='rip')return 'ティッシュの雪を降らせた人';
  if(r.kind==='clean')return 'ティッシュ職人';
  if(r.dev<1)return 'ほぼ職人';
  if(r.kind==='fast'){if(r.fly<=1)return 'うっかり2枚取りの人';if(r.fly<=4)return 'ちょっと多めに取る人';return 'ティッシュをばらまく人';}
  if(r.dev<5)return 'ちょっと慎重な人';if(r.dev<20)return '次が出てこない人';return '次が沈みかけの人';
}
function lineOf(r){
  if(r.kind==='clean')return 'ちょうど（1枚だけ）';
  const w=r.kind==='slip'?'（次が箱に落ちた）':r.kind==='rip'?'（ごっそり出た）':r.kind==='slow'?'（次が'+Math.round(r.open*100)+'%しか出ない）':'（'+(r.fly+1)+'枚出た）';
  return 'ちょうどより'+r.dev.toFixed(1)+'%'+(r.d<0?'遅い':'速い')+w;
}
function feedback(){return '引く速さ：'+lineOf(G.res);}
function shareText(){
  return `ティッシュを、1枚だけ引き抜け　${failed()?bigWord():'ぴったり度'+pct()+'%'}（${statusLine()}）【${titleOf()}】\n${SHARE_URL}`;
}
async function showResult(){
  const r=G.res;
  $('rScore').innerHTML=failed(r)?`ぴったり度<b>${bigWord(r)}</b>`:`ぴったり度<b>${pct()}<small>%</small></b>`;
  $('rCount').textContent=statusLine();
  $('rTitle').textContent='【'+titleOf()+'】';
  const lines=[feedback()];
  if(PREV)lines.push('前の回：'+lineOf(PREV));
  $('rSub').innerHTML=lines.map(s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
  PREV=r;
  $('card').style.visibility='hidden';$('result').hidden=false;$('mute').hidden=true;
  G.cardFile=null;setShareUI();
  try{$('card').src=await drawCard();$('card').style.visibility='visible';}catch(e){}
  try{const b=await new Promise(res=>G.cardCanvas.toBlob(res,'image/png'));if(b)G.cardFile=new File([b],'tissue-result.png',{type:'image/png'});}catch(e){}
  setShareUI();
}
const TOUCH=matchMedia('(pointer:coarse)').matches;
function canShareFile(){
  try{return TOUCH&&!!G.cardFile&&!!navigator.share&&!!navigator.canShare&&navigator.canShare({files:[G.cardFile],text:'x'});}catch(e){return false;}
}
function canShareText(){return TOUCH&&!!navigator.share;}
function setShareUI(){
  const f=canShareFile(),t=canShareText();
  $('shareX').textContent=f?'結果画像つきでXに共有':'Xで共有';
  $('textOnly').hidden=!f;
  $('saveImg').hidden=f||!G.cardFile;
  $('cap').textContent=f?'共有メニューでXを選ぶと、画像つきで投稿できます。':t?'共有メニューでXを選んでください。結果画像は「画像を保存」か、下の画像の長押しで保存できます。':'結果画像は「画像を保存」か、下の画像の長押しで保存できます。';
}
function openIntent(){
  const url='https://x.com/intent/post?text='+encodeURIComponent(shareText());
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
async function shareTextOnly(){
  if(!canShareText()){openIntent();return;}
  try{await navigator.share({text:shareText()});}catch(e){if(e&&e.name==='AbortError')return;openIntent();}
}
$('shareX').addEventListener('click',async()=>{
  if(!canShareFile()){shareTextOnly();return;}
  try{await navigator.share({files:[G.cardFile],text:shareText()});}
  catch(e){if(e&&e.name==='AbortError')return;shareTextOnly();}
});
$('textOnly').addEventListener('click',shareTextOnly);
$('saveImg').addEventListener('click',()=>{
  if(!G.cardFile)return;const u=URL.createObjectURL(G.cardFile);
  const a=document.createElement('a');a.href=u;a.download='tissue-result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
});
$('retry').addEventListener('click',()=>{$('result').hidden=true;$('mute').hidden=false;begin();});


async function drawCard(){
  try{await document.fonts.ready;}catch(e){}
  if(!G.snap)takeSnap();
  const k=3,w=360,F='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',Df='"Dela Gothic One",sans-serif';
  const {y0,y1}=cropBox(),sh=y1-y0;
  const hd=212,top0=hd,fbTop=top0+sh+3,fbH=44,band=46,bottom=fbTop+fbH;
  const c=document.createElement('canvas');c.width=w*k;c.height=(bottom+band)*k;const x=c.getContext('2d');x.scale(k,k);
  x.fillStyle='#f7f6f2';x.fillRect(0,0,w,hd);
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle='#6f7480';x.font=`900 16px ${F}`;x.fillText('ぴったり度',w/2,32);
  const fl=failed(),n=fl?bigWord():pct(),u=fl?'':'%';let fs=fl?64:96;x.font=`400 ${fs}px ${Df}`;let tw=x.measureText(n).width;
  while(tw*1.3>w-30&&fs>40){fs-=4;x.font=`400 ${fs}px ${Df}`;tw=x.measureText(n).width;}
  x.font=`400 ${Math.round(fs*.45)}px ${Df}`;const pw=u?x.measureText(u).width+4:0;
  const sx=(w-(tw+pw))/2;x.textAlign='left';x.fillStyle='#2f7f68';x.font=`400 ${fs}px ${Df}`;x.fillText(n,sx,124);
  if(u){x.font=`400 ${Math.round(fs*.45)}px ${Df}`;x.fillText(u,sx+tw+4,124);}
  x.textAlign='center';x.fillStyle='#24262b';let ss=17;x.font=`900 ${ss}px ${F}`;while(x.measureText(statusLine()).width>w-20&&ss>11){ss-=.5;x.font=`900 ${ss}px ${F}`;}x.fillText(statusLine(),w/2,160);
  x.fillStyle='#8f2a1b';x.font=`900 19px ${F}`;x.fillText('【'+titleOf()+'】',w/2,192);
  x.fillStyle='#24262b';x.fillRect(0,top0-3,w,3);
  try{x.drawImage(G.snap,0,0,G.snap.width,G.snap.height,0,top0,w,sh);}catch(e){x.fillStyle='#e2cfb6';x.fillRect(0,top0,w,sh);}
  x.fillStyle='#24262b';x.fillRect(0,fbTop-3,w,3);x.fillStyle='#f7f6f2';x.fillRect(0,fbTop,w,fbH);
  x.fillStyle='#6f7480';let ff=14;x.font=`700 ${ff}px ${F}`;while(x.measureText(feedback()).width>w-20&&ff>10){ff-=.5;x.font=`700 ${ff}px ${F}`;}
  x.textBaseline='middle';x.fillText(feedback(),w/2,fbTop+fbH/2);
  x.fillStyle='#24262b';x.fillRect(0,bottom,w,band);
  x.textAlign='left';x.fillStyle='#fff';let gs=14;x.font=`400 ${gs}px ${Df}`;
  x.save();x.font=`700 9.5px ${F}`;const cw=x.measureText('作った人 '+CREATOR).width;x.restore();
  while(x.measureText(GAME).width>w-28-cw-10&&gs>8){gs-=.5;x.font=`400 ${gs}px ${Df}`;}
  x.fillText(GAME,12,bottom+band/2);
  x.textAlign='right';x.fillStyle='#ffd23f';x.font=`700 9.5px ${F}`;x.fillText('作った人 '+CREATOR,w-12,bottom+band/2);
  G.cardCanvas=c;
  return c.toDataURL('image/png');
}


/* ---------- start ---------- */
function begin(){PID=null;newGame();resize();$('title').hidden=true;$('result').hidden=true;$('mute').hidden=false;}
$('startBtn').addEventListener('click',()=>{ac();begin();});
/* for checks and recording: play(d) pulls at a steady speed d % from the right one, 0.5 s after the start */
function play(d){begin();G.plan=d;}
window.__tissue={get G(){return G;},begin,play,shareText,showResult,score,L,avgSpeed,startT,judge,D,S0,V0,OK};

</script>
